    if (!tg) return;
    var open = !document.body.classList.contains('stu-sec-closed'), c = cur();
    tg.innerHTML = '☰ 目錄<b>' + (c ? '目前：' + label(c) : '') + '</b><i>' + (open ? '收起 ▲' : '展開 ▼') + '</i>';
    if (!open) return;
    var all = btns(), by = {};
    all.forEach(function (b, i) { var k = catOf(b); (by[k] = by[k] || []).push(i); });
    if (!cat || !by[cat]) cat = c ? catOf(c) : ORDER.filter(function (k) { return by[k]; })[0];
    pan.innerHTML = '<div class="stu-cats">' + ORDER.filter(function (k) { return by[k]; }).map(function (k) { return '<button type="button" data-c="' + k + '" class="' + (k === cat ? 'on' : '') + '">' + k + '</button>'; }).join('') + '</div>' +
      '<div class="stu-items">' + (by[cat] || []).map(function (i) { var b = all[i]; return '<button type="button" data-i="' + i + '" class="' + (b === c ? 'on' : '') + '">' + label(b).replace(/[&<>]/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[x]; }) + '</button>'; }).join('') + '</div>';
  }
  function setup() {
    var sec = document.getElementById('wk-sections');
    if (!sec || tg) return !!tg;
    tg = document.createElement('button'); tg.type = 'button'; tg.className = 'stu-sec-tg';
    pan = document.createElement('div'); pan.className = 'stu-sec-pan';
    sec.parentNode.insertBefore(tg, sec); sec.parentNode.insertBefore(pan, sec);
    document.body.classList.add('stu-sec-closed');
    tg.onclick = function () { if (document.body.classList.toggle('stu-sec-closed') === false) cat = ''; paint(); };
    pan.addEventListener('click', function (e) {
      var k = e.target.closest('[data-c]'), it = e.target.closest('[data-i]');
      if (k) { cat = k.getAttribute('data-c'); paint(); }
      else if (it) { var b = btns()[+it.getAttribute('data-i')]; if (b) b.click(); document.body.classList.add('stu-sec-closed'); paint(); }
    });
    new MutationObserver(function () { setTimeout(paint, 0); }).observe(sec, { subtree: true, attributes: true, attributeFilter: ['class'], childList: true });
    paint();
    return true;
  }
  if (!setup()) { var n = 0, t = setInterval(function () { if (setup() || ++n > 40) clearInterval(t); }, 250); }

  /* ── 左右滑動換頁：在投影片上水平滑（至少 60px、比垂直多一倍半、0.7 秒內） ── */
  var sx = 0, sy = 0, st = 0, ok = false;
  function inArea(el) { return el && el.closest && (el.closest('#wk-slide-area') || el.closest('#wkfs-body')); }
  function scrollsX(el) {
    for (; el && el !== document.body; el = el.parentElement) {
      var ox = getComputedStyle(el).overflowX;
      if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth + 2) return true;
    }
    return false;
  }
  document.addEventListener('touchstart', function (e) {
    ok = false;
    if (!phone() || e.touches.length !== 1 || !inArea(e.target)) return;
    if (e.target.closest('input,select,textarea,[contenteditable="true"]') || scrollsX(e.target)) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); ok = true;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!ok) return; ok = false;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > 700 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (window.getSelection && String(window.getSelection())) return;
    if (dx < 0 && typeof wkNext === 'function') wkNext();
    else if (dx > 0 && typeof wkPrev === 'function') wkPrev();
    else return;
    var a = document.getElementById('wk-slide-area');
    if (a && !document.getElementById('wkfs-body')) { var r = a.getBoundingClientRect(); if (r.top < 0) window.scrollBy(0, r.top - 8); }   /* 換頁後回到投影片頂端 */
    try { localStorage.setItem('stu_swipe_tip_v1', '1'); } catch (x) {}
  }, { passive: true });

  /* 第一次進來提示一次（滑過就不再出現） */
  function tip() {
    if (!phone()) return;
    try { if (localStorage.getItem('stu_swipe_tip_v1')) return; localStorage.setItem('stu_swipe_tip_v1', '1'); } catch (x) { return; }
    var d = document.createElement('div'); d.className = 'stu-swipe-tip'; d.textContent = '👆 在題目上左右滑動，可以換上一頁／下一頁';
    document.body.appendChild(d);
    setTimeout(function () { d.style.opacity = '0'; }, 3500);
    setTimeout(function () { d.remove(); }, 4200);
  }
  setTimeout(tip, 1500);
})();
</script>
</body>
</html>
