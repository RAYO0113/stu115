<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2a1d10">
<title>我要當學霸</title>
<!-- 新班級網頁（2026-10-16 起，手機優先）。
     登入：學校帳號 → 成績系統 Apps Script「學校帳號部署」?page=auth 發通行證 → 回到本頁 #t=通行證（立刻從網址列清掉，存 localStorage stuapp_t_v1）。
     資料：帳密部署 action 'meGet'＋通行證，後台只回本人（成績、缺交、扣分、班平均、班級日曆、小考）。
     本頁不放任何成績或名單；套件（皆 MIT）：Framework7 8.3.4、Tabler Icons 3.19.0；墨點載入改自 uiverse-io/galaxy（Diox221）。
     背景圖 img/ 來自 RayOclass 青花框改版素材。localStorage 鍵名一律 stuapp_ 開頭（rayo0113.github.io 底下各網站共用儲存空間）。 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@8.3.4/framework7-bundle.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f6efe6; --card:#fffdf8; --ink:#2e2118; --muted:#8f7563; --line:#eadcc8;
  --red:#a82a2a; --gold:#c8931a; --ok:#2f7d55; --soft:#f3e7d6; --brown:#2a1d10;
  --f7-font-family:"Noto Sans TC",-apple-system,sans-serif;
  --f7-page-bg-color:var(--paper); --f7-bars-bg-color:rgba(253,248,240,.86); --f7-bars-border-color:var(--line);
  --f7-tabbar-link-active-color:var(--red); --f7-tabbar-link-inactive-color:#a8927f;
  --f7-navbar-large-title-text-color:var(--ink);
  --bg-home:url(img/8-booklover-light.webp); --bg-login:url(img/1-fuguang-light.webp);
  --bg-text:url(img/3-westlake-light.webp); --bg-prac:url(img/4-snowpeak-light.webp); --bg-me:url(img/7-dongpo-light.webp);
}
.dark{
  --paper:#15110d; --card:#221b15; --ink:#efe4d6; --muted:#b39a86; --line:#3a2f25; --soft:#2c231b; --red:#e07a6a; --gold:#e0b04a; --ok:#7fcfa2;
  --f7-bars-bg-color:rgba(25,20,15,.86); --f7-tabbar-link-inactive-color:#86705e;
  --bg-home:url(img/8-booklover-dark.webp); --bg-login:url(img/1-fuguang-dark.webp);
  --bg-text:url(img/3-westlake-dark.webp); --bg-prac:url(img/4-snowpeak-dark.webp); --bg-me:url(img/7-dongpo-dark.webp);
}
body{color:var(--ink)}
.serif,.title,.title-large-text,h1,h2,h3{font-family:"Noto Serif TC",serif}

/* 登入 */
#login{position:fixed;inset:0;z-index:9000;background:var(--bg-login) 86% 0/auto 72% no-repeat,var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 28px calc(56px + env(safe-area-inset-bottom));transition:opacity .5s,visibility .5s}
#login::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,239,230,0) 38%,rgba(246,239,230,.96) 66%,var(--paper) 72%)}
.dark #login::before{background:linear-gradient(180deg,rgba(21,17,13,0) 38%,rgba(21,17,13,.96) 66%,var(--paper) 72%)}
#login>*{position:relative}
#login h1{margin:0;font-size:38px;letter-spacing:6px}
#login p{margin:6px 0 30px;color:var(--muted);letter-spacing:2px;font-family:"Noto Serif TC",serif}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;height:52px;border-radius:26px;border:0;background:var(--brown);color:#f3dfb0;font:600 16px "Noto Sans TC",sans-serif;letter-spacing:1px;box-shadow:0 6px 18px rgba(42,29,16,.35);text-decoration:none}
.dark .gbtn{background:#e0b04a;color:#1a1209}
.gbtn i{font-size:22px}
.acct{display:flex;align-items:center;width:100%;max-width:320px;height:50px;margin-bottom:12px;border-radius:25px;background:rgba(255,255,255,.75);border:1.5px solid rgba(42,29,16,.18);padding:0 18px;box-sizing:border-box}
.dark .acct{background:rgba(255,255,255,.08);border-color:rgba(243,223,176,.25)}
.acct input{flex:1;min-width:0;border:0;background:none;outline:none;font:600 17px "Noto Sans TC",sans-serif;color:var(--ink,inherit);letter-spacing:1px}
.acct span{color:var(--muted);font-size:13px;white-space:nowrap}
#login small{margin-top:14px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.6}
#login .err{color:var(--red);font-size:14px;margin-bottom:10px;text-align:center}
#login.out{opacity:0;visibility:hidden}

/* 讀取中（墨點，改自 galaxy Diox221） */
#loading{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--paper);color:var(--muted);transition:opacity .4s,visibility .4s}
#loading.out{opacity:0;visibility:hidden}
.ink{display:flex;align-items:center}
.ink b{width:14px;height:14px;border-radius:50%;margin:0 7px;box-shadow:inset 0 0 0 2px var(--muted);animation:ink 1.5s ease-in-out infinite}
.ink b:nth-child(2){animation-delay:-.4s}.ink b:nth-child(3){animation-delay:-.8s}.ink b:nth-child(4){animation-delay:-1.2s}
@keyframes ink{50%{box-shadow:inset 0 0 0 2px var(--muted),inset 0 0 0 7px var(--ink);transform:scale(1.4)}}

/* 老師預覽列 */
#pvbar{display:none;position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:7000;background:#5b3a1e;color:#ffe9b8;font-size:13px;padding:5px 12px;text-align:center}
#pvbar a{color:#fff;text-decoration:underline;margin-left:8px}
.pv #pvbar{display:block}

/* 版面 */
.hero{position:relative;margin:0 16px 4px;border-radius:22px;overflow:hidden;min-height:150px;background:var(--bg-home) center/cover;box-shadow:0 10px 28px rgba(60,40,20,.18);display:flex;flex-direction:column;justify-content:flex-end;padding:18px 18px 16px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(30,20,10,.66))}
.hero>*{position:relative;color:#fff}
.hero .hi{font:700 21px "Noto Serif TC",serif;letter-spacing:2px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hero .meta{font-size:13px;opacity:.92;margin-top:2px}
.hero.text{background-image:var(--bg-text)}.hero.prac{background-image:var(--bg-prac);min-height:120px}
.sec{margin:22px 20px 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{margin:0;font-size:18px;letter-spacing:1px}
.sec span{font-size:13px;color:var(--muted)}
.cd{background:var(--card);margin:0 16px 12px;border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);border:1px solid var(--line)}
.dark .cd{box-shadow:none}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0;padding-top:2px}.it:last-child{padding-bottom:2px}
.it .ic{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--soft);color:var(--muted)}
.it .ic.r{background:rgba(168,42,42,.12);color:var(--red)}.it .ic.g{background:rgba(200,147,26,.15);color:var(--gold)}.it .ic.k{background:rgba(47,125,85,.12);color:var(--ok)}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-weight:500}.it .tx span{font-size:13px;color:var(--muted)}
.pill{font-size:12.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;font-weight:500}
.pill.r{background:var(--red);color:#fff}.pill.g{background:rgba(200,147,26,.18);color:#9a6c0c}.pill.n{background:var(--soft);color:var(--muted)}.pill.k{background:rgba(47,125,85,.14);color:var(--ok)}
.dark .pill.g{color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.days div{text-align:center;border-radius:14px;padding:8px 0 6px;background:var(--soft);font-size:13px;color:var(--muted)}
.days div b{display:block;font:700 19px "Noto Serif TC",serif;color:var(--ink)}
.days div.on{background:var(--red);color:#fff}.days div.on b{color:#fff}
.days div i{display:block;width:6px;height:6px;border-radius:50%;margin:4px auto 0}
.days div i.dot{background:var(--gold)}.days div.off{opacity:.45}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.empty i{display:block;font-size:34px;margin-bottom:6px;opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font:900 32px/1.15 "Noto Serif TC",serif;color:var(--red);font-variant-numeric:tabular-nums}
.stat .v.ok{color:var(--ok)}.stat .v small{font-size:15px;color:var(--muted);font-weight:500}
.seg{margin:0 16px 12px}
.sc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sc:first-child{border-top:0;padding-top:2px}
.sc .tx{flex:1;min-width:0}.sc .tx b{display:block;font-weight:500}.sc .tx>span{font-size:12.5px;color:var(--muted)}
.sc .num{text-align:right;flex:none}.sc .num b{font:700 24px "Noto Serif TC",serif}.sc .num span{display:block;font-size:11.5px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--soft);margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--red)}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.minus{color:var(--red)}.plus{color:var(--ok)}
.note{font-size:12.5px;color:var(--muted);margin:6px 20px 0;line-height:1.6}
.fade{animation:fadeup .45s both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toolbar .icon.ti{font-size:26px;width:auto;height:auto}
.tabbar-label{font-size:11px}
.pvsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pvsel select{flex:1;min-width:120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.pvsel button{padding:10px 16px;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit}
</style>
</head>
<body>
<div id="pvbar"></div>

<div id="login" class="out">
  <h1 class="serif">我要當學霸</h1>
  <p>瑞媛老師的國文教室</p>
  <div class="err" id="login-err"></div>
  <label class="acct"><input id="acct" inputmode="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="學號"><span>@mail2.ccvs.kh.edu.tw</span></label>
  <a class="gbtn" id="gbtn" href="#"><i class="ti ti-brand-google"></i>用學校帳號登入</a>
  <small>打學號，按登入後只要再打密碼<br>只會看到你自己的成績</small>
</div>
<div id="loading"><div class="ink"><b></b><b></b><b></b><b></b></div><span>讀取中</span></div>

<div id="app">
  <div class="views tabs safe-areas">
    <div class="toolbar toolbar-bottom tabbar-icons">
      <div class="toolbar-inner">
        <a href="#view-home" class="tab-link tab-link-active"><i class="icon ti ti-home-2"></i><span class="tabbar-label">首頁</span></a>
        <a href="#view-text" class="tab-link"><i class="icon ti ti-book-2"></i><span class="tabbar-label">課文</span></a>
        <a href="#view-prac" class="tab-link"><i class="icon ti ti-pencil"></i><span class="tabbar-label">練習</span></a>
        <a href="#view-me" class="tab-link"><i class="icon ti ti-user-circle"></i><span class="tabbar-label">我的</span></a>
      </div>
    </div>

    <div id="view-home" class="view view-main view-init tab tab-active" data-url="/">
      <div class="page" data-name="home">
        <div class="navbar navbar-large navbar-transparent"><div class="navbar-bg"></div><div class="navbar-inner">
          <div class="title">我要當學霸</div>
          <div class="right"><a class="link icon-only" id="darkbtn" aria-label="深色模式"><i class="ti ti-moon" style="font-size:24px"></i></a></div>
          <div class="title-large"><div class="title-large-text" id="hello">你好</div></div>
        </div></div>
        <div class="page-content ptr-content" id="home-pc"><div class="ptr-preloader"><div class="preloader"></div><div class="ptr-arrow"></div></div><div id="home"></div></div>
      </div>
    </div>

    <div id="view-text" class="view view-init tab" data-url="/">
      <div class="page" data-name="text">
        <div class="navbar navbar-large"><div class="navbar-bg"></div><div class="navbar-inner"><div class="title">課文</div><div class="title-large"><div class="title-large-text">課文</div></div></div></div>
        <div class="page-content">
          <div class="hero text fade"><div class="hi">課文筆記搬家中</div><div class="meta">筆記、習作、A卷之後會一課一課搬到這裡</div></div>
          <div class="cd fade"><div class="empty"><i class="ti ti-truck-delivery"></i>這段時間請先用原本的班級網頁<br>（老師給你們班的連結）看筆記、習作、A卷。</div></div>
        </div>
      </div>
    </div>

    <div id="view-prac" class="view view-init tab" data-url="/">
      <div class="page" data-name="prac">
        <div class="navbar navbar-large"><div class="navbar-bg"></div><div class="navbar-inner"><div class="title">練習</div><div class="title-large"><div class="title-large-text">練習</div></div></div></div>
        <div class="page-content"><div id="prac"></div></div>
      </div>
    </div>

    <div id="view-me" class="view view-init tab" data-url="/">
      <div class="page" data-name="me">
        <div class="navbar navbar-large"><div class="navbar-bg"></div><div class="navbar-inner">
          <div class="title" id="me-title">我的</div>
          <div class="right"><a class="link" id="logout">登出</a></div>
          <div class="title-large"><div class="title-large-text" id="me-name">我的</div></div>
        </div></div>
        <div class="page-content">
          <div id="pvpick"></div>
          <div class="stats" id="stats"></div>
          <div class="seg"><div class="segmented segmented-strong">
            <a class="button tab-link button-active" href="#me-score">成績</a>
            <a class="button tab-link" href="#me-miss">缺交<span id="miss-n"></span></a>
            <a class="button tab-link" href="#me-radar">能力圖</a>
            <span class="segmented-highlight"></span>
          </div></div>
          <div class="tabs">
            <div id="me-score" class="tab tab-active"></div>
            <div id="me-miss" class="tab"></div>
            <div id="me-radar" class="tab">
              <div class="cd"><div class="empty"><i class="ti ti-chart-radar"></i>題庫練習上線後，<br>這裡會畫出你的能力圖。</div></div>
            </div>
          </div>
          <div style="height:20px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/framework7@8.3.4/framework7-bundle.min.js"></script>
<script>
(function () {
  /* ── 設定 ── */
  var CFG = {
    api: 'https://script.google.com/macros/s/AKfycbxfJoT1iS5tIzXtShetthjspMQ-yUwgUkiPfWc2nBEDNwYgs49u87eKvAJo5x73k7K1/exec',            /* 帳密部署（任何人）：資料 */
    auth: 'https://script.google.com/a/macros/mail2.ccvs.kh.edu.tw/s/AKfycbyW9KydiQ5kg8Mo7-JpBEHZVmmVg5Sgcor7nBO12lWU7zSBVQtle8bwEsdIK3VO2KsG/exec'   /* 學校帳號部署：登入 */
  };
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) CFG.api = CFG.auth = location.origin + '/exec';   /* 本機測試：scripts/成績系統/me_dev_server.js */
  var TK = 'stuapp_t_v1', PV = 'stuapp_pv_v1';
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function ssSet(k, v) { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var WD = '日一二三四五六';
  function parse(s) { var a = String(s).split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function addD(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function md(s) { if (!s) return ''; var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function rel(s, td) {
    var n = Math.round((parse(s) - parse(td)) / 864e5);
    return n === 0 ? '今天' : n === 1 ? '明天' : n === 2 ? '後天' : n < 0 ? (-n) + ' 天前' : n <= 6 ? '週' + WD[parse(s).getDay()] : md(s).replace(/（.）/, '');
  }
  var TYPE = { '註釋小考': '注釋小考', '筆記': '課本筆記', '回家考卷': '回家考卷' };
  function tname(t) { return TYPE[t] || t; }

  /* ── 通行證：#t= 收下就從網址列清掉 ── */
  function takeHash() {
    var hm = /[#&]t=([\w.-]+)/.exec(location.hash);
    if (hm) { lsSet(TK, hm[1]); ssSet(PV, ''); history.replaceState(null, '', location.pathname + location.search); }
    return !!hm;
  }
  takeHash();
  if (!lsGet(TK)) $('loading').classList.add('out');   /* 沒登入過：直接顯示登入畫面，不閃「讀取中」 */

  var app = new Framework7({ el: '#app', theme: 'ios', darkMode: 'auto', colors: { primary: '#a82a2a' } });

  function showLogin(msg) {
    $('login-err').textContent = msg || '';
    $('login').classList.remove('out'); $('loading').classList.add('out');
  }
  /* 登入：先填好帳號（學號＋網域），經 Google 帳號選擇頁帶入，學生只要打密碼；沒填就照舊直接開登入頁 */
  var AC = 'stuapp_acct_v1', DOM = '@mail2.ccvs.kh.edu.tw';
  $('acct').value = lsGet(AC);
  $('acct').onkeydown = function (e) { if (e.key === 'Enter') $('gbtn').click(); };
  $('gbtn').onclick = function (e) {
    e.preventDefault();
    var id = $('acct').value.trim().toLowerCase().replace(/\s+/g, '');
    if (id.indexOf('@') >= 0) id = id.split('@')[0];
    var url = CFG.auth + '?page=auth&ret=' + encodeURIComponent(location.origin + location.pathname);
    if (!id) { $('login-err').textContent = '請先打學號'; $('acct').focus(); return; }
    lsSet(AC, id);
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) url = 'https://accounts.google.com/AccountChooser?Email=' + encodeURIComponent(id + DOM) + '&continue=' + encodeURIComponent(url);
    location.href = url;
  };
  $('logout').onclick = function () { app.dialog.confirm('登出後要重新用學校帳號登入，確定嗎？', '登出', function () { lsSet(TK, ''); ssSet(PV, ''); showLogin(''); }); };
  $('darkbtn').onclick = function () { app.setDarkMode(!document.documentElement.classList.contains('dark')); };

  /* ── 讀資料 ── */
  var D = null;
  function load(done) {
    var t = lsGet(TK); if (!t) { showLogin(''); return; }
    var req = { action: 'meGet', t: t }, pv = ssGet(PV);
    if (pv) { var a = pv.split('|'); req.cls = a[0]; req.seat = +a[1]; }
    fetch(CFG.api, { method: 'POST', body: JSON.stringify(req), redirect: 'follow' }).then(function (r) { return r.json(); }).then(function (d) {
      if (done) done();
      if (!d.ok) { if (d.auth === false) { lsSet(TK, ''); showLogin('登入已過期，請重新登入'); } else app.toast.create({ text: '讀取失敗：' + (d.error || ''), closeTimeout: 4000 }).open(); return; }
      D = d; render();
      $('login').classList.add('out'); $('loading').classList.add('out');
    }).catch(function () {
      if (done) done();
      $('loading').classList.add('out');
      app.toast.create({ text: '連不上，請檢查網路後下拉重新整理', closeTimeout: 4000 }).open();
    });
  }
  app.on('ptrRefresh', function (el) { load(function () { app.ptr.done(el); }); });
  window.addEventListener('hashchange', function () { if (takeHash()) { $('loading').classList.remove('out'); load(); } });

  /* ── 畫面 ── */
  function render() {
    document.body.classList.toggle('pv', !!(D.teacher || (D.me && D.me.preview)));
    if (D.teacher) { renderPick(); return; }
    var me = D.me, td = D.today;
    $('pvbar').innerHTML = me.preview ? '老師預覽：' + esc(me.cls + ' ' + me.seat + ' 號 ' + me.name) + '<a id="pvchg">換人</a>' : '';
    if (me.preview) $('pvchg').onclick = function () { ssSet(PV, ''); load(); };
    $('pvpick').innerHTML = '';
    var h = new Date().getHours();
    $('hello').textContent = (h < 11 ? '早安' : h < 18 ? '午安' : '晚安') + '，' + (me.name ? me.name.slice(-2) : '同學');
    $('me-name').textContent = me.name || '我的';
    renderHome(td); renderPrac(td); renderMe(td);
  }

  function renderPick() {
    var cls = {}; D.roster.forEach(function (s) { (cls[s.cls] = cls[s.cls] || []).push(s); });
    var cs = Object.keys(cls);
    $('pvbar').textContent = '老師預覽模式：選一位學生，看他看到的畫面';
    $('pvpick').innerHTML = '<div class="sec"><h2>選學生</h2></div><div class="cd"><div class="pvsel"><select id="pv-c">' + cs.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') +
      '</select><select id="pv-s"></select><button id="pv-go">看</button></div></div>';
    function seats() { $('pv-s').innerHTML = cls[$('pv-c').value].map(function (s) { return '<option value="' + s.seat + '">' + s.seat + ' 號 ' + esc(s.name) + '</option>'; }).join(''); }
    $('pv-c').onchange = seats; seats();
    $('pv-go').onclick = function () { ssSet(PV, $('pv-c').value + '|' + $('pv-s').value); $('loading').classList.remove('out'); load(); };
    ['home', 'prac', 'me-score', 'me-miss', 'stats'].forEach(function (id) { $(id).innerHTML = ''; });
    $('home').innerHTML = '<div class="cd" style="margin-top:12px"><div class="empty"><i class="ti ti-eye"></i>老師帳號：到「我的」選一位學生預覽</div></div>';
    $('hello').textContent = '老師好'; $('me-name').textContent = '老師預覽';
    app.tab.show('#view-me');
  }

  function itemRow(it, td, mode) {
    var ic, pill, sub = tname(it.type) + (it.due ? '・期限 ' + md(it.due) : '');
    if (it.st === 'missing') { ic = '<div class="ic r"><i class="ti ti-alert-triangle"></i></div>'; pill = it.pen ? '<span class="pill r">逾期 ' + it.days + ' 天 −' + it.pen + '</span>' : '<span class="pill r">未交' + (it.days ? ' ' + it.days + ' 天' : '') + '</span>'; }
    else if (it.st === 'leave') { ic = '<div class="ic g"><i class="ti ti-calendar-pause"></i></div>'; pill = '<span class="pill g">' + (it.leave.k === '考' ? '待補考' : it.leave.k === '交' ? '待補交' : '請假') + '</span>'; sub = tname(it.type) + '・' + md(it.leave.d) + ' 請假' + (it.days && it.pen ? '，已扣 ' + it.pen : ''); }
    else if (it.st === 'late') { ic = '<div class="ic"><i class="ti ti-clock"></i></div>'; pill = '<span class="pill n">遲交 ' + it.days + ' 天' + (it.pen ? ' −' + it.pen : '') + '</span>'; }
    else { ic = '<div class="ic g"><i class="ti ti-file-pencil"></i></div>'; pill = '<span class="pill g">' + rel(it.due, td) + '</span>'; }
    return '<div class="it">' + ic + '<div class="tx"><b>' + esc(it.title || tname(it.type)) + '</b><span>' + esc(sub) + '</span></div>' + pill + '</div>';
  }

  function renderHome(td) {
    var me = D.me, items = D.items;
    var todo = items.filter(function (it) { return it.st === 'missing' || it.st === 'leave' || (it.st === 'open' && it.due <= addD(td, 7)); })
      .sort(function (a, b) { var o = { missing: 0, leave: 1, open: 2 }; return o[a.st] - o[b.st] || (a.due < b.due ? -1 : 1); });
    var mon = addD(td, -((parse(td).getDay() + 6) % 7)), week = [];
    for (var i = 0; i < 5; i++) week.push(addD(mon, i));
    var cal = (D.cal || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var next = cal.filter(function (e) { return e.date >= td && e.date <= addD(td, 14); });
    var h = '<div class="hero fade"><div class="hi">' + esc(me.cls) + '　' + me.seat + ' 號</div><div class="meta">' + md(td) + (todo.length ? '・有 ' + todo.length + ' 件要注意' : '・目前沒有要補的') + '</div></div>';
    h += '<div class="sec"><h2>要交、要補的</h2></div><div class="cd fade">' + (todo.length ? todo.map(function (it) { return itemRow(it, td); }).join('') :
      '<div class="empty"><i class="ti ti-circle-check"></i>都交了，很棒！</div>') + '</div>';
    h += '<div class="sec"><h2>本週</h2><span>' + md(week[0]).replace(/（.）/, '') + '～' + md(week[4]).replace(/（.）/, '') + '</span></div><div class="cd fade"><div class="days">' +
      week.map(function (d) { var has = cal.some(function (e) { return e.date === d; }); return '<div class="' + (d === td ? 'on' : '') + '">' + WD[parse(d).getDay()] + '<b>' + parse(d).getDate() + '</b><i class="' + (has ? 'dot' : '') + '"></i></div>'; }).join('') + '</div></div>';
    h += '<div class="sec"><h2>接下來兩週</h2></div><div class="cd fade">' + (next.length ? next.map(function (e) {
      var q = e.quiz ? '・範圍 ' + e.quiz.a + '～' + e.quiz.b : '';
      return '<div class="it"><div class="ic"><i class="ti ti-calendar-event"></i></div><div class="tx"><b>' + esc(e.item || e.kind) + '</b><span>' + esc(e.kind + q + (e.note ? '・' + e.note : '')) + '</span></div><span class="pill n">' + rel(e.date, td) + '</span></div>';
    }).join('') : '<div class="empty"><i class="ti ti-calendar"></i>老師還沒排</div>') + '</div><div style="height:20px"></div>';
    $('home').innerHTML = h;
  }

  function renderPrac(td) {
    var quiz = (D.cal || []).filter(function (e) { return e.quiz && e.date >= td; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
    var h = '<div class="hero prac fade"><div class="hi">' + (quiz ? '下次小考　' + md(quiz.date) : '最近沒有小考') + '</div><div class="meta">' +
      (quiz ? esc((quiz.item || '') + '・範圍 ' + quiz.quiz.a + '～' + quiz.quiz.b + (quiz.quiz.nm ? '・必考 ' + quiz.quiz.nm + ' 題' : '')) : '有排小考會出現在這裡') + '</div></div>';
    var rec = (D.quiz || []).slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 6);
    h += '<div class="sec"><h2>小考紀錄</h2></div><div class="cd fade">' + (rec.length ? rec.map(function (r) {
      return '<div class="it"><div class="ic k"><i class="ti ti-list-check"></i></div><div class="tx"><b>' + esc(r.lesson || '注釋小考') + '</b><span>範圍 ' + esc(r.a + '～' + r.b) + '・' + r.qs.length + ' 題' + (r.code ? '・考卷編號 ' + esc(r.code) : '') + '</span></div></div>';
    }).join('') : '<div class="empty"><i class="ti ti-list-check"></i>還沒有小考紀錄</div>') + '</div>';
    h += '<div class="sec"><h2>題庫練習</h2></div><div class="cd fade"><div class="empty"><i class="ti ti-target-arrow"></i>題庫準備中，之後可以在這裡一課一課練、<br>也能挑自己最弱的能力練。</div></div><div style="height:20px"></div>';
    $('prac').innerHTML = h;
  }

  function renderMe(td) {
    var items = D.items, scored = items.filter(function (it) { return it.final != null || (it.ess === null && /^[一二三]段$/.test(it.type) && it.raw != null); });   /* 段考作文還沒登也先列出選擇分數 */
    var miss = items.filter(function (it) { return it.st === 'missing' || it.st === 'leave'; }), late = items.filter(function (it) { return it.st === 'late'; });
    $('stats').innerHTML = '<div class="stat fade"><div class="k">已登記成績</div><div class="v ok">' + scored.length + '<small> 次</small></div></div>' +
      '<div class="stat fade"><div class="k">缺交、待補</div><div class="v' + (miss.length ? '' : ' ok') + '">' + miss.length + '<small> 件</small></div></div>';
    $('miss-n').textContent = miss.length ? '（' + miss.length + '）' : '';
    $('me-score').innerHTML = '<div class="cd">' + (scored.length ? scored.map(function (it) {
      var notes = [];
      if (it.days) notes.push('<span class="minus">遲交 ' + it.days + ' 天' + (it.pen ? ' −' + it.pen : '（不扣分）') + '</span>');
      if (it.bonus) notes.push('<span class="plus">訂正 +' + it.bonus + '</span>');
      if (/^[一二三]段$/.test(it.type)) notes.push('選擇 ' + it.raw + '＋作文 ' + (it.ess == null ? '待登' : it.ess));
      else if (it.raw != null && (it.days || it.bonus)) notes.push('原始 ' + it.raw);
      var w = Math.max(0, Math.min(100, it.final || 0)), aw = it.avg == null ? null : Math.max(0, Math.min(100, it.avg));
      return '<div class="sc"><div class="tx"><b>' + esc(it.title || tname(it.type)) + '</b><span>' + tname(it.type) + (it.due ? '・' + md(it.due).replace(/（.）/, '') : '') + (notes.length ? '　' + notes.join('　') : '') + '</span>' +
        '<div class="bar"><i style="width:' + w + '%"></i>' + (aw == null ? '' : '<em style="left:' + aw + '%"></em>') + '</div></div>' +
        '<div class="num"><b>' + (it.final == null ? '—' : it.final) + '</b><span>' + (it.avg == null ? '' : '班平均 ' + it.avg) + '</span></div></div>';
    }).join('') : '<div class="empty"><i class="ti ti-notebook"></i>還沒有登記的成績</div>') + '</div>' +
      '<p class="note">紅條＝你的分數，細線＝班平均（只算有分數的同學）。以老師登記為準，有疑問請找老師。<br>學期成績和名次：老師定好配分後開放。</p>';
    var h = '';
    if (miss.length) h += '<div class="sec"><h2>還沒交、待補</h2></div><div class="cd">' + miss.map(function (it) { return itemRow(it, td); }).join('') + '</div>';
    if (late.length) h += '<div class="sec"><h2>已交但遲交</h2></div><div class="cd">' + late.map(function (it) { return itemRow(it, td); }).join('') + '</div>';
    if (!h) h = '<div class="cd"><div class="empty"><i class="ti ti-circle-check"></i>沒有缺交，也沒有遲交！</div></div>';
    $('me-miss').innerHTML = h + '<p class="note">' + (D.pen ? '逾期的作業每多一個上課日再扣 ' + D.pen + ' 分（放假、段考日不算）。' : '目前遲交不扣分，但還是要記得補交喔。') + '</p>';
  }

  load();
})();
</script>
</body>
</html>
