<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瑞媛的國文教學 · 學生筆記版</title>
<style>
  :root { --bg: #f6efe6; --card: #fffdf8; --ink: #3a2a20; --accent: #8a2a2a; --muted: #9a7a66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1915; --card: #2a2420; --ink: #eee2d6; --accent: #e08a7a; --muted: #b59c8a; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
         color: var(--ink); font-family: "Noto Serif TC", "PMingLiU", serif; padding: 16px; box-sizing: border-box; }
  .box { background: var(--card); max-width: 440px; width: 100%; border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 30px rgba(0,0,0,.12); line-height: 1.8; }
  h1 { margin: 0 0 6px; font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  p { margin: 8px 0; font-size: 17px; }
  b { color: var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <h1>學生筆記版已搬家</h1>
    <div class="sub">瑞媛的國文教學</div>
    <p>筆記版改成<b>各班各自一個網址</b>，習作、A卷等內容會依各班進度更新。</p>
    <p>請使用<b>老師給你們班的連結</b>開啟，並把新連結加入書籤。</p>
  </div>
</body>
</html>
