/* ════════ 資料 ════════ */
const TEXTBOOK = {
  '身為魚販': {"handoutV2": [{"title": "一、作者與題解", "page": "P.3", "blocks": [["table", "", [["從偽魚販到專職魚販──林楷倫"], ["籍貫", "臺中市 霧峰區人"], ["生平", "中臺科技大學五專部醫事技術系畢業，交通大學 社會與文化研究所肄業，從事魚販工作，並開始嘗試寫小說<br>2016年參加朱宥勳所開設的小說創作課<br>2019年將作品投稿文學獎，並加入「想像朋友寫作會」"], ["創作風格", "認真寫作，描繪魚市所見。他認為各行各業都值得被尊重，魚販的人生也可以很精彩<br>散文風格寫實又富戲劇張力，帶有小說筆法，內容兼具賣魚知識和生命自省，生動敘寫人情事理"], ["成就", "2020年在文學界嶄露頭角，小說雪卡毒獲得林榮三文學獎短篇小說首獎、消失的空間榮獲臺北文學獎小說組評審獎、北疆沒有大紅色的魚獲臺中文學獎小說首獎等<br>2021年，溪底無光獲林榮三文學獎短篇小說三獎"], ["著作", "散文：偽魚販指南、廚房裡的偽魚販<br>小說：雪卡毒"], ["題解要旨", "本文記錄作者投身魚市，最後成為真正魚販的心路歷程<br>原本作者希望透過教育翻轉自己的人生，但父親持續積欠高額賭債，最後只能無奈的放棄學業，成為一名專職魚販<br>在成為魚販的過程中，作者學會從容面對現實，在混亂、疲憊的步調裡，摸索出規則。對世事的領悟從懵懂到透澈，最後坦然接受，提供讀者對生命的省思"]]]]}, {"title": "二、「偽魚販指南」一書", "page": "P.3", "blocks": [["text", "para", "偽，偽裝，指的是作者一開始並非自願當魚販。指南，辨別方向或解決問題的參考資料、途徑，如：旅行指南、處世指南；本課指作者生活的片段。作者擷取魚販日常、真實生活與回憶，寫成這本散文集，是他的第一本書。林楷倫說：「我以為洗去身上的魚味，就能變成不一樣的人。但魚鱗長年緊附，拔扯下來，皮膚已是不同的顏色。」他已變成真正的魚販，並認同這個身分。"]]}, {"title": "(一)文本透視鏡", "page": "P.4", "blocks": [["table", "", [["寫作<br>背景", "林楷倫在出書前曾於臉書撰寫一篇魚市散文，受到讀者鼓勵而萌生出書念頭。他原以為魚販生活平凡無奇，但也正因少有人書寫，更值得記錄。於是他以自身在魚市六年、在市場二十年的經驗為基礎，描繪魚販的日常與真實人生。由於不擅攝影與繪畫，因此他選擇以文字呈現所見人事，將平凡的市場生活化為動人的書寫"]]], ["table", "", [["結構", "段落", "旨意", "讀見真相"], ["起<br>開始投身<br>賣魚工作", "第一段<br>、<br>第二段<br><span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">國中</span></span>", "作者在週末到家族魚攤協助賣魚，並學習相關知識，家人則希望他好好讀書", "1.作者透過簡單的對話，表達對魚類的認識有限<br>2.在魚攤上經由阿公的教導，展現其學習的心態，同時反映出家庭成員間的互動"], ["起<br>開始投身<br>賣魚工作", "第一段<br>、<br>第二段<br><span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">國中</span></span>", "作者敘述工作內容及與同學疏離的無奈，自我期許透過讀書來掙脫賣魚的宿命", "1.作者賣魚過程的辛苦，因同學的誤解，產生疏離<br>2.導師的期望、同學對他的羨慕及稱讚，反思自我身分的價值<br>3.努力讀書，期許翻轉魚販第三代的宿命"], ["承<br>賣魚當正職", "第三段<br>五專<br>大學", "應家人要求到魚攤幫忙。父親的賭債讓整個家庭經濟受到綁縛", "1.在學業與工作中掙扎，即使已在學業中找到興趣與未來的希望<br>2.因父親的賭債、阿公的期待，讓他不得不支撐起家庭的重擔，對此充滿無奈"], ["轉<br>專職魚販", "第四段<br>研究所肄業", "作者因家庭因素，放棄高學歷及夢想，成為魚販並接受這個身分", "1.放棄高學歷及夢想，接受社會世俗質疑的眼光，在家庭責任與個人理想間掙扎<br>2.對人生感到迷茫、無奈，也充滿遺憾<br>3.回頭檢視，發覺自己已接受成為魚販的事實"]]], ["table", "", [["合<br><span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span><br>魚販的工作", "第五段<br>成家後", "作者敘述成為魚販的心路歷程，完全接受自己已成為一名努力的魚販", "阿公的狀況", "中風在床，幾年後，阿公死去"], ["合<br><span class=\"jy-cir\">④</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span><br>魚販的工作", "第五段<br>成家後", "作者敘述成為魚販的心路歷程，完全接受自己已成為一名努力的魚販", "自我的成長", "「現在我會吃冷凍的白鯧了，我會輕輕的夾給兒女和自己。我們都吃過現流的白鯧，所以知道冷凍白鯧不好吃」<br>→對於冷凍白鯧的接受，暗示在生活中<span class=\"jy-cir\">⑤</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">接受現實</span></span>的過程，也是對過去種種的回憶與懷念。<br>→<span class=\"jy-cir\">⑥</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">現流的白鯧</span></span>象徵過去的一切；冷凍白鯧則代表<span class=\"jy-cir\">⑦</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">新的生活現實</span></span>"], ["合<br><span class=\"jy-cir\">⑧</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span><br>魚販的工作", "第五段<br>成家後", "作者敘述成為魚販的心路歷程，完全接受自己已成為一名努力的魚販", "父親的惡習", "「裝睡的人叫不醒，爸仍然在賭」<br>→表達對父親的<span class=\"jy-cir\">⑨</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">失望</span></span><br>→「裝睡的人叫不醒」暗示父親對家庭問題的逃避與無所作為，無論旁人如何努力，他都不改變自己的行為。「爸仍然在賭」指出父親持續沉迷賭博，家庭面臨的困境與壓力"], ["合<br><span class=\"jy-cir\">⑩</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span><br>魚販的工作", "第五段<br>成家後", "作者敘述成為魚販的心路歷程，完全接受自己已成為一名努力的魚販", "自我的<br><span class=\"jy-cir\">⑪</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span>", "「身為一名魚販，我很努力，很努力了」<br>→重複「很努力」表示對這個身分的<span class=\"jy-cir\">⑫</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">肯定</span></span>"]]]]}, {"title": "(二)文本異世界", "page": "P.6", "blocks": [["table", "", [["主旨", "作者回憶童年時，祖父是魚販，父母曾經營飲料店，後因父親沉溺賭博，賠掉婚姻與事業，導致他在<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">國中</span></span>時期便開始幫忙家中賣魚。本文敘述作者成為魚販的歷程、感受及對生命的理解"], ["敘事視角", "<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">第一人稱視角  □第二人稱視角  □第三人稱視角</span></span>"]]], ["table", "", [["寫作特色", "從剖魚到自剖，生命經驗的真實呈現", "這是臺灣第一本真人實事的<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">魚販</span></span>寫作，作者凌晨在市場剖魚，學習一堂堂的<span class=\"jy-cir\">④</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">魚販</span></span>學，展開他的魚市人生。讀者可從字裡行間感受到魚市的氣味、魚販與顧客間的人情交流，並對他們投以更多的理解與尊重"], ["寫作特色", "筆法<span class=\"jy-cir\">⑤</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">寫實</span></span>富戲劇張力，兼具幽默與深度", "作者描述魚市見聞，畫面生動，充滿戲劇張力。文字平易卻極具深度，幽默中略帶嘲諷戲謔，又不乏親切感"], ["寫作特色", "面對生命困境、調整步伐重新出發", "作者自小就想盡辦法擺脫宿命，雖卸不掉親情枷鎖，接受自己成為魚販，但正職是魚販的同時，作者將自己的遭遇、心情、對生命的反思，都訴諸文字，一步步實現自我成為作家。這樣的斜槓人生，是作者對命運的解鎖"]]]]}, {"title": "一、形近字", "page": "P.7", "blocks": [["table", "", [["偏旁", "音", "例"], ["烏", "<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄨˇ</span></span>", "「摀」住嘴巴"], ["烏", "<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄨˋ</span></span>", "山「塢」、船「塢」、村「塢」"], ["欠", "<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄑㄧㄢ</span></span>", "鑲「嵌」"], ["欠", "ㄎㄢˇ", "「崁」頂鄉"]]]]}, {"title": "二、一字多音", "page": "P.7", "blocks": [["table", "", [["字", "音", "例"], ["秤", "<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄔㄥˋ</span></span>", "「秤」重、磅「秤」"], ["秤", "<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄆㄧㄥˊ</span></span>", "天「秤」"], ["刨", "<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄆㄠˊ</span></span>", "「刨」鱗、「刨」洞、「刨」坑"], ["刨", "<span class=\"jy-cir\">④</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄅㄠˋ</span></span>", "「刨」冰、「刨」木頭"], ["勒", "<span class=\"jy-cir\">⑤</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄌㄟ</span></span>", "「勒」緊、「勒」死"], ["勒", "<span class=\"jy-cir\">⑥</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄌㄜˋ</span></span>", "懸崖「勒」馬、「勒」令、「勒」索"], ["稱", "<span class=\"jy-cir\">⑦</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄔㄥˋ</span></span>", "「稱」職、「稱」心如意"], ["稱", "<span class=\"jy-cir\">⑧</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄔㄥ</span></span>", "把這包米「稱」一「稱」、「稱」呼、「稱」讚、名「稱」"]]], ["text", "para", "■設問"], ["text", "para", "為了強調語意，以引起讀者的注意，作者有意的設置問題，讓讀者去思索、體會，這種修辭格稱為「設問」。"], ["table", "", [["類別", "定義", "例句"], ["提問", "為提起下文而問，自問自答，答案緊接出現在問句的後面", "問君能有幾多愁？恰似一江春水向東流。　　　　　　 （李煜 虞美人）"], ["懸問", "懸問是內心真的存有疑問，特意提出問句希望得到確切的答案。這是文法學上所謂的「疑問句」", "還要學什麼嗎？<br>你還要讀書嗎？"], ["激問", "又稱「反問」、「反詰」、「詰問」。表面上問而不答，而其答案就在問句本身的反面", "讀那麼高幹麼？<br>不喜歡又能怎樣？<br>那還有什麼不能做呢？"]]]]}, {"title": "一、成語", "page": "P.8", "blocks": [["table", "", [["成語", "釋義", "例句"], ["魚目混珠", "比喻以假亂真。", "這位不肖商人，賣的貨品很多魚目混珠，你要小心免得上當。"], ["魚遊釜中", "比喻身處險境，危在旦夕。", "這位官員貪汙事實確鑿，處境猶如魚遊釜中，自己卻全然不以為意。"], ["如魚得水", "好像魚和水般的契合。比喻得到和自己意氣相投的人或很適合的環境。", "小李時常能提供創新想法，也擅長與人溝通，被指派到行銷部，真是讓他如魚得水，可大展抱負。"], ["緣木求魚", "爬到樹上去找魚。比喻用錯方法，徒勞無功。", "他整天做白日夢，不認真努力，卻只想一步登天，無異是緣木求魚。"], ["臨淵羨魚", "比喻雖有願望，但只憑空妄想，難收實效。", "與其臨淵羨魚，不如退而結網，只有努力去實踐，才有可能成功。"]]]]}, {"title": "二、臺灣常見的食用魚", "page": "P.9", "blocks": [["table", "", [["魚類", "說明", "圖片"], ["午仔魚", "每尾一公斤以上稱做「竹午」，一公斤以下則稱作「大午」，五百克以下稱為「午仔魚」。每年冬至前一個月為其盛產期，價位不高，一般家庭皆能輕鬆購買，為臺灣餐桌上常見的食用魚", ""], ["白鯧", "體為側扁橢圓形，有背鰭一枚，尾鰭深分叉。背部為淡青黑色，腹部色較淡。體長約二十至三十五公分，大的可達六十公分。臺灣主要分布於西部及北部海域", ""], ["土魠魚", "也稱為「馬鮫魚」、「塗魠魚」。體長側扁，背部灰綠色，腹部銀白色，體側約有五十至六十條褐色橫帶。分布極廣，臺灣盛產於西南沿海，尤以臺南、高雄沿海及澎湖近海最多。臺灣知名小吃土魠魚羹，將魚肉塊裹上粉、油炸金黃再放入羹湯中食用", ""], ["虱目魚", "脊椎動物亞門硬骨魚綱。體呈紡錘形，側扁，為臺灣地區淡鹹水養殖魚中的名。魚肉細緻鮮美，為家庭食用魚的佳餚，其加工製品虱目魚丸深受消費者喜愛", ""], ["臺灣鯛", "臺灣鯛是改良後高品質的吳郭魚，體長約十五至二十公分，最大可至三十公分以上，改良優化後最大特色就是少了昔日吳郭魚的「臭土味」", ""]]]]}, {"title": "（一）美味圖景——讀漢代畫像中的魚紋（改寫）\t王仁湘", "page": "P.10", "blocks": [["text", "para", "漢代人對於魚，似乎有著特別的嗜好。長沙 馬王堆出土的漢簡中，就有名列「白羹」的魚羹，主料為肉魚，配有筍、芋、豆、瓠、藕等素菜。又有膾四品，原料為牛、羊、鹿、魚。"], ["text", "para", "魚之為羹、為膾，味道均美。論語云「　　　　　」，其中膾主要指的應是魚膾。禮記 曲禮說「獻孰食者操醬齊」，經學家注解「醬齊為食之主，執主來則食可知，若見芥醬，必知獻魚膾之屬也」，因此有「魚膾芥醬」一語。現代人食生魚片用芥末醬為主要調料，應當是承自周代的傳統。"], ["text", "para", "歷代都有愛魚膾的人，唐代 白居易詩云「秋風一箸鱸魚膾，張翰搖頭喚不回」，吟詠西晉文學家張翰為官時，見秋風一起，便想起了家鄉吳中的菰菜蓴羹鱸魚膾。他頓悟人生一世貴在適意，何苦迢迢千里追求官爵？於是收拾行囊，棄官而歸。另有說法據本草記載，蓴鱸同羹可以下氣止嘔，後人以此推斷張翰在當時意氣抑鬱，隨事嘔逆，故有蓴鱸之思。"], ["text", "para", "蓴為水生草本，葉浮水上，嫩葉可為羹。鱸魚為長江下游近海之魚，肉味鮮美。齊民要術在「羹臛○法」中記有鱸魚蓴羹，其做法是將魚、蓴均下冷水中，另煮豉汁為琥珀色，用調羹味。這是生食之一法，與孔子時以芥醬食膾又有所不同。"], ["text", "para", "（注：○臛：音ㄏㄨㄛˋ，烹煮。）"], ["text", "q", "【　(B)　】1.下列何者最不符合上文所述？"], ["text", "opt", "(A)漢代人嗜好魚羹，主料為魚肉，佐以筍、豆、芋、藕等素菜"], ["text", "opt", "(B)「醬齊為食之主」意指吃飯時要將所有的飲食器具準備齊全"], ["text", "opt", "(C)「蓴羹鱸膾」指張翰頓悟人生貴在適意，具有歸隱故里之思"], ["text", "opt", "(D)「羹臛法」其做法是將魚、蓴均下冷水中，再用豉汁調羹味"], ["text", "exp", "【解析】(B)醬齊，指醬類食品和醬醋拌的小菜。齊，通「韲」，調味用的細碎辛辣食物或菜末。"], ["text", "q", "【　(C)　】2.上文　　　　　內，最適合填入的是："], ["text", "opt", "(A)寧買不值，不買吃食　　　　　(B)飢不可食，寒不可衣"], ["text", "opt", "(C)食不厭精，膾不厭細　　　　　(D)一飲一啄，莫非前定"], ["text", "exp", "【解析】「魚之為羹、為膾，味道均美」意指魚肉要做成羹湯，肉要切得細緻，味道才會美味，故填入(C)，文意妥切適當。(A)寧願把錢花在買貴一點的東西上，也不要把錢用在吃喝上。比喻勸人花錢要花得值得。(B)不可吃、不能穿。比喻不實用。(C)米麥碾舂得愈精白愈好，魚肉切得越細越好。比喻食品精緻，飲食講究。(D)比喻人的生活際遇，都是命中注定的。"], ["text", "q", "【　(A)　】3.依據上文，關於○、○的研判應是："], ["text", "para", "○周代時食生魚片，已知使用芥末醬來做為調料。"], ["text", "para", "○本草記載，蓴鱸同羹有治療意氣抑鬱之效。"], ["text", "opt", "(A)○、○皆正確　　(B)○、○皆錯誤　　(C)○正確，○錯誤　　(D)○錯誤，○正確"], ["text", "exp", "【解析】(A)○由「現代人食生魚片用芥末醬為主要調料，應當是承自周代的傳統」，可知研判正確。○由「據本草記載，蓴鱸同羹可以下氣止嘔，後人以此推斷張翰在當時意氣抑鬱，隨事嘔逆，故有蓴鱸之思」，可知研判正確。"], ["text", "para", "【賞析】本文考據古人嗜魚之風，從論語、禮記、齊民要術等典籍，勾勒出魚膾的歷史脈絡與食藝傳承。亦藉由張翰思鄉辭官，賦予魚膾「適意人生」的象徵意涵，使一味佳餚成為文化與情志的寄託，餘韻悠長。"]]}, {"title": "（二）臺灣漁業資料", "page": "P.11", "blocks": [["table", "", [["臺灣的漁業<br>養殖漁業：利用人為方式養殖水生動、植物，可分為陸上養殖及淺海養殖兩大類。<br>沿近海漁業：在我國專屬經濟海域（離岸200海浬內）從事漁撈作業者。<br>遠洋漁業：指於公海或他國領海或專屬經濟海域，從事漁撈作業。<br>112年漁戶數、漁戶人口數及漁業從業人數<br>漁業法<br>第 2 條：本法所稱主管機關：在中央為行政院 農業委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府。<br>第 3 條：本法所稱漁業，係指採捕或養殖水產動植物業，及其附屬之加工、運銷業。<br>第 4 條：1.本法所稱漁業人，係指漁業權人、入漁權人或其他依本法經營漁業之人。<br>　　　　 2.本法所稱漁業從業人，係指漁船船員及其他為漁業人採捕或養殖水產動植物之人。<br>第 5 條：漁業人以中華民國人為限。但外國人經中央主管機關核准與中華民國漁業人合作經營漁業者，不在此限。"]]], ["text", "q", "【　(B)　】1.依據上述資料，下列何者最符合「漁戶數」所述？"], ["text", "opt", "(A)112年底漁戶數將超過13萬戶　　　　(B)遠洋漁戶數比近海少13,303戶"], ["text", "opt", "(C)「以內陸漁撈為主者」的占比最多　　 (D)我國海面養殖業比內陸養殖興盛"], ["text", "exp", "【解析】(A)112年底漁戶數129,136戶，未超過13萬戶。(B)近海18,469－遠洋5,166＝13,303戶。(C)「以內陸漁撈為主者」4,088戶，為漁戶數中占比最少。(D)「以海面養殖為主者」為8,186戶，「以內陸養殖為主者」為27,413戶，可知內陸養殖比海面養殖興盛。"], ["text", "q", "【　(B)　】2.阿明在市場的鮮魚攤上看到販售的魚類如下。參考上述資料，判斷圖中何者屬於「遠洋魚類」？"], ["text", "opt", "(A)(甲)(丙)(丁)"], ["text", "opt", "(B)(乙)(丙)(丁)"], ["text", "opt", "(C)(甲)(乙)(丙)(丁)"], ["text", "opt", "(D)(乙)(丙)(丁)(戊)"], ["text", "exp", "【解析】(甲)養殖魚類。草魚，生活於淡水中，因食水草而得名。也稱為「鯇（ㄏㄨㄢˋ）魚」，是臺灣地區重要的養殖魚類。(乙)遠洋魚類。秋刀魚，生存水域在太平洋北部，因盛產於秋天，顏色銀白且身形修長，就像一把短刀，故名為「秋刀魚」。(丙)遠洋魚類。旗魚，太平洋、印度洋、大西洋均有分布。種類繁多，包括劍旗魚、立翅旗魚、黑皮旗魚、紅肉旗魚等。(丁)遠洋魚類。魷魚，大多產於阿根廷、美洲、西北太平洋等地區。(戊)沿近海魚類。烏魚，每年冬季洄游至臺灣南部西岸產卵。故答案選(B)。"], ["text", "q", "【　(A)　】3.依據上文，下列敘述何者最符合文意？"], ["text", "opt", "(A)112年底漁戶人口數達到32萬人以上，從事項目包含漁業之運銷業"], ["text", "opt", "(B)漁業人係指漁船船員及其他為漁業人採捕或從事養殖水產動植物之人"], ["text", "opt", "(C)漁戶人口數統計包含中華民國、外國人及與我國漁業人合作經營業者"], ["text", "opt", "(D)《漁業法》最高主管機關為行政院 農業委員會，縣（市）政府沒有管理權"], ["text", "exp", "【解析】(A)由「本法所稱漁業，係指採捕或養殖水產動植物業，及其附屬之加工、運銷業」可知。(B)漁業人，係指漁業權人、入漁權人或其他依本法經營漁業之人。(C)漁戶人口數，以中華民國人為限。(D)由「本法所稱主管機關：在中央為行政院 農業委員會；在直轄市為直轄市政府；在縣（市）為縣（市）政府」，可知縣（市）政府具有管理權。"], ["text", "para", "【　 　】1.若要使下文的理路連貫有序，○、○、○、○、○最適當的排列應是：\t【111統測】"], ["text", "para", "魚塭與魚塘雖大約在相同時期引進臺灣，但魚塘因魚苗取得不易，"], ["text", "para", "○因此大多僅是農家副業，"], ["text", "para", "○以及須克服水源補充問題，"], ["text", "para", "○反觀魚塭雖侷限在臺灣西南沿海，"], ["text", "para", "○卻是適合環境條件的土地利用方式，"], ["text", "para", "○故養殖活動得依附水稻農業生態體系，"], ["text", "para", "遂發展為重要的養殖型態。"], ["text", "opt", "(A)○○○○○"], ["text", "opt", "(B)○○○○○"], ["text", "opt", "(C)○○○○○"], ["text", "opt", "(D)○○○○○"], ["text", "sub", "2.閱讀下文，回答第(1)、(2)題：\t【106統測】"], ["text", "para", "【　 　】(1)依據上圖，下列敘述何者正確？"], ["text", "opt", "(A)鯊魚體內環境毒素多，唯魚鰭毒稀而可食"], ["text", "opt", "(B)鯊魚長壽且繁殖力強，但敵不過人類濫捕"], ["text", "opt", "(C)鯊魚割鰭後行動遲緩，故攻擊力不及鱷魚"], ["text", "opt", "(D)鯊魚的物體辨識力差，並非專嗜人類獵食"], ["text", "para", "【　 　】(2)上圖倡導「不食魚翅，拒絕買賣」以挽救鯊魚，主要是基於何種理由？"], ["text", "opt", "(A)數罟不入洿池，魚鱉不可勝食也"], ["text", "opt", "(B)夫膻臭之欲不止，殺害之機不已"], ["text", "opt", "(C)竭誠則胡 越為一體，傲物則骨肉為行路"], ["text", "opt", "(D)求福莫過齋戒佈施，求壽莫過不殺放生"], ["text", "para", "1.【答案】(B)"], ["text", "exp", "【解析】(B)從文章開頭可知主體為「魚塭」與「魚塘」兩個對象，再由「但魚塘因魚苗取得不易」的轉折語氣可知「魚塘」必須克服某種因素或問題，必須依賴某種條件才得以存在，因此○○相連；而「魚塘」在這種情況下，因此造成某種結果，故文意接續○。又從「魚塘」的發展，對照「魚塭」，文意脈絡接續○；最後由末句「遂發展為重要的養殖型態」，可知是描述「魚塭」恰巧適合這樣的環境條件，因此接○。文章改寫自洪新恩 從虱目魚看臺灣。"], ["text", "para", "2.(1)【答案】(D)"], ["text", "exp", "【解析】(A)鯊魚鰭「汞含量高，並驗出誘發阿茲海默症的神經毒素」，因此「唯魚鰭毒稀而可食」為非。(B)鯊魚「產子數少」明顯與「繁殖力強」相違。(C)敘述鯊魚的「攻擊力不及鱷魚」，圖中亦未提及。(D)呼應圖中鯊魚無法分辨海豹、海龜、人，物體辨識能力確實很差。因此正確答案為(D)。"], ["text", "para", "(2)【答案】(B)"], ["text", "exp", "【解析】題幹倡導「不食魚翅，拒絕買賣」是基於保護鯊魚生態，並期許人類對鯊魚能有更多的正確認識，與(A)「不可勝食」無關，也跟(C)強調的竭誠、傲慢沾不上邊，更不是(D)所言為了「求福求壽」，而是和人類的欲望連動，因此正確答案為(B)。"], ["text", "trans", "【語譯】(A)不使用細密的漁網在池塘內捕魚，魚鱉就吃不完了。（數，音ㄘㄨˋ，細密。罟，音ㄍㄨˇ，網的總稱。洿池，池塘。洿，音ㄨ。）孟子 梁惠王上。(B)只要臊臭的欲望不停止，殺害的動機也就不會終止。（膻，音ㄕㄢ，同「羶」，羊身上的臊味。）譚峭 化書卷四 仁化 畋漁。(C)竭誠待人，即使關係疏遠的人也能同甘共苦，傲氣凌人，那麼至親的親人也會形同路人。魏徵 諫太宗十思疏。(D)要追求福祉最好的就是齋戒佈施，要求取長壽莫過於不殺生、多放生。大乘金剛經第十三。"]]}],"title": "當代 林楷倫〈身為魚販〉", "author": {"dynasty": "當代", "name": "林楷倫", "intro": "", "context": "本文節選自偽魚販指南一書，偽，偽裝，指的是作者一開始並非自願當魚販；指南，辨別方向或解決問題的參考資料、途徑，此指作者生活的片段。作者回憶童年時，祖父是魚販，父母曾經營飲料店，後因父親沉溺賭博，賠掉婚姻與事業，導致他在國中時便開始幫忙家中賣魚。"}, "extras": {"intro": [{"label": "題解·課本", "head": "題解", "body": "本文節選自偽魚販指南一書，偽，偽裝，指的是作者一開始並非自願當魚販；指南，辨別方向或解決問題的參考資料、途徑，此指作者生活的片段。作者回憶童年時，祖父是魚販，父母曾經營飲料店，後因父親沉溺賭博，賠掉婚姻與事業，導致他在國中時便開始幫忙家中賣魚。<br><br>身為魚販一文記錄作者投身魚市，最後成為真正魚販的心路歷程。原本他希望透過教育翻轉自己的人生，但父親持續積欠高額賭債，作者只能無奈的放棄學業，成為一名專職魚販。<br><br>成為魚販的過程中，作者學會從容面對現實，在混亂、疲憊的步調裡，摸索出規則。對世事的領悟從懵懂到透澈，最後坦然接受，提供讀者對生命的省思。"}], "authorPages": [{"label": "作者·課本", "head": "作者", "body": ""}], "appreciation": [{"label": "賞析·課本", "head": "賞析", "body": "本文敘述作者成為魚販的歷程、感受及對生命的理解。寫作特色如下：<br><br>一、從剖魚到自剖，生命經驗的真實呈現：這是臺灣第一本真人實事的魚販寫作，作者凌晨在市場剖魚，學習一堂堂的魚販學，展開他的魚市人生。魚市下班後的空檔，寫作自剖，從家庭責任、個人夢想、身分價值等面向思索人生。讀者可從字裡行間感受到魚市的氣味、魚販與顧客間的人情交流，並對他們投以更多的理解與尊重。<br><br>二、筆法寫實富戲劇張力，兼具幽默與深度：作者描述魚市見聞，畫面生動，充滿戲劇張力。文字平易卻極具深度，幽默中略帶嘲諷戲謔，又不乏親切感。白描直述中注入濃烈的人生掙扎，沒有刻意逗笑的文句，卻能讓人情感激動，展現他的文字魅力。<br><br>三、面對生命困境，調整步伐重新出發：作者自小就想盡辦法擺脫宿命，雖卸不掉親情枷鎖，接受自己成為魚販，但正職是魚販的同時，作者將自己的遭遇、心情、對生命的反思，都訴諸文字，一步步實現自我成為作家。這樣的斜槓人生，是作者對命運的解鎖。透過本文，引導讀者遭遇挫折時，能有不同面向的思考。<br><br>文末，作者提到：「既然不愛的、討厭的都能做好，那還有什麼不能做呢？」「身為一名魚販，我很努力，很努力了。」在第三代魚販身上，散發出令人深思、動容的海洋鹹味，讓讀者看見黏滑微腥的生活樣貌，也看到人生充滿無限可能。"}], "supplement": [{"label": "題解·補充", "head": "書名「偽魚販指南」釋義", "body": "本文節選自《<b>偽魚販指南</b>》一書。<br><br><b>偽</b>：偽裝，指的是作者一開始並非自願當魚販。<br><b>指南</b>：辨別方向或解決問題的參考資料、途徑，此指作者生活的片段。"}, {"label": "題解·補充", "head": "寫作背景", "body": "作者回憶童年時，祖父是魚販，父母曾經營飲料店，後因父親沉溺賭博，賠掉婚姻與事業，導致他在國中時便開始幫忙家中賣魚。<br><br>〈身為魚販〉一文記錄作者投身魚市，最後成為真正魚販的心路歷程。原本他希望透過教育翻轉自己的人生，但父親持續積欠高額賭債，作者只能無奈的放棄學業，成為一名專職魚販。<br><br>成為魚販的過程中，作者學會從容面對現實，在混亂、疲憊的步調裡，摸索出規則。對世事的領悟從懵懂到透澈，最後坦然接受，提供讀者對生命的省思。"}, {"label": "作者·補充", "head": "作者生平", "body": "林楷倫，臺中市霧峰區人，民國七十五年生。中臺科技大學五專部醫事技術系畢業。後曾就讀過銘傳大學、朝陽科技大學、東海大學與交通大學等校。現為專職魚販、作家。<br><br>對林楷倫而言，賣魚是不得已的選擇。但現在他努力賣魚，撐起家中經濟；認真寫作，描繪魚市所見。他認為賣魚是一分專業，各行各業都值得被尊重，魚販的人生也可以很精彩。"}, {"label": "作者·補充", "head": "文學風格與成就", "body": "他的散文風格<b>寫實又富戲劇張力，帶有小說筆法</b>，內容兼具賣魚知識和生命自省，生動敘寫人情事理，使讀者更加了解這個行業。<br><br>曾獲得<b>林榮三文學獎、時報文學獎、臺北文學獎、臺中文學獎</b>等。著有散文集《偽魚販指南》《廚房裡的偽魚販》，短篇小說集《雪卡毒》。"}, {"label": "作者·補充", "head": "軼聞掌故", "body": "<b>1. 父親賭博賠掉身家</b>：父親沉溺賭博，賠掉婚姻與事業，作者國中起便幫忙賣魚。<br><b>2. 慶幸志願沒有成真</b>：原以醫檢師為志願，如今回望，反而慶幸走上不同的路。<br><b>3. 市場的稱呼</b>：在魚市裡，人們以攤位或魚種相稱，身分被工作吞沒。<br><b>4. 腰痛的職業病</b>：長年彎腰刨魚，落下腰疾。<br><b>5. 不像魚販的斜槓人生</b>：白天賣魚、夜裡寫作，兩種身分並行。<br><b>6. 兩次被父親背叛</b>：課文中「裝睡的人叫不醒」的沉痛體悟由此而來。"}, {"label": "補充·魚類知識", "head": "課文中的魚", "body": "<b>白鯧</b>：一般家庭常見的食用魚。<br><b>正鯧</b>：魚鰭長且魚尾如剪刀。<br><b>暗鯧</b>：體色偏灰、魚鰭短。<br><b>斗鯧</b>：魚鰭魚尾短短，鰭邊形狀如流蘇。<br><b>白口</b>：即銀彭納石首魚，鰓腔黑色、口腔白色。<br><b>黑喉</b>：屬石首魚科，鰓腔、口腔皆為黑色，棲息於砂泥底質較深海域。<br><b>肉魚</b>：即刺鯧、肉鯽魚，重要食用魚，野生數量穩定。<br><b>吳郭魚</b>：由臺籍日本兵吳振輝及郭啟彰引進；臺灣改良之養殖品系又特稱<b>臺灣鯛</b>。"}]}, "textPages": [{"seg": "第一段", "title": "第一段", "book": "課本 P.8~P.9", "noteStart": 1, "lines": [{"text": "每個週末，我顧起魚攤的蛤、蚵、魚，攤位上的魚我只認得白鯧、肉魚、吳郭魚。我問爸，爸叫我問阿公。", "ask": ["這一段寫到哪些<b>具體</b>的工作？", "作者在魚攤上，是<b>幫忙</b>還是<b>工作</b>？"], "cite": "攤位上的魚我只認得白鯧、肉魚、吳郭魚", "mean": "作者對魚類的認識有限", "cite2": "我問爸，爸叫我問阿公", "mean2": "暗示阿公的經驗與知識更為豐富", "rhet": [["頂真", "<span class=\"tp-rq\">我問<b class='rq-hi'>爸</b>，<b class='rq-hi'>爸</b>叫我問阿公</span>"]]}, {"text": "阿公拿起冷凍與{n:1|現流}的白鯧，教我看背上的藍色與鱗片上的微微虹光分辨鮮度，教我從魚鰭魚尾分辨不同品種的白鯧：魚鰭長且魚尾如剪刀的，是正鯧；體色偏灰、魚鰭短的是暗鯧；魚鰭、魚尾短短，鰭邊形狀如流蘇是斗鯧。他問我哪種好吃，我說正鯧，暗鯧與斗鯧偏軟。阿公稱讚{n:2|嘴刁}的我，又拿起白口與黑喉。", "cite": "阿公稱讚嘴刁的我", "mean": "阿公對作者的品味表示讚賞，稱讚他的辨識能力", "rhet": [["類疊", "<span class=\"tp-rq\"><b class='rq-hi'>教我</b>看背上的藍色與鱗片上的微微虹光分辨鮮度，<b class='rq-hi'>教我</b>從魚鰭魚尾分辨不同品種的白鯧</span>"], ["明喻", "<span class=\"tp-rq\">魚鰭長且魚尾如剪刀</span>"], ["明喻", "<span class=\"tp-rq\">鰭邊形狀如流蘇</span>"]]}, {"text": "每個週末不去私立國中的輔導課，在魚攤上生物課。蝦不選紅頭，小卷不選紅身。春末吃海蛤，養殖蛤不選脫皮，臺灣蚵不能賣綠肚。", "cite": "在魚攤上生物課", "mean": "作者將在魚攤上的工作經驗視為生物學的學習過程", "cite2": "蝦不選紅頭，小卷不選紅身。春末吃海蛤，養殖蛤不選脫皮，臺灣蚵不能賣綠肚", "mean2": "列出挑選海鮮的具體標準，暗示阿公的專業知識豐富", "rhet": [["類疊", "<span class=\"tp-rq\">蝦<b class='rq-hi'>不選</b>紅頭，小卷<b class='rq-hi'>不選</b>紅身。春末吃海蛤，養殖蛤<b class='rq-hi'>不選</b>脫皮</span>"]]}, {"text": "這是阿公魚攤的第一學期。", "cite": "這是阿公魚攤的第一學期", "mean": "「第一學期」暗示這是作者在魚攤上學習的起點，強調這段經歷對他成長的重要性"}, {"text": "沒有生來就會賣魚的人。阿公說賣魚要學，學一輩子。", "ask": ["同樣一句「賣魚要學」，阿公和爸差在哪<b>三個字</b>？", "這三個字的差別，代表他們怎麼看這份工作？", "作者後來比較像誰？"], "cite": "沒有生來就會賣魚的人", "mean": "強調賣魚需要持續學習，沒有人天生就會這項技能", "cite2": "阿公說賣魚要學，學一輩子。爸說賣魚要學，學一下子。他們都說以後不要賣魚，好好讀書", "mean2": "阿公和爸爸對賣魚的學習有不同的觀點，但同時都希望作者專注於課業上的學習", "rhet": [["類疊", "<span class=\"tp-rq\">阿公說<b class='rq-hi'>賣魚要學</b>，學一輩子。爸說<b class='rq-hi'>賣魚要學</b>，學一下子</span>"], ["映襯", "<span class=\"tp-rq\">阿公說賣魚要學，學<b class='rq-hi'>一輩子</b>。爸說賣魚要學，學<b class='rq-hi'>一下子</b></span>"], ["頂真", "<span class=\"tp-rq\">賣魚要<b class='rq-hi'>學</b>，<b class='rq-hi'>學</b>一輩子</span>"]]}, {"text": "爸說賣魚要學，學一下子。", "rhet": [["類疊", "<span class=\"tp-rq\">阿公說<b class='rq-hi'>賣魚要學</b>，學一輩子。爸說<b class='rq-hi'>賣魚要學</b>，學一下子</span>"], ["映襯", "<span class=\"tp-rq\">阿公說賣魚要學，學<b class='rq-hi'>一輩子</b>。爸說賣魚要學，學<b class='rq-hi'>一下子</b></span>"], ["頂真", "<span class=\"tp-rq\">賣魚要<b class='rq-hi'>學</b>，<b class='rq-hi'>學</b>一下子</span>"]]}, {"text": "他們都說以後不要賣魚，好好讀書。"}], "notes": [["現流", "閩南語，即「現流仔」，指漁民剛從海潮捕撈上岸而未經冷凍的新鮮海產。「流」，此指潮水。"], ["嘴刁", "指吃東西挑剔，過分講究。"]], "pian": "第一段：作者在週末到家族魚攤協助賣魚，並學習相關知識，家人則希望他好好讀書。", "xi": "作者透過簡單的對話，表達對魚類的認識有限，在魚攤上經由阿公的教導，展現其學習的心態，同時反映出家庭成員間的互動。", "fan": "", "qa": [["阿公教作者分辨魚的鮮度時，提到哪些辨識方法？（擷取訊息）", "看魚「背上的藍色」和「鱗片上的微微虹光」來分辨鮮度。"], ["阿公教作者三種不同鯧魚分辨的特徵是什麼？（擷取訊息）", "正鯧：魚鰭長且魚尾如剪刀。<br>暗鯧：體色偏灰，魚鰭短。<br>斗鯧：魚鰭和魚尾短，鰭邊形狀如流蘇。"], ["作者在魚攤上學習了哪些挑選海鮮的知識？（擷取訊息）", "(1)蝦不選紅頭；(2)小卷不選紅身；(3)春末吃海蛤；(4)養殖蛤不選脫皮；(5)臺灣蚵不能賣綠肚。"], ["作者為何把在魚攤上學習的經歷形容為上「生物課」？（文意推論）", "作者在魚攤上學到魚類的相關知識，這些知識與生物學的內容相似。"], ["阿公和爸爸對於學習賣魚有什麼不同的看法？反映出什麼不同的態度？（擷取訊息／文意推論）", "阿公認為賣魚要學，學一輩子；爸爸認為賣魚要學，只需學一下子。阿公的看法反映對職業的尊重及認真的態度；爸爸的看法則反映出他並未全心投入販魚工作。"], ["作者的家人希望他「好好讀書」，可能是什麼原因？（文意推論）", "希望作者能有更好的未來和更高的社會地位，也反映他們對傳統職業的偏見。"]], "ask": ["圈出<b>作者在魚攤上實際做了哪些事</b>"]}, {"seg": "第二段", "title": "第二段", "book": "課本 P.9~P.11", "noteStart": 3, "lines": [{"text": "週末賣魚很累，上課變成放假，同學說你都不用假日輔導真好，我回說要不然你來賣魚。「才不要咧，很臭。」對，很臭，我聞到我的前臂仍有魚的血味。當他們這樣回時，我會將手掌摀住同學的嘴，說：「很臭嗎？」手拿開，他說臭死了，接下來都是國中生的垃圾話。", "rhet": [["摹寫（嗅覺）", "<span class=\"tp-rq\">我會將手掌摀住同學的嘴</span>──以身體動作寫出魚販之子在校園中被辨識、被排除的處境。"]], "ask": ["他為什麼摀的是<b>別人的嘴</b>，不是自己的手？", "這句有出現「丟臉」兩個字嗎？那我們怎麼知道他丟臉？"], "cite": "我回說要不然你來賣魚。「才不要咧，很臭。」對，很臭，我聞到我的前臂仍有魚的血味。當他們這樣回時，我會將手掌摀住同學的嘴，說：「很臭嗎？」手拿開，他說臭死了，接下來都是國中生的垃圾話", "mean": "用幽默的方式回應同學的嘲諷，並透過肢體互動展現國中生的社交樣貌"}, {"text": "國中時，在魚攤的工作是把魚拿給阿公秤，或是按按磅秤跟客人說價錢，沒多做其他的工作。因為我不想當魚販，不想多踏一步，踏到殺魚的臺前，拿起魚{n:3|刨鱗}，剪刀剪開魚的皮肉。這些不想，我沒有說出口。", "cite": "不想當魚販，不想多踏一步，踏到殺魚的臺前", "mean": "對於成為魚販的抗拒與逃避", "rhet": [["類疊", "<span class=\"tp-rq\"><b class='rq-hi'>不想</b>當魚販，<b class='rq-hi'>不想</b>多踏一步</span>"]]}, {"text": "「你是魚販之子啊，得努力一點，不管你是單親還是什麼，你要為你的身分爭一口氣啊。」當時的導師這樣跟我說，埋入了什麼責任又什麼身分的。我的成績還過得去，便沒人管我要不要出席假日輔導。我的假日起得比上課還早，在空蕩無人的清晨市場等到{n:4|熱絡}，像上課鐘響，只不過我是魚攤上的學徒，被人叫喊。", "cite": "「你是魚販之子啊，得努力一點，不管你是單親還是什麼，你要為你的身分爭一口氣啊。」", "mean": "導師的期許，希望作者不要因為身分背景而妄自菲薄", "cite2": "我的假日起得比上課還早，在空蕩無人的清晨市場等到熱絡，像上課鐘響，只不過我是魚攤上的學徒，被人叫喊", "mean2": "假日清晨市場的描寫，顯現作者對魚販工作的承受"}, {"text": "「很爽喔。」同學常在禮拜一對我說。我又聞了我的手掌。"}, {"text": "只有我缺席的假日輔導，教室的空氣好了一些。", "cite": "只有我缺席的假日輔導，教室的空氣好了一些", "mean": "因作者缺席，所以不會將身上的魚腥味帶到教室；同時亦強調與同學間的疏離，因作者的缺席，反而讓教室空氣好一些"}, {"text": "「幹麼賣魚啦？」臉素淨、頭髮抹上髮膠的男孩問過我。他約我出遊，我不曾說好，每次都說要幫家裡。「真的很孝順欸你。」我笑笑無語。我與他在某個假日午後出遊，忘記去哪了，只記得沒睡午覺的疲憊讓我的臉漲紅，天色都沒暗，就說我要回家了。", "cite": "「真的很孝順欸你。」我笑笑無語", "mean": "對同學的讚美感到無言，因為是一種無奈與疲憊"}, {"text": "久了，就沒人問也沒人約。甚至畢業典禮那天，也沒人問我下午要去哪。往我家方向的站牌，無人等車；對面往城市的站牌，排滿了同學，沒有一個人向我招手。他們坐上一班車，另一群再坐上另一班，直到我等的公車來到。我坐在最後一排五人的座位，中間只有我一人。", "cite": "往我家方向的站牌，無人等車；對面往城市的站牌，排滿了同學，沒有一個人向我招手", "mean": "透過獨自等公車呈現孤獨與落寞", "cite2": "我坐在最後一排五人的座位，中間只有我一人", "mean2": "強調作者與周圍人群的疏離", "rhet": [["類疊", "<span class=\"tp-rq\">就<b class='rq-hi'>沒人</b>問也<b class='rq-hi'>沒人</b>約。甚至畢業典禮那天，也<b class='rq-hi'>沒人</b>問我</span>"], ["映襯", "<span class=\"tp-rq\">往我家方向的站牌，無人等車；對面往城市的站牌，排滿了同學</span>"]]}, {"text": "我睡了又醒，熟悉的路，醒了又睡，直到過站。走了回去。", "cite": "我睡了又醒，熟悉的路，醒了又睡，直到過站。走了回去", "mean": "暗示對當前生活狀態的無奈與迷茫"}, {"text": "就算要大考了，前兩個禮拜我還站在攤位前招呼客人，缺席賣魚還會覺得愧疚。我以為我有想過未來，以為我念了較自由的五專，選了醫事技術系，考上證照成為{n:5|檢驗師}，未來便能離開魚攤。但五專的課程更鬆，我刻意排出早上空堂、下午滿堂的課表，空堂時，在魚攤自學魚之{n:6|解剖學}、魚類辨識課。", "cite": "我以為我有想過未來，以為我念了較自由的五專，選了醫事技術系，考上證照成為檢驗師，未來便能離開魚攤", "mean": "表達對未來的期望與計畫，連續的「以為」，隱含不安與對現實的掙扎", "rhet": [["類疊", "<span class=\"tp-rq\">我<b class='rq-hi'>以為</b>我有想過未來，<b class='rq-hi'>以為</b>我念了較自由的五專</span>"], ["映襯", "<span class=\"tp-rq\">早上空堂、下午滿堂</span>"]]}], "notes": [["刨鱗", "刮除魚體上的鱗片。"], ["熱絡", "感情融洽，往來頻繁。此指人潮多，熱鬧的樣子。"], ["檢驗師", "為醫院內的專業醫事人員，負責檢驗檢體，以做為醫師診斷治療的重要依據。"], ["解剖學", "研究生物體的結構和組織的一門科學。"]], "pian": "第二段：作者敘述工作內容及與同學疏離的無奈，並自我期許透過讀書來掙脫賣魚的宿命。", "xi": "作者賣魚過程的辛苦，及與同學間的疏離，透過導師對自己的期望、同學對他的羨慕及稱讚，反思自我身分的價值，並期許透過讀書能翻轉魚販第三代的宿命。", "fan": "", "qa": [["國中時，作者在魚攤上主要負責哪些工作？（擷取訊息）", "把魚拿給阿公秤重，或是按按磅秤告訴客人價錢。"], ["畢業典禮當天，作者獨自一人坐車回家，推敲他內心的想法為何？（文意推論）", "由於平日推掉同學的邀約，導致沒有人約，此時作者的內心應該感到孤單與被忽略，並充滿無奈。"]], "ask": ["換一種顏色，圈出與<b>家庭、責任、期許</b>有關的內容"]}, {"seg": "第三段", "title": "第三段", "book": "課本 P.12~P.13", "noteStart": 7, "lines": [{"text": "我站在魚攤，拿起一尾尾冰冷的死魚，秤重刨鱗殺肚，換取更多更多的家庭奉獻。", "cite": "我站在魚攤，拿起一尾尾冰冷的死魚，秤重刨鱗殺肚，換取更多更多的家庭奉獻", "mean": "作者在魚攤努力工作，強調對家庭的責任與付出"}, {"text": "常有客人說我很乖，我不知道要怎麼壞。", "cite": "常有客人說我很乖，我不知道要怎麼壞", "mean": "對客人給予的讚美無法回應，是對自己身分與角色無從選擇的迷茫", "rhet": [["映襯", "<span class=\"tp-rq\">常有客人說我很乖，我不知道要怎麼壞</span>"]]}, {"text": "早上起床穿起雨鞋，橡膠的雨鞋{n:7|悶困}了腳，長襪勒緊了腿。久了，腿上有了一圈的黑線。那一圈腿上的黑線像卡在網縫間脫鱗的魚體。", "cite": "早上起床穿起雨鞋，橡膠的雨鞋悶困了腳，長襪勒緊了腿", "mean": "展現工作的辛苦與不適，更象徵工作的束縛", "cite2": "那一圈腿上的黑線像卡在網縫間脫鱗的魚體", "mean2": "腿部出現黑線，並將其比喻為卡在網縫間脫鱗的魚體，強調工作環境的艱苦和對身體的影響", "rhet": [["明喻", "<span class=\"tp-rq\">那一圈腿上的黑線像卡在網縫間脫鱗的魚體</span>"]]}, {"text": "中午換穿球鞋，上起自己毫無興趣的{n:8|微生物學}和化學，覺得人生不能這樣{n:9|虛耗}，卻耗了五年。五專畢業後，轉學考上北部的大學。剛上大學，阿公與爸又說週末沒人幫忙，能週週回來嗎？"}, {"text": "怎會說不能。半年後，週週臺北、臺中來回好累，轉回故鄉的大學。早上沒有課程，下午滿堂，「正職賣魚，讀書像放假」，我都這樣{n:10|自嘲}。那時，我已經能獨當一面站在魚攤前，招呼、買賣、殺魚，只差沒去{n:11|批貨}了。"}, {"text": "「還要學什麼嗎？」我問阿公。", "rhet": [["懸問", "<span class=\"tp-rq\">還要學什麼嗎？</span>"]]}, {"text": "「不用了，學批貨要過一陣子。你還要讀書嗎？」他回。", "rhet": [["懸問", "<span class=\"tp-rq\">你還要讀書嗎？</span>"]]}, {"text": "「要。」我說。"}, {"text": "他說，記得要幫家裡，要好好賣魚。沒有再提好好讀書。", "cite": "他說，記得要幫家裡，要好好賣魚。沒有再提好好讀書", "mean": "暗示家庭的需要和現實的壓力已超越對學業的追求", "rhet": [["類疊", "<span class=\"tp-rq\">要<b class='rq-hi'>好好</b>賣魚。沒有再提<b class='rq-hi'>好好</b>讀書</span>"]]}, {"text": "他說起我爸，說沒兩句，又不說了。他們叫我要幫家裡，叫我得扶住家，撐住這{n:12|頹敗}的牆。多一個人撐住，一動不動，牆至少不會倒塌，就算不能遮風蔽雨又如何。", "cite": "他們叫我要幫家裡，叫我得扶住家，撐住這頹敗的牆", "mean": "強調家庭的脆弱與需要支持的迫切性", "rhet": [["類疊", "<span class=\"tp-rq\">他們<b class='rq-hi'>叫我</b>要幫家裡，<b class='rq-hi'>叫我</b>得扶住家</span>"]]}, {"text": "爸只記得在每個週五夜晚傳LINE過來，說明早還要工作，叫我早點睡。"}, {"text": "一如往常，就算我已經在學業中找到喜歡的事物，甚至有未來的美好模樣。五專畢業兩年，轉學考了好幾間學校，用五專學歷考了研究所，但爸對這些毫無興趣。他的債務{n:13|縛}住阿公與一整個家。", "cite": "他的債務縛住阿公與一整個家", "mean": "暗示父親債務的存在讓阿公與整個家庭受到影響"}], "notes": [["悶困", "指悶脹不適。悶，空間密閉空氣不流通。困，包圍、圍住。"], ["微生物學", "研究微生物的一門學科，微生物指一類肉眼看不到，要在顯微鏡下才能察覺的生物。"], ["虛耗", "浪費、耗損。"], ["自嘲", "以言辭嘲笑自己。"], ["批貨", "大量採購貨品。"], ["頹敗", "衰落、敗壞。"], ["縛", "原是用繩綑綁，此指拘束、約束。"]], "pian": "第三段：作者上五專、大學後仍應家人要求到魚攤幫忙。父親的賭債讓整個家庭經濟受到綁縛。", "xi": "作者在學業與工作中掙扎，即使已在學業中找到興趣與未來的希望，但因父親的賭債、阿公的期待，讓他不得不支撐起家庭的重擔，對此充滿無奈。", "fan": "", "qa": [["作者的長襪勒緊了腿而形成一圈黑線，像卡在網縫間脫鱗的魚體，象徵什麼？（文意推論）", "象徵作者成為魚販已是不可推託的責任，並且深入體內，成為身體的一部分。"], ["上大學時，作者對魚攤工作已能獨當一面，招呼、買賣、殺魚樣樣都行，只差什麼還沒學習？（擷取訊息）", "批貨。"], ["作者已經在學業中找到喜歡的事物，甚至有未來美好的規劃，是什麼原因讓他必須放棄學業？（擷取訊息）", "因為父親的債務縛住整個家庭，讓他必須放棄自己喜愛的事物，接手家中魚攤的工作。"]], "ask": ["作者<b>當時的感受</b>是什麼？", "讓感受<b>改變</b>的事件是什麼？"]}, {"seg": "第四段", "title": "第四段", "book": "課本 P.14~P.15", "noteStart": 14, "lines": [{"text": "「你要好好讀書，別跟那個哥哥一樣賣魚喔。」站在攤位前，有客人這樣說過。", "cite": "「你要好好讀書，別跟那個哥哥一樣賣魚喔。」站在攤位前，有客人這樣說過", "mean": "一般人對從事勞動工作者存在偏見，暗示賣魚工作不是理想的職業"}, {"text": "「對啊，要好好讀書喔，別像我一樣讀交大喔。」一時嘴賤回了客人，客人就此不再來。", "rhet": [["倒反", "<span class=\"tp-rq\">對啊，要好好讀書喔，別像我一樣讀交大喔</span>"]]}, {"text": "他不知道，我就算好好讀書，還是得賣魚。", "cite": "他不知道，我就算好好讀書，還是得賣魚", "mean": "表達作者對於現實的無奈與掙扎"}, {"text": "在我放棄研究所的那天，我告訴了他，我爸。"}, {"text": "他只說要賣魚，讀那麼高幹麼？", "rhet": [["激問", "<span class=\"tp-rq\">讀那麼高幹麼？</span>"]]}, {"text": "那年過年，我開始學習批貨，不再讀書，忘記自己曾經有過的夢。", "cite": "那年過年，我開始學習批貨，不再讀書，忘記自己曾經有過的夢", "mean": "作者在家庭責任與追求個人理想間，最終選擇放棄自己的夢想"}, {"text": "成了魚販。每天凌晨穿上雨鞋，直到下午，脫下雨鞋與長襪，忽然解放又{n:14|襲來}痠痛，更深更深的睡意。"}, {"text": "我以為洗去身上的魚味，穿上怎樣的服裝，又能變成怎樣的人。但作為魚販，是{n:15|黏著}在皮膚上的魚鱗，沒有感覺便{n:16|嵌}在那，覺得癢的時候想拔下那些魚鱗，才發現體膚已經有不一樣的顏色了。", "cite": "我以為洗去身上的魚味，穿上怎樣的服裝，又能變成怎樣的人", "mean": "希望透過除去身上魚味與改變穿著來讓自己的形象與生活狀態有所不同，暗示對現實的逃避和追求更好生活的期望", "cite2": "但作為魚販，是黏著在皮膚上的魚鱗，沒有感覺便嵌在那，覺得癢的時候想拔下那些魚鱗，才發現體膚已經有不一樣的顏色了", "mean2": "「魚鱗」暗示所承受的負擔，這些負擔隱形的附著在身上，讓作者感到不適卻又無法擺脫"}, {"text": "凌晨兩三點的高速公路，沒什麼車，通往那時最熱鬧的地方：魚市。嘈雜到嗓門加大，氣味紛雜，聞不出魚臭，千百盞燈照出的世界已無黑暗。我下了貨車，踏入潮溼，邊走邊點頭或是捶打他人手臂，幾句髒話，都只是招呼。當我習慣這些生活，我就接受了自己是名魚販。魚販中，有幾個跟我相似的年輕人，有{n:17|老派}如阿公的人；有幾個會讓人想起誰，有幾個是他自己的模樣。", "rhet": [["聽覺摹寫", "<span class=\"tp-rq\">嘈雜到嗓門加大</span>"], ["嗅覺摹寫", "<span class=\"tp-rq\">氣味紛雜，聞不出魚臭</span>"], ["視覺摹寫", "<span class=\"tp-rq\">千百盞燈照出的世界已無黑暗</span>"], ["觸覺摹寫", "<span class=\"tp-rq\">踏入潮溼</span>"]]}, {"text": "「讀那麼高，幹麼賣魚啦？」又有人問我。", "cite": "「讀那麼高，幹麼賣魚啦？」又有人問我。我更難回答了。「只是工作。」我說", "mean": "外界對念過研究所的作者從事賣魚工作產生質疑，作者簡單回應只是工作，反映他對現實的無奈與對自己選擇的辯護"}, {"text": "我更難回答了。「只是工作。」我說。"}], "notes": [["襲來", "撲向、觸及。"], ["黏著", "附著緊貼。"], ["嵌", "把東西填入空隙。"], ["老派", "觀念舉止守舊。"]], "pian": "第四段：作者因家庭因素，放棄高學歷及夢想，成為魚販並接受這個身分。", "xi": "作者放棄高學歷及夢想，還要接受社會世俗質疑的眼光，在家庭責任與個人理想間掙扎，除迷茫、無奈，也充滿遺憾。但回頭檢視時，發覺自己已接受成為魚販的事實。", "fan": "", "qa": [["有客人站在攤位前跟小孩告誡要好好讀書，不要像作者一樣賣魚。社會大眾對賣魚工作抱持什麼想法？（文意推論）", "對魚販工作的不理解與不尊重，並主觀認為不讀書的人才會去賣魚。"], ["作者說：「作為魚販，是黏著在皮膚上的魚鱗，沒有感覺便嵌在那，覺得癢的時候想拔下那些魚鱗，才發現體膚已經有不一樣的顏色了。」這句話意謂什麼？（文意推論）", "意謂魚販的特質在不知不覺間已經深入作者體內，無法改變。"]], "ask": ["作者把魚賣得很好，這代表他已經<b>接受</b>這份工作了嗎？"]}, {"seg": "第五段", "title": "第五段", "book": "課本 P.16~P.17", "noteStart": 18, "lines": [{"text": "接下魚攤時，吳郭魚一公斤六十元，阿公中風在床。我仍在賣魚，變了一些，但爸仍然在賭。沒人問過我喜不喜歡賣魚，我卻每日每夜的問自己：不喜歡又能怎樣？", "cite": "沒人問過我喜不喜歡賣魚，我卻每日每夜的問自己：不喜歡又能怎樣？", "mean": "反映作者的不滿與無奈。「不喜歡又能怎樣」顯示出他對現實的妥協", "rhet": [["激問", "<span class=\"tp-rq\">不喜歡又能怎樣？</span>"]]}, {"text": "賣魚賣雞賣肉不太會成為志願，也非我志向，非我所願，但要找個支撐住「家」的方法，便是直挺的站著喊：人客來喔，魚很新鮮喔。", "rhet": [["類疊", "<span class=\"tp-rq\">也<b class='rq-hi'>非我</b>志向，<b class='rq-hi'>非我</b>所願</span>"], ["飛白", "<span class=\"tp-rq\">人客來喔，魚很新鮮喔</span>"]]}, {"text": "又幾年後，阿公死去，吳郭魚一公斤七十元，臺灣的白鯧愈來愈少，冷凍的白鯧不復見。我仍然賣魚，但離開了原生家庭，不在魚攤。{n:18|裝睡的人叫不醒}，爸仍然在賭。為了我的兒女，我得離開。", "rhet": [["借喻", "<span class=\"tp-rq\">裝睡的人叫不醒</span>──以「裝睡」喻父親刻意迴避、不願面對的態度。"]], "cite": "裝睡的人叫不醒，爸仍然在賭", "mean": "表達對父親的失望。「裝睡的人叫不醒」暗示父親對家庭問題的逃避與無所作為，無論旁人如何努力，他都不改變自己的行為。「爸仍然在賭」更直接指出父親持續沉迷賭博，家庭所面臨的困境與壓力"}, {"text": "現在我會吃冷凍的白鯧了，我會輕輕的夾給兒女和自己。我們都吃過現流的白鯧，所以知道冷凍白鯧不好吃。", "cite": "現在我會吃冷凍的白鯧了，我會輕輕的夾給兒女和自己。我們都吃過現流的白鯧，所以知道冷凍白鯧不好吃", "mean": "對於冷凍白鯧的接受，暗示在生活中接受現實的過程，也是對過去種種的回憶與懷念。現流的白鯧象徵過去的一切；冷凍白鯧則代表新的生活現實"}, {"text": "變成稱職的魚販之前，我學會了什麼工作令我厭惡，同時學會了什麼令我嚮往。既然不愛的、討厭的都能做好，那還有什麼不能做呢？我這麼想。", "cite": "既然不愛的、討厭的都能做好，那還有什麼不能做呢？", "mean": "在面對生活挑戰時的勇氣與決心", "rhet": [["類疊", "<span class=\"tp-rq\">我<b class='rq-hi'>學會了什麼</b>工作<b class='rq-hi'>令我</b>厭惡，同時<b class='rq-hi'>學會了什麼</b><b class='rq-hi'>令我</b>嚮往</span>"], ["激問", "<span class=\"tp-rq\">那還有什麼不能做呢？</span>"]]}, {"text": "沒有出生就會賣魚的人。沒有什麼東西，不用學一輩子。", "ask": ["同樣一句「賣魚要學」，阿公和爸差在哪<b>三個字</b>？", "這三個字的差別，代表他們怎麼看這份工作？", "作者後來比較像誰？"], "rhet": [["類疊", "<span class=\"tp-rq\"><b class='rq-hi'>沒有</b>出生就會賣魚的人。<b class='rq-hi'>沒有</b>什麼東西</span>"]]}, {"text": "身為一名魚販，我很努力，很努力了。", "cite": "身為一名魚販，我很努力，很努力了", "mean": "重複「很努力」，表示對這個身分的肯定", "rhet": [["類疊", "<span class=\"tp-rq\">我<b class='rq-hi'>很努力</b>，<b class='rq-hi'>很努力</b>了</span>"]]}], "notes": [["裝睡的人叫不醒", "指故意假裝睡覺的人不會因為別人的呼喚而醒來。通常形容人故意不回應或漠不關心的態度。"]], "pian": "第五段：作者敘述成為魚販的心路歷程，完全接受自己已成為一名努力的魚販。", "xi": "從四條支線：阿公的身體狀況、白鯧的價格、自我的成長及父親的惡習來敘述。阿公如白鯧，逐漸消失，家庭的責任也在作者有了兒女而變得沉重，但對於生活的挑戰，不管愛或不愛都要有勇氣，作者在這過程中肯定自己的努力。", "fan": "", "qa": [["為何作者說爸爸是「裝睡的人叫不醒」？（擷取訊息）", "因歷經積欠賭債、阿公過世等巨變，爸爸無視這些狀況還繼續賭博。"], ["是什麼原因讓作者決定離開原生家庭？（擷取訊息）", "因作者的爸爸繼續賭博，作者為了自己的兒女考量，決定離開原生家庭。"]], "ask": ["作者最後<b>和解</b>了嗎？和誰？"]}]},
  '師說': {"handoutV2": [{"title": "一、作者與題解", "page": "P.28", "blocks": [["table", "", [["唐宋古文八大家之首─韓愈"], ["字號", "<span class=\"hd-subhead\">1.</span>字<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">退之</span></span>，諡號文，世稱<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">韓文公</span></span>。<br><span class=\"hd-subhead\">2.</span>昌黎為其家族郡望，撰文常自稱昌黎　韓愈，世稱<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">韓昌黎</span></span>"], ["時代", "河南　河陽人。代宗　大曆三年（西元768年）～穆宗　長慶四年（西元824年），年五十七"], ["思想", "發揚<span class=\"jy-cir\">④</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">儒家</span></span>學說，排斥<span class=\"jy-cir\">⑤</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">佛、老</span></span>思想"], ["生平", "<span class=\"hd-subhead\">1.</span>幼年刻苦向學，二十五歲中進士，最高官至吏部侍郎<br><span class=\"hd-subhead\">2.</span>個性耿直敢言，曾因反對憲宗迎佛骨上表勸諫，被貶為潮州<span class=\"hd-anno\">（今廣東省 潮州市）</span>刺史"], ["學術<br>造詣", "<span class=\"hd-subhead\">1.</span>一生致力發揚儒家學說，排斥佛、老思想。文學上倡導古文，與柳宗元推展古文運動<br><span class=\"hd-subhead\">2.</span>主張以先秦、兩漢樸實無華的散文，取代六朝以來綺靡浮豔的駢文，奠定唐 宋散文發展"], ["文學<br>風格", "散文：氣勢雄健，風格多樣<br>詩歌：詩作奇崛險怪，為「奇險派」代表"], ["成就", "<span class=\"hd-subhead\">1.</span>蘇軾　潮州韓文公廟碑：「文起<span class=\"jy-cir\">⑥</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">八代</span></span>之衰，道濟天下之溺。」<span class=\"hd-anno\">（八代：東漢、魏、晉、宋、齊、梁、陳、隋）</span>、「匹夫而為百世師，一言而為天下法。」<br><span class=\"hd-subhead\">2.</span>明　茅坤輯錄唐宋八大家文鈔，以韓愈為首<span class=\"hd-anno\">（唐：韓愈、柳宗元；宋：歐陽脩、曾鞏、王安石、蘇洵、蘇軾、蘇轍）</span>"], ["著作", "昌黎先生集"], ["題解<br>要旨", "<span class=\"hd-subhead\">1.</span>本文選自昌黎先生集，目的在闡述從師問學的重要<br><span class=\"hd-subhead\">2.</span>「說」是解釋義理、闡述己見的一種文體。為中國古代論辨類的一種文體，內容大都偏重說明、解釋事理<br><span class=\"hd-subhead\">3.</span>中唐時期，士大夫之族多仗恃門第高貴，不願從師問學。韓愈為維護儒家道統，推行古文運動，曾公開招收學生，飽受批評亦不畏懼<br><span class=\"hd-subhead\">4.</span>適逢李蟠前來求教，於是韓愈寫下此文，藉機端正風氣，強調不論貴賤長少，學必有師；並點出「道之所存，師之所存」的擇師標準"]]]]}, {"title": "(一)文體簡介——序", "page": "P.29", "blocks": [["table", "", [["", "篇名", "作者", "主旨"], ["書序", "太史公自序", "西漢　司馬遷", "陳述修撰史記的緣由，並介紹全書體例與內容"], ["書序", "臺灣通史序", "民國　連橫", "陳述修撰臺灣通史的緣由，並介紹全書體例與內容"], ["詩序", "桃花源記", "東晉　陶淵明", "乃桃花源詩前的小記，作者身遭世變，託言避秦，自闢一理想世界"], ["詩序", "琵琶行并序", "唐　白居易", "白居易聞商婦身世，有同是天涯淪落人之感，賦此詩以寄意"], ["贈序", "師說", "唐　韓愈", "旨在闡明從師問學之道及尊師重道之理。韓愈慨師道之廢，批判時俗之非，故藉李蟠之從學，極陳時俗之失，倡言學必有師"], ["贈序", "送董邵南序", "唐　韓愈", "旨在以「慕義彊仁（仰慕並力行仁義）」勸勉董邵南應明辨是非，審慎選擇去留"]]], ["table", "", [["※書序：乃陳述著作之旨趣。漢、魏、六朝多置於書後，唐代之後則置於書前<br>　贈序：乃臨別贈予行者之言，或抒發離情，或嘉勉勸慰"]]]]}, {"title": "(二)古文運動發展簡史", "page": "P.29", "blocks": [["table", "", [["初唐", "代表人物：陳子昂、張說、李華、元結<br>主張：陳子昂奏疏不用駢儷，張說、李華、元結等不拘於駢文，為古文運動先驅（倡內容而非偏重形式）<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span>陳子昂〈登幽州臺歌〉：「前不見古人，後不見來者。念天地之悠悠，獨愴然而涕下。」語譯：向前看不見古代招賢的明君，向後看不見後世求才的賢主。想到天地如此浩大長久，一人獨自悲傷而流下眼淚。<br>→詩風質樸剛健、直抒胸臆，一掃齊、梁以來浮豔纖巧之氣，展現漢、魏風骨，與其倡導古文精神一致</div></div>"]]], ["table", "", [["中唐", "代表人物", "韓愈", "主張", "文章", "<b>文以載道</b>。以散文對抗駢文"], ["中唐", "代表人物", "韓愈", "主張", "思想", "反佛。以儒學對抗佛、老"], ["中唐", "代表人物", "柳宗元", "主張", "文章", "<b>文以明道</b>。考訂文字真偽，開啟清代考據先河"], ["中唐", "代表人物", "柳宗元", "主張", "思想", "好佛。博涉諸子，出入儒、釋、道之間"]]], ["table", "", [["晚唐", "靡麗之風再起，唯美的駢文又盛<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示補充</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">補充</span>晚唐駢文能再度興盛，關鍵人物是<b>李商隱</b>：他自定其駢文集為樊南四六甲乙集，確立「駢四儷六」的固定格式，後世奉為典範；北宋初年「西崑體」作家楊億、劉筠、錢惟演等人更群起仿效其風格，可見李商隱以一己之力帶動了晚唐至宋初駢文的復興</div></div>"], ["北宋", "代表人物：<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">歐陽脩</span></span>、<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">曾鞏</span></span>、<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">王安石</span></span>、<span class=\"jy-cir\">④</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">蘇洵</span></span>、<br><span class=\"jy-cir\">⑤</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">蘇軾</span></span>、<span class=\"jy-cir\">⑥</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">蘇轍</span></span><br>過程：歐陽脩初為駢文，及至得韓愈文集殘本，遂倡為古文，力尊韓文，使古文中衰之勢，得以復振；又拔取三蘇、曾鞏、王安石，使文風丕變，古文遂為文章之正宗<br>結果：古文成為文章正宗、散文主流"], ["明", "<span class=\"jy-cir\">⑦</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">茅坤</span></span>編纂唐宋八大家文鈔，確定「八大家」的稱號<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示補充</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">補充</span>此時文壇另有<b>秦漢派</b>與<b>唐宋派</b>之爭：明初以來，官方提倡典雅工整卻空洞的「台閣體」，加上科舉八股文束縛思想，文壇漸趨僵化。前後七子（李夢陽、何景明、李攀龍、王世貞等）不滿此風，主張「文必秦漢，詩必盛唐」，強調模擬先秦、兩漢古文與盛唐詩歌的格調字句，是為<b>秦漢派</b>；後來王慎中、唐順之、歸有光、茅坤等人又反對秦漢派一味擬古、流於抄襲剽竊，主張應如唐、宋古文家般直抒真摯情感，義理內容重於形式模擬，是為<b>唐宋派</b>，茅坤正是其中重要成員。歸有光曾批評擬古之人「苟得一二妄庸人為之鉅子，爭附和之」，可見兩派的根本分歧在於：究竟該模擬古人字句格調，還是該重視文章的真情與義理</div></div>"], ["清", "代表人物：桐城派——開山祖方苞、中繼者劉大櫆、集大成者姚鼐<br>主張：方苞主張嚴標「義法」（義：指內容要言之有物；法：指形式要言之有序）；姚鼐主張「義理」、「詞章」、「考據」並重<br>姚鼐編訂古文辭類纂為文章範本"]]]]}, {"title": "(三)韓愈與柳宗元比較", "page": "P.30", "blocks": [["table", "", [["", "韓愈", "柳宗元"], ["字號", "字退之。自稱昌黎　韓愈，世稱韓昌黎", "字子厚。世稱柳河東、柳柳州"], ["諡號", "諡文。世稱韓文公", "無"], ["追贈", "宋神宗追封昌黎伯", "無"], ["際遇", "諫憲宗勿迎佛骨事，貶潮州刺史", "因王叔文事件，貶永州司馬"], ["思想", "發揚儒家學說，排斥佛、老思想", "博涉諸子，出入儒、釋、道之間"], ["古文", "倡導古文運動，為唐　宋古文八大家之首", "參與古文運動，為唐　宋古文八大家之一"], ["文評", "蘇軾稱其：「文起八代之衰，道濟天下之溺」、「匹夫而為百世師，一言而為天下法」", "韓愈稱其：「雄深雅健，似司馬子長。」"], ["文風", "文章以「載道」為主。氣魄雄渾，語言精鍊", "主張「文以明道」。文章雄深雅健，峻傑精嚴"], ["詩風", "奇崛險怪", "疏淡簡樸，幽深冷峻"], ["著作", "昌黎先生集（李漢編）", "柳河東集（劉禹錫編）"]]]]}, {"title": "(四)駢文流變", "page": "P.30", "blocks": [["table", "", [["特點", "對仗工整、四六句式、音韻和諧、平仄相對、善用典故、詞藻華美。始於東漢，盛於六朝，仍屬「非韻文」"], ["別名", "李商隱名其駢文集為樊南四六甲乙集，確定駢四儷六的形式，故唐代駢文又稱「四六文」"]]], ["table", "", [["發展", "秦代", "李斯　諫逐客書文章瑰麗排比，氣勢奔放，被譽為「駢體之初祖」<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span>「泰山不讓土壤，故能成其大；河海不擇細流，故能就其深。」語譯：泰山不排斥任何微小的泥土，才能成就它的高大；河海不捨棄任何細小的水流，才能成就它的深廣。<br>→上下句字數相同、句式對稱，可見駢文講求對仗的特色</div></div>"], ["發展", "漢代", "<span class=\"hd-subhead\">1.西漢：</span>已有運用對偶句的傾向，如：賈誼 過秦論<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span>「有席卷天下，包舉宇內，囊括四海之意，并吞八荒之心。」語譯：（秦孝公）懷有席捲天下、包攬海內、囊括四海、併吞八方的雄心。<br>→四句排比、詞藻鋪張，展現西漢初期散文逐漸講求對偶鋪陳的傾向</div></div><br><span class=\"hd-subhead\">2.東漢：</span>文章多屬駢散兼用之體"], ["發展", "魏　晉<br>南北朝", "<span class=\"hd-subhead\">1.</span>魏　晉駢文逐漸成熟；六朝時駢文盛行取代散文，當時並未嚴格要求對仗工整<br><span class=\"hd-subhead\">2.</span>南朝　徐陵、庾信辭藻豔麗，號「徐　庾體」，庾信　哀江南賦為千古名篇<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span>「潘岳之文采，始述家風；陸機之辭賦，先陳世德。」（哀江南賦．序）語譯：像潘岳的文采，一開始先敘述家族的門風；像陸機的辭賦，率先陳述家世的德業。<br>→四字對四字，六字對六字，句式工整，又善用潘岳、陸機兩位西晉文學家的典故，可見駢文詞藻華美、善用典故的特色</div></div><br><span class=\"hd-subhead\">3.</span>劉勰　文心雕龍是中國最早的文學批評專書，內容以駢文寫成"], ["發展", "唐代", "<span class=\"hd-subhead\">1.</span>柳宗元　乞巧文針對駢體文以四字、六字為基本句法的特色而說明：「駢四儷六，錦心繡口」，因此駢體文在晚唐被稱為「四六文」<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span>「眩耀為文，瑣碎排偶；抽黃對白，啽哢飛走。」（乞巧文）語譯：賣弄炫耀地寫文章，瑣碎地講求排比對偶；抽換辭藻、兩兩相對，如鳥雀般吱吱喳喳。<br>→柳宗元藉此諷刺當時駢文堆砌辭藻、講求對仗卻空洞瑣碎的流弊</div></div><br><span class=\"hd-subhead\">2.</span>李商隱自定其文集為樊南四六甲乙集。從宋代到明代都沿用「四六文」這個名稱（四六文的作法與六朝駢文不同，平仄對仗要求十分嚴格），至清代才叫做駢體文<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span><b>原文：</b>「揖西園之上賓，必稱佳句；攜東山之妙妓，或配新聲。」<br><span style=\"color:var(--L-trans,#6b5a42)\">語譯：迎接、款待如「西園」般珍貴的座上貴賓時，必定要互相吟詠、讚賞美好的詩文佳作；攜帶如「東山」般才華洋溢的歌妓一同出遊時，便會為她們配上新創作的音樂曲調來歌唱。</span><br><b>用典：</b><span style=\"color:var(--L-trans,#6b5a42)\">「西園之上賓」指魏文帝曹丕與曹植兄弟在洛陽西園宴請建安七子（王粲、應瑒等）的盛事，後成為文人雅集的代稱；「東山之妙妓」指東晉謝安隱居東山時常攜妓出遊，後成為文人風流儒雅的典型形象。</span><br><b>對仗：</b><span style=\"color:var(--L-trans,#6b5a42)\">「揖」對「攜」（動詞）、「西園」對「東山」（地名）、「上賓」對「妙妓」（人物）、「必稱」對「或配」（副詞＋動詞）、「佳句」對「新聲」（文學對音樂），上下句字數相同、詞性一一相對</span></div></div>"], ["發展", "宋代", "<span class=\"hd-subhead\">1.</span>受古文運動影響，不尚用典，語言平易，自成風格，四六文至此漸趨沒落<br><span class=\"hd-subhead\">2.</span>「西崑體」作家：楊億、劉筠、錢惟演等人，模擬晚唐、五代文風，講究雕章麗句，忽視內容<div class=\"hd-box\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><div class=\"hd-cov hd-cov-eg\">▸ 點此顯示例句</div><div class=\"hd-in hd-eg-in\"><span class=\"hd-k hd-k-eg\">例句</span><b>原文：</b>「時今紫微錢君希聖，祕閣劉君子儀，並負懿文，尤精雅道。」（楊億〈西崑酬唱集序〉）<br><span style=\"color:var(--L-trans,#6b5a42)\">語譯：當時身任紫微省官職的錢惟演（字希聖），以及任職於祕閣的劉筠（字子儀），兩人都身負美好卓越的文才，尤其精通高雅的詩文創作之道。</span><br><b>用典：</b><span style=\"color:var(--L-trans,#6b5a42)\">「紫微」本指中書省（唐代曾改稱紫微省），這裡借指錢惟演當時的中央官職；「祕閣」為北宋皇家藏書、選用飽學文臣任職之處，借指劉筠的職務；兩者皆以典雅古稱包裝人物身分，避開俗白的官銜稱呼</span><br><b>對仗：</b><span style=\"color:var(--L-trans,#6b5a42)\">「錢君希聖」對「劉君子儀」（人名對人名，字號對字號）、「紫微」對「祕閣」（官署對官署）、「並負懿文」對「尤精雅道」（副詞＋動詞＋名詞，句式工整），可見西崑體講求用典與辭藻華麗的特色</span></div></div>"], ["發展", "清代", "駢文呈現復興氣象，袁枚、汪中、龔自珍等名家為代表，多棄唐　宋古文，力追漢、魏、六朝之文"]]]]}, {"title": "(五)駢文、散文之比較", "page": "P.31", "blocks": [["table", "", [["體別", "駢文", "散文"], ["別名", "四六文（李商隱自定其所作之駢文為樊南四六甲乙集，於是「四六」之名乃確定）", "古文"], ["發展", "盛於六朝，定型於唐，衰於宋後，復興於清", "初唐 陳子昂等人，捨駢文而作散文，為古文運動先驅<br>唐<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">韓愈</span></span>、<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">柳宗元</span></span>出，復倡古文<br>宋<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">歐陽脩</span></span>力尊韓文，王安石、曾鞏、三蘇隨之，古文因此大振，古文運動完全成功<br>元、明、清亦重視"], ["特色", "音韻和諧、平仄相對、善用典故、詞藻華美<br>駢文屬「非韻文」，不要求押韻", "樸實無華，涵蘊教化"]]]]}, {"title": "(一)文本透視鏡", "page": "P.31-32", "blocks": [["table", "", [["寫作背景", "1.本文大約寫於唐德宗　貞元十八年（西元　802　年），當時韓愈三十五歲，在長安任國子監四門博士<br>2.自魏　晉以來，社會上形成一種以「士大夫之族」為代表的門閥制度，士子不肯從師學習，也瞧不起從師學習的人<br>3.韓愈為糾正當時這種不良的社會風氣，於是寫了師說一文以正視聽。因此，表面上師說是為李蟠而作，實際上是為了抨擊那些恥於從師的「士大夫之族」，進而藉機倡導<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbs /span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">從師問學</span></span>」的重要<br>●論據（立論的根據）：運用三組對比，論述從師與否的差別<br>●論證（推論出結論的過程）：由各項論據推論不從師的結果，凸顯從師的重要"], ["寫作<br>特色", "<span class=\"hd-subhead\">1.層層推進，論述師道關係：</span>首段提出<span class=\"hd-anno\">「學者必有師」</span>的主張，進而闡述老師的作用在於<span class=\"hd-anno\">「傳道、受業、解惑」</span>，而擇師標準則是<span class=\"hd-anno\">「道之所存，師之所存」</span><br><span class=\"hd-subhead\">2.對比論證，從師問學的重要：</span>古之聖人<span class=\"hd-anno\">「從師而問」</span>，今人卻<span class=\"hd-anno\">「恥學於師」</span>，結果是<span class=\"hd-anno\">「聖益聖，愚益愚」</span>。士大夫為孩子擇師，自己卻恥於從師；百工不恥相師，士大夫恥於從師，結果是<span class=\"hd-anno\">「其智乃反不能及」</span><br><span class=\"hd-subhead\">3.以至聖孔子為例，反襯時人恥學於師的不智：</span>孔子<span class=\"hd-anno\">「學無常師」</span>，凸顯<span class=\"hd-anno\">「弟子不必不如師，師不必賢於弟子」</span>與<span class=\"hd-anno\">「聞道有先後，術業有專攻」</span>的論點。從師受業學道的主旨，與開端<span class=\"hd-anno\">「道之所存，師之所存」</span>及古聖<span class=\"hd-anno\">「從師而問」</span>相呼應。指出<span class=\"hd-anno\">「位卑則足羞，官盛則近諛」</span>之謬，揭示振興師道之論"]]]]}, {"title": "一、形近字", "page": "P.33", "blocks": [["table", "", [["偏旁", "音", "例"], ["臾", "ㄩˊ", "須「臾」、豐「腴」、阿<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">諛</span></span>奉承、茱「萸」（又名「越椒」、「艾子」，是一種常綠帶香植物，具備殺蟲消毒、逐寒祛風的功能）"], ["臾", "ㄩˇ", "「庾」澄慶"], ["番", "<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">ㄆㄢˊ</span></span>", "李「蟠」、龍「蟠」虎踞（形容地勢雄偉險要）"], ["番", "ㄆㄛˊ", "「鄱」陽湖、白髮「皤」皤（頭髮白的樣子）"], ["番", "ㄈㄢ", "「幡」然悔悟（澈底的悔改、醒悟）"], ["冉", "ㄉㄢ", "老「聃」"], ["冉", "ㄖㄢˊ", "虬（ㄑㄧㄡˊ）「髯」"], ["冉", "ㄖㄢˇ", "「冉」冉上升、荏（ㄖㄣˇ）<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">苒</span></span>（時間漸漸過去）"]]]]}, {"title": "二、字詞義比較", "page": "P.34", "blocks": [["table", "", [["字詞", "義", "例"], ["師", "<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">老師</span></span>", "古之學者必有「師」<br>「師」者，所以傳道、受業、解惑也<br>惑而不從「師」，其為惑也終不解矣<br>道之所存，「師」之所存也<br>愛其子，擇「師」而教之"], ["師", "從師問學的", "「師」道之不傳也久矣<br>「師」道之不復可知矣"], ["師", "<span class=\"jy-cir\">②</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">有專門技藝的人</span></span>", "巫、醫、樂「師」、百工之人<br>孔子師郯子、萇弘、「師」襄、老聃"], ["師", "<span class=\"jy-cir\">③</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">學習</span></span>", "生乎吾前，其聞道也，固先乎吾，吾從而「師」之<br>吾「師」道也，夫庸知其年之先後生於吾乎<br>於其身也則恥「師」焉<br>巫、醫、樂師、百工之人，不恥相「師」<br>孔子「師」郯子、萇弘、師襄、老聃"], ["貽", "贈送", "作師說以「貽」（ㄧˊ）之"], ["貽", "遺留", "「貽」（ㄧˊ）笑大方（被識見廣博或精通此道的內行人所譏笑。「大方」泛指見多識廣或有某種專長的人。亦作「見笑大方」）、「貽」害無窮、「貽」人口實（指說話做事不小心，給人留下話柄。口實，話柄）"], ["賤", "地位低", "是故無貴無「賤」、無長無少，道之所存，師之所存也<br>貧「賤」夫妻百事哀"], ["賤", "價格低廉", "「賤」價出售"], ["賤", "輕視", "貴古「賤」今、貴遠「賤」近"], ["賤", "謙稱自己的", "「賤」息"], ["賤", "輕佻不自重", "輕「賤」"], ["所以", "用來（表目的）", "師者，「所以」傳道、受業、解惑也"], ["所以", "為何（表原因）", "聖人之「所以」為聖，愚人之「所以」為愚"], ["不恥", "不以……為恥", "「不恥」下問"], ["不齒", "不屑與之並列", "君子「不齒」"]]]]}, {"title": "一、錯綜（交蹉語次）", "page": "P.35", "blocks": [["table", "", [["定義", "又稱為「錯綜其語」。這是改變、互換上下文的詞語位置"], ["例句", "句讀之不知，惑之不解，或師焉，或不焉。<br>→<span class=\"jy-cir\">①</span><span class=\"jy-blank\" onclick=\"this.classList.toggle(&#39;show&#39;)\"><span class=\"jy-blank-ph\">&nbsp;&nbsp;&nbsp;&nbsp;</span><span class=\"jy-blank-ans\">句讀之不知，或師焉；惑之不解，或不焉</span></span>"]]]]}, {"title": "二、回文", "page": "P.35", "blocks": [["table", "", [["定義", "上下兩個短語或句子，詞語大多相同，詞序排列恰好相反，造成迴環往復的形式，凸顯兩者之間的相互關係"], ["例句", "是故弟子不必不如師，師不必賢於弟子。<br>學而不思則罔；思而不學則殆。（論語　為政）（語譯︰只學習而不深入思考，就會迷惘而無所得；只思考而不實際學習，就會疑惑不安。）"]]]]}, {"title": "一、成語", "page": "P.35", "blocks": [["table", "", [["成語", "釋義", "例句"], ["程門立雪", "比喻尊敬師長和虔誠向學。", "他在求知的道路上展現程門立雪的謙遜態度與毅力，最終學有所成。"], ["懸梁刺股", "比喻人發憤努力學習。", "他為了達成自己的夢想，每天懸梁刺股，精進自身技能，最終得償所願。"], ["桃李之教", "指老師的教誨。", "儘管退休多年，他的桃李之教仍深深影響著曾經受教的學生們。"], ["師嚴道尊", "指師長受人尊敬，所傳授的知識、技能等才會被尊重。", "「師嚴道尊」是老師教學的重要守則。"]]]]}, {"title": "二、用於教育界的題辭", "page": "P.35", "blocks": [["table", "", [["化雨均霑", "形容教育工作培育英才極多。"], ["作育菁莪", "形容從事教育工作，造就人才極多。菁莪，比喻樂於培育英才。"], ["百年樹人", "形容培育人才極多。"], ["杏壇之光", "教育界之光。杏壇，相傳為孔子講學授徒的地方，今泛指教育界。"], ["春風廣被", "形容師長教育之功如春風般影響深遠。"], ["時雨春風", "比喻老師的教化如春風、時雨般和藹親切。"], ["教秉尼山", "秉持孔子的教育精神來教導學子。尼山，指孔子，字仲尼。"], ["弦歌不輟", "弦歌，原指音樂，此處指教育學術殿堂。輟，音ㄔㄨㄛˋ，停止。"], ["廣栽桃李", "形容其教導的學生人數極多。"]]]]}, {"title": "（ㄧ）潮州韓文公祠聯", "page": "P.36", "blocks": [["table", "", [["<span class=\"hd-anno\">佛骨謫來，嶺海因而生色／鱷魚徙去，江河自此澄清。</span>"]]], ["table", "", [["說明：韓愈被貶官至潮州，撰寫祭鱷魚文，為潮州人民除去鱷魚之害。<br>語譯：韓愈因諫勿迎佛骨而被貶到嶺南，才讓南海因他而增色不少。也因寫了一篇祭鱷魚文，讓鱷魚遠離，從此江湖更為澄清無禍害。"]]]]}, {"title": "（二）潮州韓文公祠聯", "page": "P.36", "blocks": [["table", "", [["<span class=\"hd-anno\">天意起斯文，不是一封書，安得先生到此／人心歸正道，只須八個月，至今百世師之。</span>"]]], ["table", "", [["說明：韓愈因反對憲宗迎佛骨，呈上論佛骨表，而被貶至潮州。韓愈治理潮州雖不到八個月，但政績卓著，為人稱道。<br>語譯：上天有意開啟文風，若不是一封論佛骨表，韓先生怎會被貶至潮州？使人心歸向於正道，只需要八個月，百代後人們仍以韓先生為師法的導師。"]]]]}, {"title": "（一）進學解　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　韓　愈", "page": "P.36", "layout": "split", "blocks": [["table", "", [["言未既，有笑於列者曰：「先生欺余哉！弟子事先生，於茲有年矣。先生口不絕吟於六藝之文，手不停披於百家之編。(甲)紀事者必提其要，纂言者必鉤其玄。貪多務得，細大不捐。(乙)焚膏油以繼晷，恆兀兀以窮年。先生之業，可謂勤矣。<br>　　觝排異端，攘斥佛　老。補苴罅漏○，張皇幽眇。尋墜緒之茫茫，獨旁搜而遠紹。障百川而東之，迴狂瀾於既倒。先生之於儒，可謂有勞矣。<br>　　(丙)沉浸醲郁，含英咀華，作為文章，其書滿家。上規姚　姒○，渾渾無涯；周誥、殷盤，佶屈聱牙；春秋謹嚴，左氏浮誇；易奇而法，詩正而葩；下逮莊　騷，太史所錄；子雲　相如，同工異曲。先生之於文，可謂閎其中而肆其外矣。"]]], ["table", "", [["(丁)少始知學，勇於敢為。長通於方，左右具宜。先生之於為人，可謂成矣。<br>　　然而公不見信於人，私不見助於友。跋前躓後，動輒得咎。暫為御史，遂竄南夷。三年博士，冗不見治。命與仇謀，取敗幾時。」<br>（注：○補苴罅漏：比喻彌補事物的缺失。○姚姒：虞舜與夏禹的合稱。）"]]], ["text", "q", "【　(B)　】1.依據上文，韓愈對下列各書的評論，何者敘述最適當？"], ["text", "opt", "(A)周誥、殷盤，文辭清新、自然明暢"], ["text", "opt", "(B)春秋記事論人，用字措辭非常嚴謹"], ["text", "opt", "(C)左傳文辭平實，內容卻充滿想像力"], ["text", "opt", "(D)莊子文采無法媲美史記　太史公筆法"], ["text", "exp", "【解析】(A)由「佶屈聱牙」可知非文辭清新、自然明暢。佶屈聱牙：形容文句艱澀，讀起來不順口。(C)由「左氏浮誇」，可知左傳文辭鋪張誇飾。(D)由「下逮莊　騷，太史所錄；子雲　相如，同工異曲」，可知文采可媲美。"], ["text", "q", "【　(C)　】2.依據上文，下列敘述最適當的是："], ["text", "opt", "(A)韓愈為學方面貪求過多而無法消化理解"], ["text", "opt", "(B)韓愈對無法發揚儒家學說感到心灰意冷"], ["text", "opt", "(C)韓愈文章內容博大精深而外表氣勢奔放"], ["text", "opt", "(D)韓愈在官場上獲得信任並得到貴人相助"], ["text", "exp", "【解析】(A)韓愈求知時，期望能多有所得。(B)排斥佛　老，發揚儒家學說。(C)由「先生之於文，可謂閎其中而肆其外矣」可知。(D)韓愈在官場上不被信任，並無法得到朋友的幫助。"], ["text", "q", "【　(D)　】3.依據上文，畫底線處敘述錯誤的是："], ["text", "opt", "(A)(甲)著作能探取精微，提出重要旨意"], ["text", "opt", "(B)(乙)夜以繼日、孜孜不倦的勤奮學習"], ["text", "opt", "(C)(丙)沉浸書中，品味咀嚼文章的精華"], ["text", "opt", "(D)(丁)年少輕狂意氣用事不知努力向學"], ["text", "exp", "【解析】(D)少年時代就懂得學習，勇敢作為。"], ["text", "trans", "【語譯】　　話還沒說完，有人在隊伍行列中笑著說道：「先生是在欺騙我們吧！學生侍候先生，到現在已經好幾年了。先生口裡不斷吟誦六經的文章，手裡不曾停止過翻閱諸子百家的書籍。記事能提出內容要點，立論能探索深奧旨意。貪多不厭的多方閱讀，力求一定要有收穫，不論大的、小的都不能捨棄。夜以繼日，一年到頭，永遠孜孜不倦的研究。先生對於學業，可以說是夠勤奮了。"], ["text", "para", "抵制排除異端邪說，驅除排斥佛家和道家的學說。補充完善儒學理論上的缺陷與不足，闡發光大其深奧隱微的意義。鑽研那些失傳已久的古代儒家學說，特別廣泛的發掘和繼承它們。指導異端邪說就像攔截洪水一樣，引導它們東注大海，把將被狂瀾壓倒的儒家學說重新挽救回來。先生對於儒家學說，可說是立下功勞。"], ["text", "para", "沉浸在如醇厚美酒般的典籍中，咀嚼品味著其中的精華，寫作起文章來，書卷堆得滿屋子。向上取法於虞、夏的典章，深遠博大的無邊無際；周誥文、殷盤銘，文句艱澀拗口；春秋用字措辭非常嚴謹，左傳文辭鋪張誇飾；易經奇異而有法則，詩經純正而又華美；下及莊子、離騷、太史公的史記，以及揚雄、司馬相如的著述，內容雖然各不相同，高妙精彩卻都是一樣的。先生的文章，可說是造詣精深博大而下筆波瀾壯闊。"], ["text", "para", "先生少年就知道好學，勇敢作為。長大以後，通曉禮義，行為得體。先生為人可以說是有成。"], ["text", "para", "可是在官場上卻不被信任，私交上無法得到朋友的幫助。常常陷入困境，進退兩難，一舉一動都會招來指責。剛當上御史，就被貶逐到邊遠的南方。當了三年的博士，閒閒散散，也沒表現出什麼政績。命運之神與你有敵仇似的，所以你時常遭受挫敗。」"]]}, {"title": "（二）師徒關係與社會創新的在地實踐（節錄）\t朱思年、陳蕙芬、游銘仁、吳靜吉", "page": "P.38", "layout": "split", "blocks": [["text", "para", "賴青松和黃聲遠對於「傳承」概念有不同的看法和想法。在賴青松方面，他認為傳承這件事情是一種「緣分」，　　　　　，因此當徒弟宜蘭小田田進入農村開始實習的傳承緣分出現時，他是欣喜的；相較之下，黃聲遠則因為他對自由的追求，以及對未知的開放，更重要的是他相信要讓每個人的潛力被發揮，而不是照著老師的指導前進，直接表達了他對「傳承」概念的質疑。事實上，傳承除了知識與技能的傳遞，更重要的是師者為徒弟帶來的心靈啟發，以及師徒關係所衍生的職涯發展、心理社會及角色楷模的功能，師徒關係可以藉由各種不同形式傳承下去。然而，無論是賴青松或黃聲遠，他們都會在不同的人生階段與機會，輪流或者同時扮演徒弟（學習者）和師父（教學者）的角色，學習和傳承重要的知識、經驗與智慧。"], ["text", "para", "由賴青松和黃聲遠指導徒弟的過程中，可看出透過「做中學」方式，能夠達到有效傳承的成果，因此未來培育社會創業家之課程，可設計以做中學為主體的課程，注入更多「實作」元素。"], ["text", "q", "【　(D)　】1.上文首段　　　　　內，最適合填入的是："], ["text", "opt", "(A)只可意會，不可言傳　　　　(B)只見樹木，不見森林"], ["text", "opt", "(C)只是空談而無行動力　　　　(D)只能等待卻不能強求"], ["text", "exp", "【解析】賴青松「認為傳承這件事情是一種『緣分』」，而「緣分」意指人與人之間能夠相投契合的定分，因此無法強求只能等待，填入(D)最恰當。(A)只能用心領會體悟，而無法用言語表達。(B)比喻只考慮個別與局部，而沒有顧及整體全面。"], ["text", "q", "【　(D)　】2.依據上文，關於○、○的研判應是："], ["text", "para", "○傳承最重要的是老師在工作中把知識和技能傳授給徒弟。"], ["text", "para", "○師徒關係具有角色楷模的功能，可以不同形式傳接繼承。"], ["text", "opt", "(A)○、○皆正確　　(B)○、○皆錯誤　　(C)○正確，○錯誤　　(D)○錯誤，○正確"], ["text", "exp", "【解析】(D)○由「傳承除了知識與技能的傳遞，更重要的是師者為徒弟帶來的心靈啟發」，可知傳承更重要的是老師帶給徒弟在心靈上的啟發，故研判錯誤。○由「師徒關係所衍生的職涯發展、心理社會及角色楷模的功能，師徒關係可以藉由各種不同形式傳承下去」，可知研判正確。"], ["text", "q", "【　(C)　】3.下列何者最符合上文所述？"], ["text", "opt", "(A)賴青松因出身農村，渴望進入大都會，追求自由，發揮個人的潛力"], ["text", "opt", "(B)黃聲遠肯定「傳承」的意義，認為徒弟應該依循老師的指導而前進"], ["text", "opt", "(C)賴青松與黃聲遠，在其人生階段中同時扮演學習者和教學者的角色"], ["text", "opt", "(D)未來培育社會創業家的課程，老師應更強調學科與專業知能的傳授"], ["text", "exp", "【解析】(A)由「賴青松認為傳承這件事情是一種『緣分』……因此當徒弟宜蘭小田田進入農村開始實習的傳承緣分出現時，他是欣喜的」，可知文中未敘及賴青松渴望進入大都會，追求自由，發揮個人的潛力。(B)由「黃聲遠則因為他對自由的追求，以及對未知的開放，更重要的是他相信要讓每個人的潛力被發揮，而不是照著老師的指導前進，直接表達了他對『傳承』概念的質疑」，可知黃聲遠質疑「傳承」的意義，認為不是依循老師的指導而前進。(D)由文末結語可知未來培育社會創業家的課程，可設計以做中學為主體的課程，注入更多「實作」元素。"], ["text", "para", "【賞析】本文選取兩個在地的成功社會創業家為個案，雖然賴青松、黃聲遠二人對於師徒關係、傳承關係的觀念不盡相同，但都做到兼具良師益友的同儕師徒關係與向下學習的反向師徒關係，將自己領受到的師徒關係特性傳承給徒弟們。從其師徒關係探討傳承的內涵，對現行社會創新實務及創業教育深具啟示。"], ["text", "para", "【　 　】1.「視而不見」、「口惠而實不至」的「而」，相當於「卻」，用來表示其前、後詞語有轉折關係。下列文句中的「而」，何者有相同用法？               【113　統測】"], ["text", "opt", "(A)提刀「而」立，為之四顧"], ["text", "opt", "(B)滿目蕭然，感極「而」悲者矣"], ["text", "opt", "(C)郁離子之市，見壞宅「而」哭之慟"], ["text", "opt", "(D)惑「而」不從師，其為惑也終不解矣"], ["text", "para", "【　 　】2.下列文句的「出」，何者與「無出其右」的「出」意義最接近？\t【110　統測】"], ["text", "opt", "(A)日「出」而林霏開"], ["text", "opt", "(B)長鋏歸來乎！「出」無車"], ["text", "opt", "(C)匣而埋諸土，朞年「出」之"], ["text", "opt", "(D)古之聖人，其「出」人也遠矣"], ["text", "para", "【　 　】3.依據下文，「　　　　　」內應填入的文句為何？\t【109　統測】"], ["text", "para", "響尾蛇視力很差，卻能在黑暗中捕獲十多公尺遠的田鼠，其祕密在於頰窩能偵測到遠處動物的微量紅外線。武器專家從中獲得啟發：若飛彈上有感應紅外線的電子儀器，不就能對飛機進行熱定位，藉以擊中目標？於是發明了響尾蛇飛彈。所以古人說：「　　　　　」，就是期許學習者能主動發現知識類推的創新力量。"], ["text", "opt", "(A)聞道有先後，術業有專攻"], ["text", "opt", "(B)舉一隅不以三隅反，則不復也"], ["text", "opt", "(C)凡有四端於我者，知皆擴而充之矣"], ["text", "opt", "(D)物各從其類也，是故質的張而弓矢至焉"], ["text", "para", "1.【答案】(D)"], ["text", "exp", "【解析】(A)則、就。連接詞，順承之意。(B)(C)因而。連接詞。表示下文是上文的結果。(D)卻。表轉折之意。"], ["text", "trans", "【語譯】(A)這時我提刀挺立，環顧四周。莊子 庖丁解牛。(B)滿眼蕭條淒涼的景象，令人感慨至極而不禁悲從中來。范仲淹 岳陽樓記。(C)郁離子前往街市，看見一幢毀壞的房子便十分悲痛的哭了起來。劉基 郁離子 魯般。"], ["text", "para", "2.【答案】(D)"], ["text", "exp", "【解析】題幹：超越，與(D)意義相近。無出其右：古時以右為尊，故「無出其右」指沒有能勝過的，為推許之詞。出自漢書卷一高帝紀下。(A)出來。(B)出門。(C)取出。"], ["text", "trans", "【語譯】(A)清晨當太陽出來後，林間的雲氣就散開了。歐陽脩 醉翁亭記。(B)長劍回去吧！出門沒車子坐。馮諼客孟嘗君。(C)把琴放入盒子，埋入土中，一年之後取出琴來。劉基 郁離子 工之僑為琴。"], ["text", "para", "3.【答案】(B)"], ["text", "exp", "【解析】由「學習者能主動發現知識類推的創新力量」可知主旨在強調學習者要能觸類旁通，領悟發現及類推能力。因此答案選(B)。(A)說明所聽聞的道理有先有後，技能學業各有專精擅長。(B)指列舉一例而能曉諭其他各事。(C)孟子強調人皆具有惻隱、羞惡、辭讓、是非之心，即是仁、義、禮、智等善性發端，就要努力自我實踐，擴充善性。(D)意謂榮辱的到來為個人所招致。"], ["text", "trans", "【語譯】(B)已經提示一個角，他卻不能類推出其他三個角，就不必再教導他了。論語 述而。(C)凡是了解自己有此四端的人，知道把它們都擴廣充實。孟子 公孫丑上。(D)萬物都是同類相聚的，所以掛起箭靶時箭就射來了。荀子 勸學。"]]}],"charBian": [{"name": "之", "pages": [{"sub": "用法辨析", "body": "<div class=\"rt-def\">「之」在〈師說〉中出現多次，用法可分為<b>助詞</b>與<b>代名詞</b>兩大類。<span class='bk-note'>釋義依教育部《國語辭典簡編本》。</span></div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"3\">用法 ｜ 說明 ｜ 課文例句</th></tr>\n<tr><th class=\"jy-th\">結構助詞<br>「的」</th><td>連接定語與中心語</td>\n<td>1. 古<b>之</b>學者必有師。<br>2. 彼童子<b>之</b>師。<br>3. 士大夫<b>之</b>族。<br>4. 六藝經傳，皆通習<b>之</b>（此為代詞，見下）</td></tr>\n<tr><th class=\"jy-th\">主謂之間<br>取消獨立性</th><td>置於主語與謂語之間，使句子成為詞組，<b>不譯</b></td>\n<td>1. 師道<b>之</b>不傳也久矣。<br>2. 欲人<b>之</b>無惑也難矣。<br>3. 聖人<b>之</b>所以為聖。<br>4. 郯子<b>之</b>徒。</td></tr>\n<tr><th class=\"jy-th\">賓語前置<br>的標誌</th><td>把賓語提到動詞前，「之」為提賓標誌，<b>不譯</b></td>\n<td>1. 句讀<b>之</b>不知，惑<b>之</b>不解。<br><span class='bk-note'>原語序為「不知句讀，不解惑」。</span></td></tr>\n<tr><th class=\"jy-th\">代名詞</th><td>代指人或事物</td>\n<td>1. 吾從而師<b>之</b>（指他）。<br>2. 擇師而教<b>之</b>（指其子）。<br>3. 六藝經傳，皆通習<b>之</b>（指六藝經傳）。<br>4. 作〈師說〉以貽<b>之</b>（指李蟠）。</td></tr>\n<tr><th class=\"jy-th\">動詞</th><td>往、到（本課未出現，補充）</td><td>吾欲<b>之</b>南海。（彭端淑〈為學一首示子姪〉）</td></tr>\n</table>"}]}, {"name": "師", "pages": [{"sub": "詞性與詞義辨析", "body": "<div class=\"rt-def\">「師」是本課文眼，全文出現二十餘次，詞性與意義各有不同。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"3\">詞性 ｜ 意義 ｜ 課文例句</th></tr>\n<tr><th class=\"jy-th\">名詞</th><td><b>老師</b></td>\n<td>1. 古之學者必有<b>師</b>。<br>2. <b>師</b>者，所以傳道、受業、解惑也。<br>3. 惑而不從<b>師</b>。<br>4. 道之所存，<b>師</b>之所存也。<br>5. 從<b>師</b>而問焉。<br>6. 恥學於<b>師</b>。<br>7. 擇<b>師</b>而教之。<br>8. 彼童子之<b>師</b>。<br>9. 曰<b>師</b>、曰弟子云者。<br>10. 聖人無常<b>師</b>。<br>11. 三人行，則必有我<b>師</b>。<br>12. 弟子不必不如<b>師</b>，<b>師</b>不必賢於弟子。</td></tr>\n<tr><th class=\"jy-th\">名詞</th><td><b>具有專門技藝的人</b></td><td>1. 樂<b>師</b>。　2. <b>師</b>襄。</td></tr>\n<tr><th class=\"jy-th\">名詞</th><td><b>從師問學的風尚</b></td><td>1. <b>師</b>道之不傳也久矣。　2. <b>師</b>道之不復可知矣。</td></tr>\n<tr><th class=\"jy-th\">動詞</th><td><b>學習</b></td><td>1. 吾<b>師</b>道也。　2. 不恥相<b>師</b>。</td></tr>\n<tr><th class=\"jy-th\">動詞<br>（意動）</th><td><b>以……為師</b></td><td>1. 吾從而<b>師</b>之。　2. 孔子<b>師</b>郯子、萇弘、師襄、老聃。</td></tr>\n<tr><th class=\"jy-th\">動詞</th><td><b>以……為恥（恥師）</b></td><td>於其身也，則恥<b>師</b>焉。</td></tr>\n</table>"}]}, {"name": "者", "pages": [{"sub": "用法辨析", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">用法 ｜ 例句</th></tr><tr><th class=\"jy-th\">代名詞，的人</th><td>學者、記者、作者。</td></tr><tr><th class=\"jy-th\">助詞，用於句中表停頓</th><td>1. 師<b>者</b>，所以傳道、受業、解惑也。<br>2. 法<b>者</b>，天子所與天下公共也。（司馬遷〈張釋之執法〉）</td></tr><tr><th class=\"jy-th\">助詞，用於句末表語氣結束</th><td>蓮，花之君子<b>者</b>也。（周敦頤〈愛蓮說〉）</td></tr></table>"}]}, {"name": "所以", "pages": [{"sub": "三種用法", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">用法 ｜ 例句</th></tr><tr><th class=\"jy-th\">用來</th><td>1. 師者，<b>所以</b>傳道、受業、解惑也。<br>2. 不患無位，患<b>所以</b>立。（《論語‧里仁》）</td></tr><tr><th class=\"jy-th\">為何，表原因</th><td>1. 聖人之<b>所以</b>為聖，愚人之<b>所以</b>為愚，其皆出於此乎？<br>2. 親賢臣，遠小人，此先漢<b>所以</b>興隆也。（諸葛亮〈出師表〉）</td></tr><tr><th class=\"jy-th\">因此、因而<br>（常與「因為」連用）</th><td>視其<b>所以</b>，觀其所由，察其所安，人焉廋哉？（《論語‧為政》）</td></tr></table>"}]}, {"name": "於", "pages": [{"sub": "用法辨析", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">用法 ｜ 例句</th></tr><tr><th class=\"jy-th\">向，表趨向</th><td>1. 恥學<b>於</b>師。　2. 請學<b>於</b>余。</td></tr><tr><th class=\"jy-th\">從、由，表所從</th><td>愚人之所以為愚，其皆出<b>於</b>此乎？</td></tr><tr><th class=\"jy-th\">對於，表動作對象</th><td><b>於</b>其身也，則恥師焉。</td></tr><tr><th class=\"jy-th\">比，引進比較對象</th><td>師不必賢<b>於</b>弟子。</td></tr><tr><th class=\"jy-th\">被，表被動</th><td>不拘<b>於</b>時。</td></tr></table>"}]}, {"name": "其", "pages": [{"sub": "用法辨析", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">用法 ｜ 例句</th></tr><tr><th class=\"jy-th\">那些</th><td><b>其</b>為惑也，終不解矣。</td></tr><tr><th class=\"jy-th\">大概，表推測語氣</th><td>愚人之所以為愚，<b>其</b>皆出於此乎？</td></tr><tr><th class=\"jy-th\">他</th><td>余嘉<b>其</b>能行古道。</td></tr></table>"}]}, {"name": "不齒／不恥", "pages": [{"sub": "義辨", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">詞語 ｜ 例句</th></tr><tr><th class=\"jy-th\"><b>不齒</b>：不屑與之為伍</th><td>君子<b>不齒</b>。</td></tr><tr><th class=\"jy-th\"><b>不恥</b>：不以……為恥</th><td><b>不恥</b>相師。</td></tr></table><span class='bk-note'>兩者意思相反，是統測高頻考點。齒，並列；恥，以為恥。</span>"}]}, {"name": "貽（形音義辨）", "pages": [{"sub": "ㄧˊ 音同形近字", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">字 ｜ 音義 ｜ 例</th></tr><tr><th class=\"jy-th\"><b>貽</b>　ㄧˊ　贈送／遺留</th><td>作〈師說〉以<b>貽</b>之。／<b>貽</b>笑大方。</td></tr><tr><th class=\"jy-th\"><b>怡</b>　ㄧˊ　和悅、愉快</th><td><b>怡</b>然自得、心曠神<b>怡</b>。</td></tr><tr><th class=\"jy-th\"><b>飴</b>　ㄧˊ　米麥製成的糖漿或軟糖</th><td>甘之如<b>飴</b>、含<b>飴</b>弄孫。</td></tr></table>"}]}, {"name": "學者（古今義）", "pages": [{"sub": "古今異義", "body": "<table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"9\">意義 ｜ 例句</th></tr><tr><th class=\"jy-th\"><b>古義</b>：學習的人</th><td>古之<b>學者</b>必有師。</td></tr><tr><th class=\"jy-th\"><b>今義</b>：學問淵博而有所成就的人</th><td>生物<b>學者</b>。</td></tr></table>"}]}],textPages: [{"seg": "第一段", "title": "第一段", "book": "課本 P.44", "sub": "說明從師解惑的重要性（開門見山法）", "lines": [{"text": "古{g:之|的}{n:1|學者}必有{g:師|（名）老師}。", "cite": "古", "mean": "意謂唐代當時無此風氣", "cite2": "必", "mean2": "表示不可移易的真理", "rcite": ["古之學者必有師"], "rhet": [["開門見山法（破題法）", "<span class=\"tp-rq\">古之學者必有師</span>──首句即點出主旨。"], ["頂真", "<span class=\"tp-rq\">古之學者必有<b class='rq-hi'>師</b>。<b class='rq-hi'>師</b>者</span>──使結構緊湊，並加強節奏。"]], "tr": "古代求學的人一定有老師。"}, {"text": "{g:師|（名）老師}{g:者|表語氣停頓，無義}，{n:2|所以}{p:傳道|指修己治人之道。韓愈〈原道〉中所言之「道」，為堯、舜、禹、湯、文、武、周公、孔子、孟子相承之仁義道統，即為儒道。}、{z:受|ㄕㄡˋ，通「授」}業、解惑也。", "mean": "點出老師的職責與作用。", "tr": "老師，是用來傳授道理、講授學業、解除疑惑的人。"}, {"text": "人非生而知{n:3|之}{g:者|表語氣停頓，無義}，{n:4|孰}能無惑？", "cite": "孰能無惑？", "mean": "明知故問，強調人人皆有惑，故須從師。", "rcite": ["孰能無惑？"], "rhet": [["設問（激問）", "<span class=\"tp-rq\">孰能無惑？</span>──答案在問題的反面：人皆有惑。"]], "tr": "人不是一生下來就懂得道理的，誰能沒有疑惑？"}, {"text": "惑{g:而|卻}不從{g:師|（名）老師}，{n:5|{g:其|代名詞，指「那些」}{g:為|（動）成為}惑也}，終不解矣！", "cite": "惑而不從師", "mean": "疑惑終究無法解除，收束首段。", "tr": "有了疑惑卻不跟隨老師學習，那些疑惑終究不能解除。", "rhet": [["頂真", "<span class=\"tp-rq\">孰能無<b class='rq-hi'>惑</b>？<b class='rq-hi'>惑</b>而不從師</span>──使結構緊湊，並加強節奏。"]]}], "notes": [["學者", "指學習的人。"], ["師者所以傳道受業解惑也", "老師是用來傳授道理、講授學業、解除疑惑的人。所以，用來。道，指修己治人之道。受，通「授」。業，學業，泛指古文、經籍。解惑，解除道與業上的疑惑。"], ["之", "代詞，指上文的「道」與「業」。<span class='bk-note'>補充　語出《論語‧述而》：「子曰：『吾非生而知之者，好古，敏以求之者也。』」</span>"], ["孰", "誰。"], ["其為惑也", "那些疑惑的問題。"]], "pian": "強調「學必有師」的重要。", "xi": "開門見山法點出主旨「必有師」，「必」字加強從師問學的必要性。全文以「師」字為文眼，自此開展並貫串全文。", "fan": "古代求學的人一定有老師。老師，是用來傳授道理、講授學業、解除疑惑的人。人不是一生下來就懂得道理的，誰能沒有疑惑？有了疑惑卻不跟隨老師學習，那些疑惑終究不能解除。", "qa": [["人為什麼一定需要老師？", "因為「人非生而知之者，孰能無惑」——人不是生下來就懂得道理，必然有疑惑；有惑而不從師，疑惑終究無法解除，所以必須從師問學。"]], "noteStart": 1}, {"seg": "第二段", "title": "第二段", "book": "課本 P.44~P.45", "sub": "提出擇師的標準在「道」", "lines": [{"text": "{p:生{n:6|乎}吾前|即年紀比我大}，{g:其|他}{n:7|聞道}也，{n:8|固}先乎吾，吾從而{n:9|師}之；{p:生乎吾後|即年紀比我小}，其{g:聞|聽聞，引申為理解、明瞭}道也，{g:亦|也}先乎吾，吾從而師之。", "mean": "就<b>年紀長少</b>作對照，以「<b>聞道</b>」做為擇師原則。", "rcite": ["吾從而師之"], "rhet": [["頂真", "<span class=\"tp-rq\">固先乎<b class='rq-hi'>吾</b>，<b class='rq-hi'>吾</b>從而師之</span>──使結構緊湊，並加強節奏。"], ["轉品", "<span class=\"tp-rq\">吾從而<b class='rq-hi'>師</b>之</span>──(名)老師→(動)以……為師。"]], "tr": "出生在我之前的人，他懂得道理本來就比我早，我跟隨他而向他學習；出生在我之後的人，他懂得道理如果也比我早，我也跟隨他而向他學習。", "cite": "生乎吾前，其聞道也，固先乎吾，吾從而師之；生乎吾後，其聞道也，亦先乎吾，吾從而師之"}, {"text": "吾{n:10|師}{g:道|道理}也，{g:夫|音ㄈㄨˊ，發語詞，無義}{n:11|庸知其年之先後生於吾乎}？", "cite": "夫庸知其年之先後生於吾乎？", "mean": "強調從師不必計較年齡。", "rcite": ["夫庸知其年之先後生於吾乎？"], "rhet": [["設問（激問）", "<span class=\"tp-rq\">夫庸知其年之先後生於吾乎？</span>──答案在反面：不必計較年齡。"], ["轉品", "<span class=\"tp-rq\">吾<b class='rq-hi'>師</b>道也</span>──(名)老師→(動)學習。"]], "tr": "我學習的是道理，何必計較他的年齡比我大還是比我小呢？"}, {"text": "是故{g:無|無論}{g:貴|高貴}無{g:賤|低賤}、無{g:長|年長}無{g:少|年少}，道之所存，師之所存也。", "cite": "無貴無賤、無長無少，道之所存，師之所存也", "mean": "強調應以「<b>道</b>」為擇師前提。", "rcite": ["無貴無賤、無長無少"], "rhet": [["類疊", "<span class=\"tp-rq\">是故<b class='rq-hi'>無</b>貴<b class='rq-hi'>無</b>賤、<b class='rq-hi'>無</b>長<b class='rq-hi'>無</b>少</span>──加強語氣。"]], "tr": "因此無論地位高低、年紀大小，道理存在的地方，就是老師存在的地方。"}], "notes": [["乎", "介詞，於、在。"], ["聞道", "懂得道理。"], ["固", "本來。"], ["吾從而師之", "我跟隨他，向他學習。師，此作動詞，學習。"], ["師道", "學習道理。師，此作動詞。"], ["夫庸知其年之先後生於吾乎", "何必知道他們出生比我早還是晚呢？夫，發語詞，無義。庸，表反問語氣，豈、何必。"], ["無貴無賤無長無少", "無論地位高低，不管年紀大小。"]], "pian": "提出擇師的標準在「道」，從師的對象則無貴、賤、長、少之分。", "xi": "從正面立論，不以身分之貴、賤，年齡之長、少為擇師的依據，而以「聞道」與否為擇師的依據。", "fan": "出生在我之前的人，他懂得道理本來就比我早，我跟隨他而向他學習；出生在我之後的人，他懂得道理如果也比我早，我也跟隨他而向他學習。我學習的是道理，何必計較他的年齡比我大還是比我小呢？因此無論地位高低、年紀大小，道理存在的地方，就是老師存在的地方。", "qa": [["試從生活周遭舉例說明「道之所存，師之所存」。", "（開放作答）例如：向資深技術員請教專業技能、向學弟妹學習新軟體操作——只要對方在某方面「聞道」在先，就值得我們拜師學習，不必計較其年齡或地位。"]], "noteStart": 6}, {"seg": "第三段", "title": "第三段", "book": "課本 P.45", "sub": "古之聖人與今之眾人的對比", "lines": [{"text": "{z:嗟|ㄐㄧㄝ}乎！{n:13|師道}{g:之|的}不傳{g:也|表語氣停頓，無義}久矣！欲人{g:之|的}無惑{g:也|表語氣停頓，無義}難矣！", "cite": "嗟乎！師道之不傳也久矣", "mean": "感慨當代人<b>恥學於師</b>。", "rcite": ["師道之不傳也久矣", "嗟乎"], "rhet": [["轉品", "<span class=\"tp-rq\"><b class='rq-hi'>師</b>道之不傳也久矣</span>──(名)老師→(形)從師問學的。"], ["感嘆", "<span class=\"tp-rq\">嗟乎</span>──「嗟乎」「久矣」「難矣」連用，語氣沉痛。"]], "tr": "唉！從師問學的風尚不流傳已經很久了，想要人們沒有疑惑很難啊！"}, {"text": "古{g:之|的}聖人，{g:其|代名詞，指古之聖人}{n:14|出人}{g:也|表語氣停頓，無義}遠矣，猶且從{g:師|（名）老師}而問{g:焉|有二說：1.代詞，指老師；2.助詞，無義。下文「或師焉」「或不焉」同}；今之眾人，其{n:15|下}聖人也亦遠矣，而{n:16|恥學於師}。", "mean": "以聖人與今人比較，作<b>一正一反</b>說理。另以從師態度迥異來區分聖人與眾人。", "rcite": ["古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師"], "rhet": [["映襯", "<span class=\"tp-rq\"><b class='rq-hi'>古之聖人</b>，其出人也遠矣，猶且<b class='rq-hi'>從師而問</b>焉；<b class='rq-hi'>今之眾人</b>，其下聖人也亦遠矣，而<b class='rq-hi'>恥學於師</b></span>──古今、聖愚兩相對照，襯托恥師之不智。"]], "tr": "古代的聖人，他們超出一般人很遠了，尚且跟隨老師請教；現在的一般人，他們不如聖人也很遠了，卻以向老師學習為恥。", "cite": "古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師"}, {"text": "是故{g:聖|（名）聖人}{n:17|益}{g:聖|（形）聖明}，{g:愚|（名）愚人}益{g:愚|（形）愚笨}。", "cite": "聖益聖，愚益愚", "mean": "將「聖益聖，愚益愚」歸於恥於從師之故——這是恥於從師問學造成的結果。", "rcite": ["聖益聖，愚益愚"], "rhet": [["映襯", "<span class=\"tp-rq\">聖益聖，愚益愚</span>──聖人愚人之別在於是否從師。"], ["類疊", "<span class=\"tp-rq\">聖<b class='rq-hi'>益</b>聖，愚<b class='rq-hi'>益</b>愚</span>──加強語氣。"]], "tr": "因此聖人更加聖明，愚人更加愚昧。"}, {"text": "{g:聖|（形）聖明}人之{n:18|所以}{g:為|（動）成為}{g:聖|（名）聖人}，{g:愚|（形）愚笨}人之所以{g:為|（動）成為}{g:愚|（名）愚人}，{p:其|推測語氣}皆出{g:於|介詞，從、由}此乎？", "mean": "以推測語氣作結，實為肯定。「<b>此</b>」指聖人從師而問焉，愚人則恥學於師。", "rcite": ["其皆出於此乎？"], "rhet": [["類疊", "<span class=\"tp-rq\">聖人<b class='rq-hi'>之所以</b>為聖，愚人<b class='rq-hi'>之所以</b>為愚</span>──加強語氣。"]], "tr": "聖人之所以成為聖人，愚人之所以成為愚人，大概都是出於這個原因吧？", "cite": "聖人之所以為聖，愚人之所以為愚"}], "notes": [["師道", "此指從師問學的傳統。師，此作形容詞。"], ["出人", "超出一般人。"], ["下", "不如、不及。"], ["恥學於師", "以從師問學為恥。恥，「以……為恥」。全文「恥」字皆作動詞。"], ["益", "更加。"], ["所以", "何以、為何。表「……的原因」。"], ["其", "大概，表推測語氣。"]], "pian": "以「古之聖人」與「今之眾人」、「聖」與「愚」的對比，說明從師的重要。", "xi": "從反面論述，以「古」「今」、「聖人」「眾人」、「聖」「愚」間的強烈差距，強調從師問學的必要。", "fan": "唉！從師問學的風尚不流傳已經很久了，想要人們沒有疑惑很難啊！古代的聖人，他們超出一般人很遠了，尚且跟隨老師請教；現在的一般人，他們不如聖人也很遠了，卻以向老師學習為恥。因此聖人更加聖明，愚人更加愚昧。聖人之所以成為聖人，愚人之所以成為愚人，大概都是出於這個原因吧？", "qa": [["試從生活中舉例說明「聖益聖，愚益愚」的意義。", "（開放作答）願意持續學習請教的人，能力愈來愈精進；自以為是、不肯求教的人，則愈來愈落後。差距不在天賦，而在是否肯從師問學。"]], "noteStart": 13}, {"seg": "第四段", "title": "第四段", "book": "課本 P.46", "sub": "士大夫為子擇師卻自身恥師", "lines": [{"text": "愛{g:其|代名詞，指士大夫自己}子，擇{g:師|（名）老師}而教{g:之|他，指士大夫之子}，{g:於|介詞，對於}其身也，則{p:恥|「恥」：意動用法，以……為恥。}師焉，{n:20|惑矣}！", "mean": "感嘆士大夫己身行為的矛盾。", "rcite": ["愛其子，擇師而教之，於其身也，則恥師焉"], "rhet": [["映襯", "<span class=\"tp-rq\">愛其子，<b class='rq-hi'>擇師而教之</b>，於其身也，則<b class='rq-hi'>恥師</b>焉</span>──為子擇師↔己身恥師。"], ["轉品", "<span class=\"tp-rq\">於其身也則恥<b class='rq-hi'>師</b>焉</span>──(名)老師→(動)從師學習。"]], "tr": "愛自己的孩子，就選擇老師來教他；對於自己，卻以從師學習為恥，真是糊塗啊！", "cite": "愛其子，擇師而教之，於其身也則恥師焉"}, {"text": "彼{g:童子|兒童}{g:之|的}師，授之{g:書|寫字}而習其{n:21|句讀}者也，非吾所謂傳其道、解其惑者也。", "mean": "呼應首段對<b>老師職責</b>的定義。", "tr": "那些兒童的老師，是教他讀書、學習斷句的，不是我所說的傳授道理、解除疑惑的老師。", "cite": "非吾所謂傳其道、解其惑者也"}, {"text": "{n:22|句讀之不知，惑之不解，或師焉，或{z:不|ㄈㄡˇ，通「否」}焉}，{n:23|小學而大遺}，吾未見其{g:明|明智}也。", "cite": "小學而大遺", "mean": "小的方面要學習，大的方面卻遺漏，指陳當代士大夫恥學於師的荒謬。", "rcite": ["句讀之不知，惑之不解，或師焉，或不焉", "小學而大遺"], "rhet": [["倒裝（賓語前置）", "<span class=\"tp-rq\">句讀之不知，惑之不解</span>──即「不知句讀」「不解惑」。"], ["錯綜（交蹉語次）", "<span class=\"tp-rq\">句讀之不知，惑之不解，或師焉，或不焉</span>──原句應為「句讀之不知，或師焉；惑之不解，或不焉」，語序交錯成 1‧3‧2‧4。<a class=\"rhet-link\" onclick=\"gotoRhet('錯綜')\">▸ 錯綜修辭</a>"], ["轉品", "<span class=\"tp-rq\">或<b class='rq-hi'>師</b>焉</span>──(名)老師→(動)從師學習。"], ["映襯", "<span class=\"tp-rq\">小學而大遺</span>──「小學」↔「大遺」。"]], "tr": "不懂得斷句，要向老師學習；有疑惑不能解決，卻不向老師請教。小的方面要學習，大的方面卻遺漏了，我看不出他的明智之處。"}], "notes": [["惑矣", "令人感到困惑不解啊！"], ["句讀", "文章的斷句。文中語意完足而可停頓的地方叫做句；語意未完足，誦讀時須略作停頓的地方叫做讀。讀，通「逗」。<span class='zy-note'>【注音】讀，音<b>ㄉㄡˋ</b>。</span>"], ["「句讀之不知」四句", "即「句讀之不知，或師焉；惑之不解，或不焉。」不知如何句讀時，有些人會向老師請教學習；有疑惑不了解時，有些人卻不向老師請教學習。或，有些人。不，通「否」。<span class='zy-note'>【注音】不，音<b>ㄈㄡˇ</b>。</span>"], ["小學而大遺", "學到小知識，卻遺漏大學問。小，指句讀之學。大，指對道與業的疑惑。<span class='bk-note'>義近　本末倒置、捨本逐末、買櫝還珠、買履信度。</span>"]], "pian": "以「士大夫為子擇師」與「士大夫本身恥師」的對比，指出士大夫恥學於師的矛盾。", "xi": "從反面立論，由為子擇師與己不從師，指陳當代士大夫恥學於師的荒謬。", "fan": "愛自己的孩子，就選擇老師來教他；對於自己，卻以從師學習為恥，真是糊塗啊！那些兒童的老師，是教他讀書、學習斷句的，不是我所說的傳授道理、解除疑惑的老師。不懂得斷句，要向老師學習；有疑惑不能解決，卻不向老師請教。小的方面要學習，大的方面卻遺漏了，我看不出他的明智之處。", "qa": [["「句讀之不知，惑之不解，或師焉，或不焉」，為何要作「錯綜」解？", "因為原本整齊的語序應為「句讀之不知，或師焉；惑之不解，或不焉」，作者刻意將語序交錯成「1‧3‧2‧4」的排列，這正是錯綜修辭中的「交蹉語次」。"]], "noteStart": 20}, {"seg": "第五段", "title": "第五段", "book": "課本 P.46~P.47", "sub": "巫醫百工與士大夫之族的對比", "lines": [{"text": "{n:24|巫、醫}、{n:25|樂師}、{n:26|百工}之人，{n:27|不恥相師}。", "rhet": [["映襯", "<span class=\"tp-rq\"><b class='rq-hi'>巫、醫、樂師、百工之人，不恥相師</b>；<b class='rq-hi'>士大夫之族</b>，曰師、曰弟子云者，<b class='rq-hi'>則群聚而笑之</b></span>──賤者不恥↔貴者訕笑。"]], "tr": "巫師、醫生、樂師和各種工匠，不以互相學習為恥。"}, {"text": "士大夫{g:之|的}{n:28|族}，曰師、曰弟子{n:29|云者}，則群聚而笑之。", "mean": "以士大夫的訕笑，凸顯當代恥師風氣之盛。", "rcite": ["巫、醫、樂師、百工之人，不恥相師", "士大夫之族，曰師、曰弟子云者，則群聚而笑之"], "rhet": [["映襯", "<span class=\"tp-rq\"><b class='rq-hi'>巫、醫、樂師、百工之人，不恥相師</b>；<b class='rq-hi'>士大夫之族</b>，曰師、曰弟子云者，<b class='rq-hi'>則群聚而笑之</b></span>──賤者不恥↔貴者訕笑。"], ["轉品", "<span class=\"tp-rq\">不恥相<b class='rq-hi'>師</b></span>──(名)老師→(動)學習。"]], "tr": "士大夫這類人，聽到有人稱「老師」稱「弟子」，就聚在一起譏笑他。", "cite": "巫、醫、樂師、百工之人，不恥相師。士大夫之族，曰師、曰弟子云者，則群聚而笑之"}, {"text": "問之，則曰：「彼與彼年相若也，道相似也。」{n:30|位卑則足羞，官盛則近諛}。", "cite": "位卑則足羞，官盛則近諛", "mean": "點出士大夫<b>病態的自尊和虛榮</b>。為第二段「無貴無賤、無長無少，道之所存，師之所存也」的<b>反例</b>。", "tr": "問他們原因，就說：「他和他年紀差不多，學問也差不多。」稱地位低的人為師就感到羞恥，稱官職高的人為師就近於諂媚。", "rhet": [["對仗（單句對）", "<span class=\"tp-rq\">位卑則足羞，官盛則近諛</span>──字數相等、詞性相對、句法相似，為單句對。"]]}, {"text": "嗚呼！師道之不{g:復|恢復、復興}可知矣！巫、醫、樂師、百工之人，君子{n:31|不齒}，今{g:其|代名詞，指士大夫}智{g:乃|竟然}反不能及，{g:其|代名詞，指「今其智乃反不能及」的現象}可怪也{z:歟|ㄩˊ，感嘆語氣詞}！", "cite": "今其智乃反不能及", "mean": "藉「貴」如士大夫、「賤」如巫醫百工的橫向比較，諷刺慨嘆士大夫不以「聞道」與否為擇師前提。", "rcite": ["君子不齒", "今其智乃反不能及", "嗚呼"], "rhet": [["轉品", "<span class=\"tp-rq\"><b class='rq-hi'>師</b>道之不復可知矣</span>──(名)老師→(形)從師問學的。"], ["轉品", "<span class=\"tp-rq\">君子不<b class='rq-hi'>齒</b></span>──(名)牙齒→(動)並列。"], ["感嘆", "<span class=\"tp-rq\">嗚呼</span>──「嗚呼」「其可怪也歟」慨嘆師道不復。"]], "tr": "唉！從師問學的風尚不能恢復，由此可知了。巫師、醫生、樂師和各種工匠，是君子所不屑一提的，如今君子的見識竟反而比不上他們，這真是奇怪啊！"}], "notes": [["巫醫", "巫師和醫生。<span class='bk-note'>補充　「巫、醫」有兩解：(1)「巫醫」為一個複音詞，古代巫醫不分（《論語‧子路》）。(2)「巫、醫」為巫師和醫師兩個單音詞。春秋以後二者已有分野（《史記‧扁鵲倉公列傳》：「信巫不信醫」），唐代分野更明顯。<b>本版採第二解。</b></span>"], ["樂師", "以演奏音樂為業的人。師，指有專門技藝的人。"], ["百工", "從事各種技藝的人。百，虛數，表示多。<span class='bk-note'>補充　義同「一日之所需，百工斯為備」之「百工」。百，虛數，表示多。</span>"], ["不恥相師", "不以互相學習為恥。"], ["族", "類。"], ["云者", "語末助詞，有「如此、等等」之意。"], ["位卑則足羞官盛則近諛", "向地位低的人學習就感到非常羞恥，向官職高的人學習就覺得近於諂媚。足，很。諛，奉承討好。<span class='zy-note'>【注音】諛，音<b>ㄩˊ</b>。</span>"], ["不齒", "不屑與之並列。齒，此作動詞，並列。"]], "pian": "以「巫、醫、樂師、百工之人」與「士大夫之族」對比，質疑士大夫恥學於師的錯誤心態。", "xi": "從反面立論，藉當代「貴」如士大夫之族，「賤」如巫、醫、樂師、百工，進行橫向比較，諷刺慨嘆士大夫不以「聞道」與否為擇師前提，卻荒謬的只介意年齡與地位。", "fan": "巫師、醫生、樂師和各種工匠，不以互相學習為恥；士大夫這類人，聽到有人稱「老師」稱「弟子」，就聚在一起譏笑他。問他們原因，就說：「他和他年紀差不多，學問也差不多。」稱地位低的人為師就感到羞恥，稱官職高的人為師就近於諂媚。唉！從師問學的風尚不能恢復，由此可知了。巫師、醫生、樂師和各種工匠，是君子所不屑一提的，如今君子的見識竟反而比不上他們，這真是奇怪啊！", "qa": [["第二、三、五段皆出現「師道」兩字，其詞性及意義是否相同？", "<b>不相同。</b><br>第二段「吾師道也」的「師」是<b>動詞</b>（學習），「道」是名詞（道理）。<br>第三段「師道之不傳也久矣」、第五段「師道之不復可知矣」的「師道」是<b>名詞</b>（從師問學的風尚）。"], ["第五段出現「不恥」與「不齒」兩個詞彙，意義是否相同？", "<b>不相同。</b><br>「不恥」是<b>不以……為恥</b>（意動用法），如「不恥相師」。<br>「不齒」是<b>不屑與之同列</b>（齒，並列），如「君子不齒」。<br>兩者意思相反，不可混用。"]], "noteStart": 24}, {"seg": "第六段", "title": "第六段", "book": "課本 P.48~P.49", "sub": "以孔子為例說明從師之道", "lines": [{"text": "聖人無{n:32|常師}：孔子{n:33|師郯子}、{z:萇|ㄔㄤˊ}{n:34|弘}、{n:35|師襄}、{n:36|老{z:聃|ㄉㄢ}}。", "mean": "以孔子求師問學之例，證明「聖人無常師」。", "tr": "聖人沒有固定的老師。孔子曾以郯子、萇弘、師襄、老聃為師。", "rhet": [["轉品", "<span class=\"tp-rq\">孔子<b class='rq-hi'>師</b>郯子</span>──(名)老師→(動)以……為師。"]]}, {"text": "郯子{g:之|主謂之間，不譯}{n:37|徒}，其{g:賢|才能}不及孔子。", "tr": "郯子這類人，他們的賢能都比不上孔子。"}, {"text": "孔子曰：「{n:38|三人行，則必有我師}。」", "rcite": ["三人行，則必有我師"], "rhet": [["引用（明引）", "<span class=\"tp-rq\">孔子曰：「三人行，則必有我師。」</span>──明白指出所引之言出自何人。"]], "tr": "孔子說：「三人同行，其中一定有我可以效法的老師。」"}, {"text": "是故弟子不必不如師，師{n:39|不必賢{g:於|介詞，比}弟子}。聞道有先後，{n:40|術業有專攻}，如是而已。", "cite": "聞道有先後，術業有專攻", "mean": "此二句正是世人須從師問學的<b>關鍵</b>，也是<b>全文精神所在</b>。", "rcite": ["弟子不必不如師，師不必賢於弟子"], "rhet": [["回文", "<span class=\"tp-rq\">弟子不必不如師，師不必賢於弟子</span>──前後迴環相對。"], ["頂真", "<span class=\"tp-rq\">弟子不必不如<b class='rq-hi'>師</b>，<b class='rq-hi'>師</b>不必賢於弟子</span>──使結構緊湊，並加強節奏。"]], "tr": "所以弟子不一定不如老師，老師不一定比弟子高明。懂得道理有先有後，學問技藝各有專精的研究，如此罷了。"}], "notes": [["常師", "固定的老師。<span class='bk-note'>補充　語出《論語‧子張》：「子貢曰：『夫子焉不學？而亦何常師之有？』」</span>"], ["孔子師郯子", "孔子向郯子學習。郯子，春秋時郯國（今山東省 郯城縣）國君，孔子曾向他請教用鳥名為官職命名的事。郯子之「子」為子爵。<span class='zy-note'>【注音】郯，音<b>ㄊㄢˊ</b>。</span>"], ["萇弘", "東周時大夫，孔子曾向他請教古樂。<span class='zy-note'>【注音】萇，音<b>ㄔㄤˊ</b>。</span>"], ["師襄", "春秋時魯國著名的樂師襄，孔子曾向他學琴。<span class='zy-note'>【注音】襄，音<b>ㄒㄧㄤ</b>。</span><span class='bk-note'>補充　又稱<b>師襄子</b>。</span>"], ["老聃", "即老子，姓李名耳，字聃，春秋時楚國人，孔子曾向他請教禮儀。<span class='zy-note'>【注音】聃，音<b>ㄉㄢ</b>。</span><span class='bk-note'>補充　《史記‧老子韓非列傳》：「老子者，楚 苦縣 厲鄉 曲仁里人也，姓李氏，名耳，字聃，周守藏室之史（掌管藏書室的史官）也。孔子適（前往）周，將問禮於老子。」</span>"], ["徒", "類、輩。"], ["三人行則必有我師", "三人同行，一定有我可以效法或引以為戒的人。語出《論語‧述而》：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」"], ["不必賢於弟子", "不一定比弟子高明。"], ["術業有專攻", "技能和學業各有專門的研究。攻，研究。"]], "pian": "以聖人孔子為例，說明從師的重要、擇師的標準。", "xi": "從正面立論，以孔子求師問學之例，點出全文的重點：「聞道有先後，術業有專攻。」", "fan": "聖人沒有固定的老師。孔子曾以郯子、萇弘、師襄、老聃為師。郯子這類人，他們的賢能都比不上孔子。孔子說：「三人同行，其中一定有我可以效法的老師。」所以弟子不一定不如老師，老師不一定比弟子高明。懂得道理有先有後，學問技藝各有專精的研究，如此罷了。", "qa": [["「弟子不必不如師，師不必賢於弟子」為回文修辭，試舉其他例子說明。", "· 開車不喝酒，喝酒不開車。<br>· 讀書不忘救國，救國不忘讀書。<br>· 文章是案頭之山水，山水是地上之文章。<br><br><b>蘇軾〈題金山寺迴文本〉：</b><br>潮隨暗浪雪山傾，遠浦漁舟釣月明。<br>橋對寺門松徑小，檻當泉眼石波清。<br>迢迢綠樹江天曉，靄靄紅霞晚日晴。<br>遙望四邊雲接水，雪峰千點數鷗輕。"]], "noteStart": 32}, {"seg": "第七段", "title": "第七段", "book": "課本 P.49", "sub": "說明寫作緣由", "lines": [{"text": "{n:41|李氏子蟠}，年十七，{g:好|喜好}{n:42|古文}，{n:43|六藝經{z:傳|ㄓㄨㄢˋ}}，皆{n:44|通習}{g:之|代名詞，指六藝經傳}。", "tr": "李家的孩子李蟠，年紀十七歲，喜好古文，六經的經文和傳文，都普遍地學習過。"}, {"text": "{n:45|不拘{g:於|表被動}{g:時|時俗}}，請學{g:於|介詞，向}余，余{g:嘉|嘉許}其能行{n:46|古道}，{g:作|寫作}〈師說〉以{n:47|貽}{g:之|代名詞，指李蟠}。", "cite": "不拘於時，請學於余", "mean": "以李蟠好學從師，<b>反襯唐人恥學於師</b>的風氣。本篇以「古之學者必有師」開頭，以「能行古道」之李蟠作結，首尾呼應。", "rcite": ["請學於余，余嘉其能行古道", "不拘於時"], "rhet": [["頂真", "<span class=\"tp-rq\">請學於<b class='rq-hi'>余</b>，<b class='rq-hi'>余</b>嘉其能行古道</span>──使結構緊湊，並加強節奏。"], ["映襯", "<span class=\"tp-rq\">不拘於時</span>──李蟠「不拘於時」↔ 今之眾人「拘於時」。"]], "tr": "他不受時俗的拘束，向我請教學習。我讚許他能實行古人從師問學之道，就寫了這篇〈師說〉贈送給他。"}], "notes": [["李氏子蟠", "李蟠，唐德宗貞元十九年（西元八〇三年）進士。<span class='zy-note'>【注音】蟠，音<b>ㄆㄢˊ</b>。</span>"], ["古文", "指先秦、兩漢時代的散文。<span class='bk-note'>補充　唐代稱魏晉以後盛行的駢文為「時文」，因此稱先秦、兩漢的散文為「古文」。</span>"], ["六藝經傳", "泛指儒家經典。六藝，即六經：詩、書、禮、樂、易、春秋。經，先聖所著之書。傳，後賢解經之書。<span class='bk-note'>「六藝」在古代另可指六項教育內容，即禮、樂、射、御、書、數。</span><span class='zy-note'>【注音】傳，音<b>ㄓㄨㄢˋ</b>。</span>"], ["通習", "通曉熟習。"], ["不拘於時", "不受時俗拘束。於，置於動詞之後，表示被動。時，指當時士大夫以互相學習為恥的風氣。<span class='bk-note'>義近：不顧流俗、不阿於世、孤介不群。義反：隨波逐流、與世浮沉、同流合汙。</span>"], ["古道", "指前人從師問學的傳統。"], ["貽", "贈送。<span class='zy-note'>【注音】貽，音<b>ㄧˊ</b>。</span>"]], "pian": "說明寫作的緣由，並以「能行古道」呼應首段。", "xi": "作者嘉許「不拘於時」、拜己為師的李蟠，與「拘於時」的「今之眾人」形成強烈反差。本篇以「古之學者必有師」開頭，以「能行古道」之李蟠作結，既首尾呼應，又凸顯文旨。", "fan": "李家的孩子李蟠，年紀十七歲，喜好古文，六經的經文和傳文，都普遍地學習過。他不受時俗的拘束，向我請教學習。我讚許他能實行古人從師問學之道，就寫了這篇〈師說〉贈送給他。", "qa": [["文中「六藝經傳，皆通習之」，此「六藝」所指為何？", "指<b>六經</b>：詩、書、禮、樂、易、春秋。<br><span class='bk-note'>辨析：古代「六藝」另可指六項教育內容（禮、樂、射、御、書、數）。本文之「六藝」指六經。</span>"]], "noteStart": 41}],extras: {"intro":[{"label": "題解·文體", "head": "「說」是什麼文體", "body": "1.說：中國古代論辨類的一種文體，內容大都偏重說明、解釋事理。著名文章如韓愈 雜說、柳宗元 捕蛇者說。屬於生活雜感、讀書心得的雜文性文字也包括在內，如周敦頤 愛蓮說。"}, {"label": "題解·背景", "head": "寫作背景", "body": "本文大約寫於唐德宗 貞元十八年（西元八○二年），當時韓愈三十五歲，在長安任國子監四門博士。自魏 晉以來，社會上形成一種以「士大夫之族」為代表的門閥制度。其子弟不管品德好壞、才能高低，不需要經過科舉考試，就可以憑著高人一等的門第享受特權，輕易走上仕途之路。因此他們不但不肯從師學習，也瞧不起從師學習的人。到了唐代中期，這種不良的社會風氣仍舊存在。當時韓愈為了推展古文運動，曾經公開招收後學傳授古文，這種行為竟受到「士大夫之族」的譏諷，「群聚而笑之」，說他是好為人師的狂人。韓愈為糾正當時這種不良的社會風氣，於是寫了師說一文以正視聽。因此，表面上師說是為李蟠而作，但實際是為了抨擊那些恥於從師的「士大夫之族」，進而藉機倡導從師學習的重要性。"}, {"label": "題解·爭議", "head": "〈師說〉是否為贈序類文章", "body": "本文題為「師說」，過去常因為寫作的目的—以文贈人、勉勵後學，而將本文歸類為「贈序」。按常規，贈序多為讚美或忠告勗勉；然而作者在這裡卻是借題發揮，因此本文也是一篇說理的雜文，屬於議論文。所謂「師說」，亦即「說師」，就「師道」的理念發表感想，並議論時弊。<br><br>師說是否為「贈序類」的文章，常引起廣泛的爭議。但以本文為贈序類者，主要是根據師說末段，韓愈說：「李氏子蟠，年十七，好古文，六藝經傳，皆通習之。不拘於時，請學於余，余嘉其能行古道，作師說以貽之。」而且民國八十年夜間部大學聯招出了兩道與「序」有關聯的題目，一題說「贈序」，稱「引」或「說」，始於蘇洵。一題是蘇軾 稼說送張琥與師說，性質上同屬贈序。當時有老師曾向聯招會行文，對答案表示疑義。聯招會沒有接受，答覆的理由是在性質上師說可以列為贈序。<br><br>認為師說不是贈序類文章者，其所持理由是贈序文章的標題，為區別於「序跋」的「序」，標題常寫作「送○○○序」或「贈○○○序」，如唐代 韓愈 送孟東野序、送李愿歸盤谷序、送董邵南序；柳宗元 送薛存義序、送寧國范明府詩序；宋代 歐陽脩 送楊寘序、送曾鞏秀才序、送徐無黨南歸序；曾鞏 送江任序；王安石 送孫正之序；明代 宋濂 送東陽馬生序等，都是傳世的名篇。但師說一文並無「送」或「贈」之字眼，而且，清代 桐城派古文家姚鼐的古文辭類纂，將文章分成十三類，師說列為「論辨類」，並非列入「贈序類」，所以不算贈序類。<br><br>而贊同師說為贈序者的理由是：贈序的內容一般都會寫到作者和被贈者的友誼，和對於受者的期望、勸勉和關心等。但韓愈、柳宗元的許多贈序，除了道別、敘情以外，還常常藉以抒發理想、抱負，議論朝政、抨擊時弊，內容廣泛、形式多樣。因此，師說一文雖無「贈」、「送」與「序」之字眼，但據全文的內容與末段為文的緣由，是出於對後學李蟠的嘉許與餽贈，符合「贈序」意涵，應可列為贈序類文章。<br><br><span class='bk-note'>按　由於此文是否屬於「贈序」類頗具爭議，建議避免出題。</span>"}, {"label": "題解·背景", "head": "飽受批評亦不畏懼", "body": "2.飽受批評亦不畏懼：柳宗元 答韋中立論師道書：「今之世不聞有師，有，輒嘩笑之，以為狂人。獨韓愈奮不顧流俗，犯笑侮，收召後學，作師說，因抗顏而為師。世果群怪聚罵，指目牽引，而增與為言辭。愈以是得狂名。」可知韓愈在當時收召後學，被指為狂人，仍不畏他人眼光，抗顏（面色嚴正不屈）為師。"}],"authorPages":[{"label": "作者·生平", "head": "(一)三歲喪父，兄嫂為依", "body": "韓愈出生兩個月，母親過世。三歲時父親過世，由長兄韓會與大嫂鄭夫人撫養。韓愈上有三兄，韓會為韓愈大哥，長韓愈三十一歲，韓愈跟著在京師做官的韓會一起生活。韓愈十歲時，韓會被貶為韶州（今廣東省）刺史，韓愈便隨兄嫂到了南方。但禍不單行，韓會沒過幾年就病死。建中元年（西元七八○年），十三歲的韓愈隨嫂嫂鄭夫人護喪回到河陽老家。建中二年，中原發生兵亂，幸虧韓家還有祖業田產在江南的宣城（今安徽省），於是其嫂鄭夫人帶著兒子老成和韓愈避亂宣城。"}, {"label": "作者·生平", "head": "(二)三次落榜，始中進士", "body": "韓愈十九歲離開宣城，到京師長安準備應進士試。他既沒有門第的資蔭，又沒有權貴的引薦，因此到處碰壁，三試不中。到二十五歲，韓愈才得中進士。但唐代科舉制度，禮部考試後，還要經吏部考試合格才能授官，而韓愈卻又再三試不中。長安十年，困厄悲愁，「無所取資，日求於人」、「飢不得食，寒不得衣」。"}, {"label": "作者·生平", "head": "(三)任國子監，接觸學子", "body": "貞元十七年（西元八○一年），三十四歲的韓愈被任命為國子監四門博士，正式進入京師官場。博士官是閒職，地位不高，常為人輕視。但國子監是當時的最高學府，能在這裡教書，對韓愈倡導古文運動是頗為有利的。"}, {"label": "作者·生平", "head": "(四)彈劾皇族，貶官陽山", "body": "貞元十九年（西元八○三年）冬，韓愈任監察御史，向皇帝告了京兆尹李實一狀。李實是皇親國戚，又是唐德宗晚年所信任的佞臣，權傾朝野。這年關中大旱，秋又早霜，百姓困苦不堪；而京兆尹李實卻為了諂媚皇帝，照樣橫徵暴斂。滿朝文武為保富貴，對此視而不見，裝聾作啞；生性鯁直的韓愈憤恨難忍，因而有控告之舉，要求皇帝減免百姓租稅，留條生路。這下得罪了權貴李實，立刻被貶到千里之外的陽山（今廣東省 陽山縣）當縣令。"}, {"label": "作者·生平", "head": "(五)諫迎佛骨，被貶潮州", "body": "元和十四年（西元八一九年），韓愈五十二歲，唐憲宗派遣專使前往鳳翔迎奉一節釋迦的指骨。先在宮內供奉三天，之後送往長安各寺傳遞供拜。長安老少奔波，拋下工作，頂禮膜拜，耗費諸多金錢與人力。韓愈擔心如不及時禁止，一定會有人斷臂割肉，捨身事佛，就上論佛骨表給唐憲宗，反對把佛骨迎入宮中。<br><br>他認為：1.佛法本是夷狄的一種宗教，本來就不當信奉。2.佛骨是「枯朽之骨，凶穢之餘」不祥之物，絕不能迎入宮中，應把佛骨燒掉。3.歷來信佛的皇帝儘管非常虔誠，但都短命。唐憲宗得表，大為震怒，下令將韓愈處以極刑。當時朝廷士大夫很震驚惋惜，宰相裴度、崔群勸解，皇親國戚也認為處刑太重，紛紛替韓愈求情。憲宗終於怒氣稍平，免他死罪，貶為潮州（今廣東省 潮州市）刺史。"}, {"label": "作者·生平", "head": "(六)治理潮州，政績卓著", "body": "韓愈自四月二十五日到潮州，至年底離任，治理潮州雖不到八個月，但政績卓著，為人稱道。其中有三項最值得稱述：1.為民除鱷魚之害；2.釋放奴婢；3.興辦學校。潮州的百姓對韓愈的政績感激萬分，為了紀念他的功勞，便把他當日祭鱷魚的那一條河，改名為韓江；後來又在附近建了韓文公廟，供奉他的塑像。<br><br>潮州人人說：「潮州西邊谿潭有鱷魚出沒，吃光了百姓的家畜，因此百姓窮困。」韓愈前往視察，命官員攜豬、羊各一隻投進谿潭，並作祭鱷魚文警告說：「鱷魚不可以和刺史雜居此地。刺史受天子詔命看守這塊土地，治理百姓，而鱷魚不安分守己待在谿潭，上岸吞食百姓飼養的畜牲，和刺史抗衡，爭當統領地方的長官，刺史豈肯屈服順從。現在與鱷魚約─限三日率領同類遷徙南海，三天不遷，寬限到五天；五天不遷，寬限到七天；七天不遷，那表示絕不肯遷了。不把刺史放在眼裡，不聽刺史的話，刺史就選材伎（有才能與技藝的人）吏民，操強弓毒箭，與鱷魚對抗，直到殺完為止，可不要後悔啊！」據舊唐書 韓愈傳記載，自從韓愈對鱷魚下了這個「最後通牒」，當天晚上就暴風突發，連河中的水也颳乾了；鱷魚因為沒有棲息之所，只得逃入大海，從此潮州不再有鱷魚為患。潮州人後來無鱷魚之患，當是事實，但無鱷魚之患必定是由於韓愈「選材伎吏民，操強弓毒矢，以與鱷魚從事」的結果，而不是文章警告的效力。"}, {"label": "作者·生平", "head": "(七)任職吏部，力斥佛老", "body": "長慶二年（西元八二二年）九月，韓愈轉吏部侍郎。長慶三年正月，任京兆尹兼御史大夫，十月，復任兵部侍郎，晚年任吏部侍郎，故世稱韓吏部。據說韓愈臨終前把家人及友朋召集病榻之前，叫他們仔細看看自己的身體，然後說：「佛、老之人造謠，說我排斥佛、老會遭報應，必得癩病（痲瘋病）而死。現在你們看清楚，我的身體完整無損；『報應』顯靈之說，純屬欺人之談。」可見他至死不忘排斥佛、老，維護儒道。"}, {"label": "作者·文學", "head": "(一)散文成就：眾體兼長", "body": "韓愈眾體兼長，所作包含賦、論、說、傳、記、頌、贊、書、序、哀辭、祭文、碑誌、狀、表、雜文等各種體裁皆有，都有卓越的成就。而其文風氣勢充沛，縱橫開闔，奇偶交錯，巧譬善喻，或詭譎，或嚴正，具有多樣的藝術特色。"}, {"label": "作者·文學", "head": "(二)語言特色：務求創新", "body": "韓愈是語言大師，善於推陳出新。如「蠅營狗苟」（送窮文）；「貪多務得」、「同工異曲」、「俱收並蓄」（進學解）；「不塞不流，不止不行」（原道）等新穎詞語，他主張「文從字順各識職」（南陽樊紹述墓誌銘），創造一種從口語提煉的書面語言，擴大文言文的表達功能。但另一方面，他還有一種詰屈聱牙的文句，自謂「不可時施，只以自嬉」（送窮文），對後來一些文人也有相當的影響。"}, {"label": "作者·文學", "head": "(三)詩的成就：奇險詩派", "body": "韓愈倡導古文運動，也致力於詩歌的革新。他繼承李白的自由豪放和杜甫的體格變化、「語不驚人死不休」的藝術傳統，開拓詩歌新路。他與孟郊是「奇險詩派」的代表人物，這一詩派除韓、孟外，還有賈島、盧仝等。韓、孟二人是摯友，且詩歌風格相近，都有「奇崛險怪」的特點。<br><br>這種詩風的具體表現有下列三點：1.用奇字、造拗句、押險韻、避熟求生、困難見巧；2.善於捕捉和表現形態萬千的形象，氣勢雄偉，想像豐富；3.以文為詩。"}, {"label": "作者·補充", "head": "駢文", "body": "3.駢文：是中國特有的一種以字句兩兩相對而成篇章的文體，漢末、魏、晉盛極一時。駢文有下列幾個特點：(1)句式整齊；(2)辭藻華美；(3)聲律和諧；(4)用典繁多。"}, {"label": "作者·補充", "head": "名句與評價", "body": "<b>文起八代之衰，道濟天下之溺：</b>以古文振起八代以來華靡的文風，以儒道濟助沉溺於佛、老思想的天下。語出蘇軾 潮州韓文公廟碑。<br><br><b>匹夫而為百世師，一言而為天下法：</b>韓愈只是一介文人卻成為歷代師法的對象，所說的言論成為天下的法則。語出蘇軾 潮州韓文公廟碑。"}],"appreciation":[],"supplement":[]},

      ]
