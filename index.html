<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞媛的國文教學 · 部定必修古文投影</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<style>

/* ================================================================
   ██  1. 設計系統變數（亮色模式預設值）
   新增 --surface：取代所有硬編碼的 background:white，
   讓深色模式只要覆蓋這一個變數即可。
   ================================================================ */
:root {
  --ink:     #1a1209;
  --paper:   #fdf8f0;
  --warm:    #f5ede0;
  --surface: #ffffff;     /* ← 卡片/面板底色，深色模式覆蓋此值 */
  --gold:    #c8931a;
  --red:     #c0392b;
  --green:   #27614a;
  --blue:    #1e4d8c;
  --muted:   #7a6a55;
  --border:  #d4c4a8;
  --easy:    #27614a;
  --medium:  #c8931a;
  --hard:    #c0392b;
  --base-size: 15px;      /* 全站字級（由設定面板滑桿控制）*/
  --slider-base-size: 15px; /* 保留滑桿目前值；古文複習區的課本頁碼使用 */
}

/* ================================================================
   ██  2. 深色模式（新功能 🌙）
   切換 body.dark-mode class 即可啟用，設定會存入 localStorage。
   ================================================================ */
body.dark-mode {
  --ink:     #ede0cc;
  --paper:   #18130e;
  --warm:    #221a12;
  --surface: #2a1f14;
  --gold:    #d4a030;
  --red:     #e06050;
  --green:   #3d9068;
  --blue:    #5a90d0;
  --muted:   #9a8870;
  --border:  #3d2e1e;
}
/* 深色模式下的特定覆蓋（使用了硬編碼色的元素）*/
body.dark-mode .result-box   { background: #0e0b08; }
body.dark-mode header,
body.dark-mode .tabs          { background: #0e0b08; }
body.dark-mode .q-chip        { background: var(--warm); }
body.dark-mode #fullscreen-overlay { background: var(--paper); }
body.dark-mode .side-btn      { background: #3a2d1e; }
body.dark-mode .side-btn:hover{ background: #4a3d2e; }

/* ================================================================
   ██  3. 投屏 / 字級模式（字級滑桿版）
   ================================================================ */

/* 1. 當開啟投屏模式時，我們只移除原本的背景和陰影，
      不鎖死 --base-size，這樣滑桿才能控制大小 */
body.proj-mode {
  background: var(--paper); 
}

/* 2. 一般頁面內容：移除 !important，並確保所有文字都引用變數 */
body.proj-mode .container,
body.proj-mode .q-preview,
body.proj-mode .explain-text,
body.proj-mode .key-point,
body.proj-mode .key-error {
  font-size: var(--base-size); 
  line-height: 1.6;
}

/* 3. ==================== 全螢幕投影專用放大 ==================== 
      關鍵：將 !important 全部刪除，並使用 calc 連動變數 */
      
body.proj-mode .fs-content {
  font-size: calc(var(--base-size) * 1.32); 
  line-height: 1.8;
}

body.proj-mode .fs-question-text {
  font-size: calc(var(--base-size) * 1.30);
  line-height: 1.8;
}

body.proj-mode .fs-explain-area,
body.proj-mode .fs-explain-area .explain-text,
body.proj-mode .fs-explain-area .key-point,
body.proj-mode .fs-explain-area .key-error {
  font-size: calc(var(--base-size) * 0.92); /* 詳解比題目小一點 */
  line-height: 1.5;
}

body.proj-mode .fs-ans-badge {
  font-size: calc(var(--base-size) * 1.25);
}

body.proj-mode .fs-reveal-btn {
  font-size: calc(var(--base-size) * 1.1);
}

/* ================================================================
   ██  4. 蘇瑞媛老師浮水印（固定右下，直排）
   ================================================================ */
body::after {
  content: "蘇瑞媛老師";
  position: fixed; bottom: 32px; right: 28px;
  font-family: "Noto Serif TC", serif; font-size: 13px; font-weight: 500;
  color: rgba(200,147,26,0.35); letter-spacing: 3px;
  pointer-events: none; z-index: 9999;
  writing-mode: vertical-rl; text-orientation: mixed; user-select: none;
}

/* ================================================================
   ██  5. 基礎重置與 body
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans TC", sans-serif;
  font-size: var(--base-size);
  line-height: 1.85;
  transition: font-size 0.3s ease, background 0.3s ease, color 0.3s ease;
}

/* ================================================================
   ██  6. Header
   ================================================================ */
header {
  background: linear-gradient(135deg, #1a1209, #2c2218);
  color: #fdf8f0; padding: 36px 24px 24px;
  text-align: center; position: relative; overflow: hidden;
}
header::before {
  content: "國"; font-family: "Noto Serif TC", serif; font-size: 320px;
  color: rgba(255,255,255,0.04); position: absolute; right: -50px; top: -70px;
  pointer-events: none; user-select: none;
}
.header-label { font-size: 12px; letter-spacing: 4px; color: var(--gold); margin-bottom: 8px; }
header h1 { font-family: "Noto Serif TC", serif; font-size: clamp(22px,4vw,36px); font-weight: 900; margin-bottom: 6px; }
header p  { font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 1px; margin-bottom: 16px; }

/* 年份選擇器 */
.year-selector { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.year-btn {
  padding: 6px 16px; background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.65);
  border-radius: 9999px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; font-family: "Noto Sans TC", sans-serif;
}
.year-btn:hover  { background: rgba(200,147,26,0.2); color: var(--gold); border-color: var(--gold); }
.year-btn.active { background: var(--gold); color: #1a1209; border-color: var(--gold); }
.year-btn.empty  { opacity: 0.4; }   /* 尚無資料的年份 */

/* 右上角按鈕群（投屏 + 深色模式）*/
.header-btns { position: absolute; top: 18px; right: 18px; display: flex; gap: 6px; align-items: center; }
.header-btn {
  padding: 6px 12px; background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25); color: white;
  border-radius: 20px; cursor: pointer; font-size: 12px;
  font-family: "Noto Sans TC", sans-serif; transition: all 0.2s; white-space: nowrap;
}
.header-btn:hover  { background: rgba(255,255,255,0.2); }
.header-btn.active { background: rgba(200,147,26,0.3); border-color: var(--gold); color: var(--gold); }
/* 深色模式按鈕用小型 toggle switch 外觀 */
.dark-switch {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; cursor: pointer;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px; color: white; font-size: 12px; transition: all 0.2s;
}
.dark-switch:hover { background: rgba(255,255,255,0.2); }
.dark-switch.on { background: rgba(200,147,26,0.3); border-color: var(--gold); color: var(--gold); }
.proj-btn { /* 與 header-btn 同樣式 */ }

/* ================================================================
   ██  7. Tabs（sticky 置頂）
   ================================================================ */
.tabs {
  display: flex; background: #1a1209;
  padding: 0 24px; border-bottom: 3px solid var(--gold);
  position: sticky; top: 0; z-index: 100; overflow-x: auto;
}
.tab-btn {
  padding: 13px 16px; background: none; border: none;
  color: rgba(255,255,255,0.45); font-family: "Noto Serif TC", serif;
  font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent;
  margin-bottom: -3px; transition: all 0.2s; letter-spacing: 1px; white-space: nowrap;
}
.tab-btn.active  { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn:hover:not(.active) { color: rgba(255,255,255,0.75); }

/* ================================================================
   ██  8. 主容器與共用元件
   ================================================================ */
.container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 120px; }
section    { display: none; }
section.active { display: block; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; margin-bottom: 24px;
}
.section-title {
  font-family: "Noto Serif TC", serif; font-size: 19px; font-weight: 700;
  color: var(--ink); margin-bottom: 20px; padding-bottom: 10px;
  border-bottom: 2px dashed var(--border);
}
.empty-hint {
  text-align: center; padding: 60px 20px; color: var(--muted);
  font-size: 14px; line-height: 2;
}
.empty-hint .icon { font-size: 36px; margin-bottom: 12px; }

/* ================================================================
   ██  9. Tab 1：五標與成績
   ================================================================ */
.score-section {
  background: var(--warm); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px; margin-bottom: 24px;
}
.five-standards { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 28px; }

.standard-card {
  background: var(--surface); border-radius: 10px; padding: 14px 10px;
  text-align: center; border: 2px solid var(--border); transition: transform 0.2s, box-shadow 0.2s;
}
.standard-card:hover    { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
.standard-card.highlight{ border-color: var(--gold); background: var(--warm); }
.standard-name  { font-size: calc(var(--base-size) * 0.78); color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; }
.standard-score { font-family: "Noto Serif TC", serif; font-size: calc(var(--base-size) * 1.9); font-weight: 900; }

.calc-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.calc-field label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
.calc-field input {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
  font-size: 18px; font-family: "Noto Serif TC", serif; color: var(--ink);
  background: var(--surface); transition: border-color 0.2s;
}
.calc-field input:focus { outline: none; border-color: var(--gold); }
.calc-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg,#1a1209,#2c2218);
  color: var(--gold); border: none; border-radius: 10px;
  font-size: 16px; font-family: "Noto Serif TC", serif; cursor: pointer; letter-spacing: 2px; transition: opacity 0.2s;
}
.calc-btn:hover { opacity: 0.88; }
.result-box { margin-top: 20px; padding: 22px; background: #1a1209; border-radius: 12px; text-align: center; display: none; }
.result-score { font-family: "Noto Serif TC", serif; font-size: calc(var(--base-size) * 3.4); font-weight: 900; color: var(--gold); }
.result-label { font-size: calc(var(--base-size) * 1.05); color: rgba(255,255,255,0.75); margin-top: 6px; }
.score-bar  { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 14px; overflow: hidden; }
.score-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.6s ease; }

/* ================================================================
   ██  10. Tab 2：逐題檢討
   ================================================================ */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-btn {
  padding: 6px 18px; border-radius: 20px; border: 2px solid var(--border);
  background: var(--surface); cursor: pointer; font-size: 13px; color: var(--ink);
  transition: all 0.15s; font-family: "Noto Sans TC", sans-serif;
}
.filter-btn.active         { background: var(--ink);  color: var(--paper); border-color: var(--ink); }
.filter-btn:hover:not(.active) { border-color: var(--gold); }
/* 書籤篩選按鈕啟用時用金色 */
.filter-btn.bookmark-filter.active { background: var(--gold); color: #1a1209; border-color: var(--gold); }

/* 題目卡片 */
.q-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  margin-bottom: 16px; overflow: hidden; transition: box-shadow 0.25s, transform 0.25s;
  scroll-margin-top: 80px;
}
.q-card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.1); transform: translateY(-3px); }

.q-header {
  padding: 16px 20px; cursor: pointer; background: var(--warm);
  display: flex; align-items: center; gap: 12px; user-select: none;
}
.q-num {
  flex-shrink: 0; width: 34px; height: 34px; background: var(--ink); color: var(--gold);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: "Noto Serif TC", serif; font-size: 14px; font-weight: 700;
}
.q-preview { flex: 1; font-size: var(--base-size);  color: var(--ink); min-width: 0; }
.q-meta    { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.difficulty  { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.diff-easy   { background: rgba(39,97,74,0.12);  color: var(--easy);   }
.diff-medium { background: rgba(200,147,26,0.12); color: var(--medium); }
.diff-hard   { background: rgba(192,57,43,0.12);  color: var(--hard);   }

.q-answer {
  width: 30px; height: 30px; background: var(--ink); color: var(--gold);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-family: "Noto Serif TC", serif; font-size: 14px; font-weight: 700;
}

/* ================================================================
   ██  11. 書籤按鈕（新功能 🔖）
   放在 q-meta 內，stopPropagation 避免觸發展開卡片
   ================================================================ */
.bookmark-btn {
  background: none; border: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--border);
  padding: 2px; transition: color 0.2s, transform 0.15s; flex-shrink: 0;
}
.bookmark-btn:hover    { transform: scale(1.2); }
.bookmark-btn.starred  { color: var(--gold); }

.q-toggle { width: 18px; height: 18px; color: var(--muted); transition: transform 0.25s; flex-shrink: 0; }
.q-card.open .q-toggle { transform: rotate(180deg); }

.q-body { display: none; padding: 20px 22px; border-top: 1px solid var(--border); }
.q-card.open .q-body { display: block; }

.explain-title { font-family: "Noto Serif TC", serif; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.explain-text  { font-size: var(--base-size); line-height: 1.95; color: var(--ink); }
.key-point {
  background: rgba(200,147,26,0.07); border-left: 4px solid var(--gold);
  border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: var(--base-size); line-height: 1.75; margin-top: 12px;
}
.key-error {
  background: rgba(192,57,43,0.07); border-left: 4px solid var(--red);
  border-radius: 0 8px 8px 0; padding: 12px 16px; font-size: var(--base-size); line-height: 1.75; margin-top: 10px;
}
.passage-inline-btn {
  display: inline-block; margin: 6px 0 2px; padding: 5px 14px;
  background: rgba(200,147,26,0.08); border: 1px solid var(--gold); color: var(--gold);
  border-radius: 9999px; font-size: 12px; cursor: pointer;
  font-family: "Noto Sans TC", sans-serif; transition: background 0.15s;
}
.passage-inline-btn:hover { background: rgba(200,147,26,0.2); }

/* 圖片樣式（命名規則：images/年份題號.png）*/
.q-img {
  display: block; max-width: 100%; width: auto; height: auto;
  margin: 12px auto; border-radius: 6px; border: 1px solid var(--border);
}
body.proj-mode .q-img { width: 90% !important; max-width: 820px !important; height: auto !important; }

/* ================================================================
   ██  12. 閱讀原文 Modal（z-index 9600，高於全螢幕投影）
   ================================================================ */
#passage-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(26,18,9,0.88); z-index: 9600;   /* 高於全螢幕的 9500 */
  align-items: flex-start; justify-content: center;
  padding: 28px 20px; overflow-y: auto;
}
#passage-modal.open { display: flex; }
.modal-box {
  background: var(--paper); width: 100%; max-width: 900px; border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: modalIn 0.25s ease; margin: auto;
}
@keyframes modalIn { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:none; } }
.modal-header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 16px; border-bottom: 2px dashed var(--border); }
.modal-title  { flex: 1; font-family: "Noto Serif TC", serif; font-size: calc(var(--base-size) * 1.1); font-weight: 700; color: var(--ink); }
.modal-close  {
  flex-shrink: 0; width: 38px; height: 38px; background: var(--red); color: white;
  border: none; border-radius: 50%; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: opacity 0.2s;
}
.modal-close:hover { opacity: 0.82; }
.modal-body { padding: 22px 26px 18px; line-height: 2.1; font-size: var(--base-size); max-height: 63vh; overflow-y: auto; }
.modal-body img { display: block; max-width: 100%; margin: 14px auto; border-radius: 6px; }
.modal-close-bottom {
  display: block; margin: 4px 26px 26px; width: calc(100% - 52px);
  padding: 12px; background: var(--red); color: white; border: none;
  border-radius: 10px; font-size: 15px; cursor: pointer;
  font-family: "Noto Sans TC", sans-serif; transition: opacity 0.2s;
}
.modal-close-bottom:hover { opacity: 0.85; }

/* ================================================================
   ██  13. Tab 3：題組整理
   ================================================================ */
.group-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  margin-bottom: 18px; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s;
}
.group-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); transform: translateY(-2px); }
.group-title {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 16px 20px; background: var(--warm);
  font-family: "Noto Serif TC", serif; font-size: calc(var(--base-size) * 1.0); font-weight: 700;
}
.group-tag {
  background: rgba(200,147,26,0.15); color: var(--gold);
  border-radius: 9999px; padding: 2px 12px;
  font-size: 12px; font-family: "Noto Sans TC", sans-serif; font-weight: 500;
}
.group-qs { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 20px; }
.q-chip {
  padding: 4px 12px; background: var(--warm); border: 1px solid var(--border);
  border-radius: 20px; font-size: 13px; cursor: pointer; transition: background 0.15s; color: var(--ink);
}
.q-chip:hover { background: rgba(200,147,26,0.15); border-color: var(--gold); }

/* ================================================================
   ██  14. Tab 4：統計分析（新功能 📌 📋）
   ================================================================ */

/* 知識點熱度橫條圖 */
.stat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
.stat-bar-label { width: 90px; flex-shrink: 0; text-align: right; color: var(--ink); font-size: 12px; }
.stat-bar-track {
  flex: 1; height: 26px; background: var(--warm);
  border-radius: 4px; overflow: hidden; border: 1px solid var(--border);
}
.stat-bar-fill {
  height: 100%; background: var(--gold); border-radius: 4px 0 0 4px;
  transition: width 0.6s ease;
}
.stat-bar-fill.top3 { background: var(--green); }   /* 前三名用綠色 */
.stat-bar-count { width: 44px; flex-shrink: 0; font-size: 11px; color: var(--muted); }

/* 班級進度跨年統計表 */
.cross-table-wrap { overflow-x: hidden; max-width:100%; width:100%; }
.cross-year-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
.cross-year-table th {
  padding: 8px 10px; background: var(--warm); color: var(--muted);
  text-align: center; border: 1px solid var(--border);
  font-weight: 500; font-size: 11px;
}
.cross-year-table td { padding: 8px 10px; text-align: center; border: 1px solid var(--border); font-weight: 500; }
.cross-year-table td.cls-name { text-align: left; font-weight: 700; color: var(--ink); background: var(--warm); }
.pct-high { background: rgba(39,97,74,0.15);  color: var(--green);  }
.pct-mid  { background: rgba(200,147,26,0.15); color: var(--medium); }
.pct-low  { background: rgba(192,57,43,0.12);  color: var(--hard);   }
.pct-none { background: var(--warm); color: var(--muted); }

/* ================================================================
   ██  15. 右側浮動按鈕（共用樣式）
   由下往上：班級進度 / 快速跳題 / 全螢幕 / 設定
   各距底部間距 110px，避免按鈕重疊。
   ================================================================ */
.side-btn {
  position: fixed; right: 0;
  background: var(--ink); color: var(--gold); border: none;
  border-radius: 12px 0 0 12px; padding: 13px 9px;
  cursor: pointer; font-size: 11px; writing-mode: vertical-rl;
  letter-spacing: 3px; font-family: "Noto Serif TC", serif;
  transition: background 0.2s; user-select: none;
}
.side-btn:hover { background: #2c2218; }
#settings-toggle { bottom: 420px; z-index: 9501; }
#fs-toggle       { bottom: 310px; z-index: 9501; }
#jump-toggle     { bottom: 200px; z-index: 9501; }
#prog-toggle     { bottom: 90px;  z-index: 9501; }

  position: fixed; right: -320px; top: 0; bottom: 0; width: 320px;

/* Toggle Switch（深色模式）*/
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.toggle-info .toggle-label { font-size: 14px; font-weight: 500; color: var(--ink); }
.toggle-info .toggle-sub   { font-size: 11px; color: var(--muted); }
.toggle-switch {
  width: 48px; height: 26px; background: var(--border);
  border-radius: 13px; cursor: pointer; transition: background 0.25s;
  flex-shrink: 0; position: relative;
}
.toggle-switch.on { background: var(--gold); }
.toggle-switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; background: white;
  border-radius: 50%; transition: transform 0.25s;
}
.toggle-switch.on::after { transform: translateX(22px); }

  background: var(--border); border-radius: 3px; outline: none; cursor: pointer;
}
.font-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  background: var(--gold); border-radius: 50%; cursor: pointer; transition: transform 0.1s;
}
.font-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }

  margin-top: 10px; padding: 6px 14px; border: 1px solid var(--border);
  background: var(--surface); border-radius: 20px; font-size: 12px; color: var(--muted);

}

}

  font-size:calc(var(--base-size)*0.85); 
   
}
.wks-cover-title {
  font-family:"Noto Serif TC",serif;
  font-size:calc(var(--base-size)*3.4); font-weight:900;
    line-height:1.1;
  
}
.wks-cover-author {
  font-family:"Noto Serif TC",serif;
  font-size:calc(var(--base-size)*1.5);  
}
.wks-cover-sub {
  font-size:calc(var(--base-size)*0.82);

}

/* 修辭標籤（內嵌於課文頁） */
.wks-rhetoric-callout {
  margin-top:22px; padding:12px 18px;
   
   display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
}
.wks-rt-tag {
   
      
}
.wks-rt-ex {   font-size:calc(var(--base-size)*0.95); font-weight:700; }
.wks-rt-note { font-size:calc(var(--base-size)*0.88);  line-height:1.5; }
/* 修辭總覽 */

/* 提問 */

.wks-prompt-text {
   font-size:calc(var(--base-size)*1.45);

}
.wks-prompt-hint { font-size:calc(var(--base-size)*0.82); color:rgba(255,255,255,0.45);  }
/* 全螢幕 overlay */
#wk-fullscreen {

}
#wk-fullscreen.open { display:flex; }
.wkfs-header {

}

}

.wkfs-sec-btn {

}
.wkfs-sec-btn:hover, .wkfs-sec-btn.active {   }
.wkfs-close {
  padding:4px 14px;

}
.wkfs-body { flex:1; display:flex; align-items:stretch; overflow:auto; }
.wkfs-body .wk-slide { min-height:0; flex:1; }
#wk-fullscreen .wks-cover-title { font-size:calc(var(--base-size)*4.8); }
#wk-fullscreen .wks-cover-author { font-size:calc(var(--base-size)*1.8); }
#wk-fullscreen .wks-orig { font-size:calc(var(--base-size)*2.0); letter-spacing:3px; }
#wk-fullscreen .wks-trans { font-size:calc(var(--base-size)*1.15); }
#wk-fullscreen .wks-author-text { font-size:calc(var(--base-size)*1.2); line-height:2.1; }
#wk-fullscreen .wks-prompt-text { font-size:calc(var(--base-size)*1.75); }
#wk-fullscreen .wks-rh-name { font-size:calc(var(--base-size)*1.15); }
#wk-fullscreen .wks-rh-explain { font-size:calc(var(--base-size)*0.98); }
#wk-fullscreen .wks-text { padding:52px 72px; }
#wk-fullscreen .wks-author { padding:52px 72px; }
#wk-fullscreen .wks-rhetoric { padding:48px 72px; }

.wkfs-footer {
  display:flex; align-items:center; justify-content:center; gap:28px; padding:10px 20px;

}

}

  .wks-cover-title { font-size:calc(var(--base-size)*2.2); }
}

/* ── 全螢幕設定按鈕列 ── */
.wkfs-ctrl-btns { display:flex; gap:5px; align-items:center; margin-right:6px; }
.wkfs-ctrl-btn {
  padding:3px 10px; 
   
   font-size:12px; font-weight:700; cursor:pointer; 
}
.wkfs-ctrl-btn:hover {   }

/* ── 白話文封面 ── */
.wks-cover-prose {
  
}
.wks-cover-extra {
  
}
.wks-prose-badge {
  background:rgba(30,77,140,0.5); color:rgba(255,255,255,0.7);
  padding:3px 12px; border-radius:12px; font-size:11px;
  letter-spacing:2px; border:1px solid rgba(255,255,255,0.2);
}
.wks-extra-badge {
  background:rgba(20,100,50,0.5); color:rgba(200,255,200,0.85);
  padding:3px 12px; border-radius:12px; font-size:11px;
  letter-spacing:2px; border:1px solid rgba(100,200,100,0.3);
}

/* ── 課文進度格子 ── */
.text-prog-grid {
  display:flex; flex-direction:column; gap:4px;
}
.tp-cell {
  display:flex; align-items:center; gap:6px;
  padding:4px 8px; border-radius:6px;
  font-size:11.5px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface);
  color:var(--ink); transition:all 0.15s; user-select:none;
  font-family:"Noto Serif TC",serif;
}
.tp-cell:hover { border-color:var(--gold); }
.tp-cell .tp-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--border); flex-shrink:0; transition:all 0.2s;
}
.tp-cell.taught { border-color:var(--green); }
.tp-cell.taught .tp-dot { background:var(--green); }
.tp-cell.partial { border-color:var(--gold); }
.tp-cell.partial .tp-dot { background:var(--gold); }

/* ════════════════════════════════════════════════════════════════
   ██  墨韻今生 · 紙墨光影 ── 古文複習投影片美感系統（覆寫層）
   作用範圍：.wenxue-* / .wk-* / .wks-* / .wkfs-* / #tb-* / .textbook-btn
   不影響全站 :root、題目卡片、年份、五標、tab 等其他元件
   ════════════════════════════════════════════════════════════════ */

/* ─── 局部設計變數（亮色：絹布暖玉） ─── */
#tab-wenxue, #wk-fullscreen, #textbook-modal, #tb-drawer {
  --mk-paper:        #f4f0ea;
  --mk-paper-edge:   #ebe3d2;
  --mk-paper-warm:   #f7f2e6;
  --mk-ink-deep:     #211710;
  --mk-ink:          #33271a;
  --mk-ink-soft:     #6b5a42;
  --mk-cinnabar:     #b22222;
  --mk-cinnabar-soft:#cf5a48;
  --mk-gold:         #b0892b;
  --mk-gold-soft:    #d4b577;
  --mk-line:         #cabb96;
  --mk-shadow:       rgba(40, 26, 12, 0.13);
  --mk-blue:         #1e4d8c;
  --mk-green:        #2d6a4a;
}
/* ─── 深色：暖墨黑 + 書房窗光 ─── */
body.dark-mode #tab-wenxue,
body.dark-mode #wk-fullscreen,
body.dark-mode #textbook-modal,
body.dark-mode #tb-drawer {
  --mk-paper:        #1c1917;
  --mk-paper-edge:   #25211b;
  --mk-paper-warm:   #221d18;
  --mk-ink-deep:     #f1e7d5;
  --mk-ink:          #e6d7b9;
  --mk-ink-soft:     #a89878;
  --mk-cinnabar:     #d8604e;
  --mk-cinnabar-soft:#e8765f;
  --mk-gold:         #d4a030;
  --mk-gold-soft:    #b8902e;
  --mk-line:         #463a29;
  --mk-shadow:       rgba(0, 0, 0, 0.55);
  --mk-blue:         #4878b8;
  --mk-green:        #4a9070;
}

/* ════════════════════════════════════════════════════════════════
   一、左側課文清單（書卷側欄）
   ════════════════════════════════════════════════════════════════ */
body.dark-mode .wenxue-sidebar {
  background:
    radial-gradient(ellipse 90% 30% at 30% 0%, rgba(212,160,48,0.06), transparent 70%),
    var(--mk-paper);
}
.wenxue-nav-item {
  font-family: "Noto Serif TC", serif;
  letter-spacing: 0.1em;
  color: var(--mk-ink);
  border-radius: 2px;
  position: relative;
  transition: all 0.35s cubic-bezier(0.25,0.1,0.25,1);
}
.wenxue-nav-item::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  width: 2.5px; height: 0;
  background: var(--mk-cinnabar);
  transform: translateY(-50%);
  transition: height 0.35s ease;
  border-radius: 1px;
}
.wenxue-nav-item:hover {
  background: rgba(178,34,34,0.05);
  color: var(--mk-cinnabar);
  padding-left: 14px;
}
.wenxue-nav-item:hover::before { height: 60%; }
.wenxue-nav-item.active {
  background: linear-gradient(135deg, var(--mk-cinnabar), var(--mk-cinnabar-soft));
  color: #fff;
  font-weight: 700;
  box-shadow: 0 2px 10px rgba(178,34,34,0.28);
}
.wenxue-nav-item.active::before { height: 0; }
.wenxue-nav-extra {
  border-left: 3px solid var(--mk-gold) !important;
}

/* ════════════════════════════════════════════════════════════════
   二、控制列（課文選單 + 翻頁 + 投影鈕）
   ════════════════════════════════════════════════════════════════ */
.wk-control-bar {
  background: var(--mk-paper);
  border: 1px solid var(--mk-line);
  border-radius: 3px;
  box-shadow: 0 3px 14px var(--mk-shadow);
}
.wk-control-bar select {
  background: var(--mk-paper-warm);
  border: 1px solid var(--mk-line);
  border-radius: 2px;
  color: var(--mk-ink-deep);
  font-family: "Noto Serif TC", serif;
  letter-spacing: 0.08em;
}
.wk-nav-btn:hover {
  background: var(--mk-cinnabar);
  border-color: var(--mk-cinnabar);
  color: #fff;
}
.wk-counter-text {
  color: var(--mk-ink-soft);
  font-family: "Noto Serif TC", serif;
  letter-spacing: 0.1em;
}
/* 投影全螢幕鈕：極細朱砂線框 */
.wk-proj-btn {
  background: transparent;
  border: 1px solid var(--mk-cinnabar);
  color: var(--mk-cinnabar);
  border-radius: 2px;
  font-family: "Noto Serif TC", serif;
  letter-spacing: 0.14em;
  font-weight: 500;
  transition: all 0.35s ease;
}
.wk-proj-btn:hover {
  background: var(--mk-cinnabar);
  color: #fff;
  opacity: 1;
  letter-spacing: 0.2em;
}

/* ════════════════════════════════════════════════════════════════
   三、分頁標籤（封面/作者/背景/課文/修辭/提問）── 極簡細線條
   ════════════════════════════════════════════════════════════════ */
.wk-sec-btn {
  background: transparent;
  border: 1px solid var(--mk-line);
  border-radius: 2px;
  color: var(--mk-ink-soft);
  font-family: "Noto Serif TC", serif;
  letter-spacing: 0.12em;
  font-weight: 500;
  transition: all 0.3s ease;
}
.wk-sec-btn:hover {
  background: rgba(178,34,34,0.06);
  border-color: var(--mk-cinnabar);
  color: var(--mk-cinnabar);
}
.wk-sec-btn.wk-sec-active {
  background: var(--mk-cinnabar);
  border-color: var(--mk-cinnabar);
  color: #fff;
  box-shadow: 0 2px 8px rgba(178,34,34,0.3);
}

/* ════════════════════════════════════════════════════════════════
   四、投影舞台（紙墨光影底）
   ════════════════════════════════════════════════════════════════ */
.wk-slide-area {
  background: var(--mk-paper);
  border: 1px solid var(--mk-line);
  border-radius: 4px;
  box-shadow: 0 8px 30px var(--mk-shadow);
  position: relative;
}
/* 紙緣雙線（古書卷感） */
.wk-slide-area::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid var(--mk-line);
  border-radius: 2px;
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
}
.wk-slide-area > .wk-slide { position: relative; z-index: 1; }

.wk-welcome-title {
  font-family: "Noto Serif TC", serif;
  color: var(--mk-cinnabar);
  letter-spacing: 0.2em;
}
.wk-welcome-sub { color: var(--mk-ink-soft); letter-spacing: 0.06em; }

/* ─── 墨跡淡入：每次切換投影片觸發 ─── */
@keyframes mkInkBloom {
  0%   { opacity: 0; filter: blur(8px); transform: translateY(10px) scale(0.99); }
  60%  { opacity: 0.9; filter: blur(1.5px); }
  100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
}
.mk-ink-in { animation: mkInkBloom 0.55s cubic-bezier(0.25,0.1,0.25,1); }

/* ════════════════════════════════════════════════════════════════
   五、封面（書房窗光 + 雲紋角飾）
   ════════════════════════════════════════════════════════════════ */
.wks-cover {
  background:
    radial-gradient(ellipse 75% 55% at 50% 18%, rgba(200,147,26,0.20), transparent 62%),
    radial-gradient(ellipse 60% 50% at 80% 95%, rgba(178,34,34,0.12), transparent 60%),
    linear-gradient(155deg, #14100a 0%, #2a1d0c 48%, #14100a 100%) !important;
  position: relative;
}
/* 封面四角雲紋（純 CSS 角線） */
.wks-cover::before, .wks-cover::after {
  content: "";
  position: absolute;
  width: 46px; height: 46px;
  border-color: rgba(200,147,26,0.5);
  border-style: solid;
  pointer-events: none;
}
.wks-cover::before { top: 22px; left: 22px; border-width: 2px 0 0 2px; }
.wks-cover::after  { bottom: 22px; right: 22px; border-width: 0 2px 2px 0; }
.wks-cover-dyn {
  color: rgba(212,180,119,0.85) !important;
  letter-spacing: 0.5em !important;
  text-indent: 0.5em;
  font-family: "Noto Serif TC", serif !important;
}
.wks-cover-title {
  color: #d6ad3e !important;
  letter-spacing: 0.22em !important;
  text-shadow: 0 4px 36px rgba(200,147,26,0.4), 0 0 1px rgba(255,235,180,0.5) !important;
}
.wks-cover-author {
  color: rgba(244,240,234,0.9) !important;
  letter-spacing: 0.32em !important;
  text-indent: 0.32em;
}
.wks-cover-sub {
  color: rgba(212,180,119,0.55) !important;
  letter-spacing: 0.12em !important;
}
/* 白話文封面：靛青書房光 */
.wks-cover-prose {
  background:
    radial-gradient(ellipse 75% 55% at 50% 18%, rgba(90,144,208,0.22), transparent 62%),
    linear-gradient(155deg, #0a1628 0%, #18335a 48%, #0a1628 100%) !important;
}
.wks-cover-prose .wks-cover-title { color:#8fb6e0 !important; text-shadow:0 4px 36px rgba(90,144,208,0.4) !important; }
.wks-cover-prose::before, .wks-cover-prose::after { border-color: rgba(143,182,224,0.5); }
/* 選讀古文封面：松墨綠光 */
.wks-cover-extra {
  background:
    radial-gradient(ellipse 75% 55% at 50% 18%, rgba(61,144,104,0.20), transparent 62%),
    linear-gradient(155deg, #08160d 0%, #173a23 48%, #08160d 100%) !important;
}
.wks-cover-extra .wks-cover-title { color:#6cba88 !important; text-shadow:0 4px 36px rgba(61,144,104,0.4) !important; }
.wks-cover-extra::before, .wks-cover-extra::after { border-color: rgba(108,186,136,0.5); }

/* ════════════════════════════════════════════════════════════════
   六、作者 / 背景（絹布頁）
   ════════════════════════════════════════════════════════════════ */
.wks-author { background: var(--mk-paper-warm) !important; }
body.dark-mode .wks-author {
  background:
    radial-gradient(ellipse 80% 40% at 20% 0%, rgba(212,160,48,0.06), transparent 70%),
    var(--mk-paper-warm) !important;
}
/* 段落標籤改為印章紅方牌 */
.wks-section-badge {
  background: transparent !important;
  color: var(--mk-cinnabar) !important;
  border: 1px solid var(--mk-cinnabar);
  border-radius: 1px !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.28em !important;
  text-indent: 0.28em;
  font-weight: 700 !important;
}
.wks-author-text {
  color: var(--mk-ink) !important;
  font-family: "Noto Sans TC", sans-serif !important;
  letter-spacing: 0.04em;
  line-height: 2.05 !important;
}

/* ════════════════════════════════════════════════════════════════
   七、課文頁（雕版印刷 · 呼吸感）
   ════════════════════════════════════════════════════════════════ */
.wks-text { background: var(--mk-paper) !important; }
body.dark-mode .wks-text {
  background:
    radial-gradient(ellipse 70% 45% at 75% 5%, rgba(212,160,48,0.05), transparent 70%),
    var(--mk-paper) !important;
}
/* 原文：深墨 + 加大字距 + 寬鬆行高，左側朱砂句首線 */
.wks-orig {
  color: var(--mk-ink-deep) !important;
  font-family: "Noto Serif TC", "Zen Old Mincho", serif !important;
  letter-spacing: 0.14em !important;
  line-height: 1.95 !important;
  position: relative;
  padding-left: 20px;
}
.wks-orig::before {
  content: "";
  position: absolute;
  left: 0; top: 8%;
  width: 4px; height: 84%;
  background: linear-gradient(to bottom, var(--mk-cinnabar), var(--mk-cinnabar-soft));
  border-radius: 1px;
}
/* 翻譯：金線左框 + 柔和墨褐 */
.wks-trans {
  color: var(--mk-ink-soft) !important;
  font-family: "Noto Sans TC", sans-serif !important;
  letter-spacing: 0.03em;
  line-height: 1.85 !important;
  border-left: 1px solid var(--mk-gold-soft) !important;
  background: linear-gradient(90deg, rgba(176,137,43,0.05), transparent 78%);
  padding: 6px 0 6px 18px !important;
  margin-top: 4px;
}
body.dark-mode .wks-trans { color: var(--mk-ink-soft) !important; }
/* 修辭 callout（內嵌課文頁）：仿信箋 */
.wks-rhetoric-callout {
  background: var(--mk-paper-warm) !important;
  border: 1px solid var(--mk-line) !important;
  border-radius: 2px !important;
  box-shadow: inset 0 0 22px rgba(176,137,43,0.06), 0 2px 8px var(--mk-shadow);
}
.wks-rt-tag {
  
  
  border-radius: 1px !important;
  
  letter-spacing: 0.12em;
  font-weight: 700 !important;
  font-family: "Noto Serif TC", serif !important;
  white-space: nowrap;
  flex-shrink: 0;
}
.wks-rt-ex { color: var(--mk-cinnabar) !important; font-family:"Noto Serif TC",serif !important; }
.wks-rt-note { color: var(--mk-ink-soft) !important; }

/* ════════════════════════════════════════════════════════════════
   八、修辭總覽頁
   ════════════════════════════════════════════════════════════════ */
.wks-rhetoric { background: var(--mk-paper) !important; }
.wks-rh-item {
  background: var(--mk-paper-warm) !important;
  border-left: 3px solid var(--mk-cinnabar) !important;
  border-radius: 2px !important;
  box-shadow: 0 2px 8px var(--mk-shadow);
}
.wks-rh-name { color: var(--mk-cinnabar) !important; font-family:"Noto Serif TC",serif !important; letter-spacing:0.08em; }
.wks-rh-ex { color: var(--mk-ink-deep) !important; font-family:"Noto Serif TC","Zen Old Mincho",serif !important; letter-spacing:0.08em; }
.wks-rh-explain { color: var(--mk-ink-soft) !important; }

/* ════════════════════════════════════════════════════════════════
   九、提問頁（金句信箋 · 課堂討論）
   ════════════════════════════════════════════════════════════════ */
.wks-prompt {
  background:
    radial-gradient(ellipse 70% 55% at 50% 20%, rgba(90,144,208,0.25), transparent 62%),
    linear-gradient(155deg, #0d1f3c 0%, #16335e 48%, #0d1f3c 100%) !important;
  position: relative;
}
.wks-prompt::before, .wks-prompt::after {
  content: "";
  position: absolute;
  width: 40px; height: 40px;
  border-color: rgba(143,182,224,0.45);
  border-style: solid;
  pointer-events: none;
}
.wks-prompt::before { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
.wks-prompt::after  { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }
.wks-prompt-text {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif !important;
  letter-spacing: 0.1em !important;
  line-height: 1.95 !important;
}
.wks-prompt-hint { letter-spacing: 0.4em !important; text-indent: 0.4em; }

/* ════════════════════════════════════════════════════════════════
   十、全螢幕投影（書房夜色）
   ════════════════════════════════════════════════════════════════ */
#wk-fullscreen { background: #100b06 !important; }
body.dark-mode #wk-fullscreen { background: #0a0806 !important; }
.wkfs-header, .wkfs-footer {
  background: rgba(0,0,0,0.6) !important;
  border-color: rgba(200,147,26,0.18) !important;
}
.wkfs-title {
  color: var(--mk-gold) !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.14em;
}
.wkfs-sec-btn {
  background: transparent !important;
  border: 1px solid rgba(200,147,26,0.35) !important;
  border-radius: 2px !important;
  color: var(--mk-gold) !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
}
.wkfs-sec-btn:hover, .wkfs-sec-btn.active {
  background: var(--mk-cinnabar) !important;
  border-color: var(--mk-cinnabar) !important;
  color: #fff !important;
}
.wkfs-ctrl-btn {
  background: transparent !important;
  border: 1px solid rgba(200,147,26,0.35) !important;
  border-radius: 2px !important;
  color: var(--mk-gold) !important;
  transition: all 0.3s ease;
}
.wkfs-ctrl-btn:hover { background: var(--mk-gold) !important; color: #14100a !important; }
.wkfs-close {
  background: transparent !important;
  border: 1px solid var(--mk-cinnabar) !important;
  border-radius: 2px !important;
  color: var(--mk-cinnabar) !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.12em;
  transition: all 0.3s ease;
}
.wkfs-close:hover { background: var(--mk-cinnabar) !important; color: #fff !important; }
.wkfs-nav {
  background: transparent !important;
  border: 1px solid rgba(200,147,26,0.4) !important;
  border-radius: 2px !important;
  color: var(--mk-gold) !important;
  transition: all 0.3s ease;
}
.wkfs-nav:hover { background: var(--mk-gold) !important; color: #14100a !important; border-color: var(--mk-gold) !important; }

/* ════════════════════════════════════════════════════════════════
   十二、課文重點彈窗（tb-*）── 同步墨韻化
   ════════════════════════════════════════════════════════════════ */
#tb-drawer {
  background: var(--mk-paper) !important;
  border-left: 1px solid var(--mk-line) !important;
  box-shadow: -8px 0 32px var(--mk-shadow) !important;
  transition: right 0.45s cubic-bezier(0.25,0.1,0.25,1) !important;
}
body.dark-mode #tb-drawer {
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%, rgba(212,160,48,0.08), transparent 60%),
    var(--mk-paper) !important;
}
.tb-drawer-group {
  font-family: "Noto Serif TC", serif !important;
  color: var(--mk-cinnabar) !important;
  letter-spacing: 0.3em !important; text-indent: 0.3em;
  text-align: center;
  display: flex; align-items: center; gap: 10px;
}
.tb-drawer-group::before, .tb-drawer-group::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(to right, transparent, var(--mk-line), transparent);
}
.tb-drawer-btn {
  display: block !important;
  background: transparent !important;
  border: 1px solid var(--mk-line) !important;
  border-radius: 2px !important;
  color: var(--mk-ink) !important;
  letter-spacing: 0.1em !important;
  position: relative; overflow: hidden;
  transition: all 0.4s cubic-bezier(0.25,0.1,0.25,1) !important;
}
.tb-drawer-btn::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 3px; height: 0; background: var(--mk-cinnabar);
  transform: translateY(-50%); transition: height 0.4s ease;
}
.tb-drawer-btn:hover {
  background: rgba(178,34,34,0.05) !important;
  border-color: var(--mk-cinnabar) !important;
  color: var(--mk-cinnabar) !important;
  padding-left: 20px !important;
}
.tb-drawer-btn:hover::before { height: 62%; }

#textbook-modal {
  background: radial-gradient(ellipse at center, rgba(26,18,9,0.86), rgba(0,0,0,0.94)) !important;
}
#textbook-modal .modal-box {
  background: var(--mk-paper) !important;
  border-radius: 4px !important;
  box-shadow: 0 30px 80px var(--mk-shadow), 0 0 0 1px var(--mk-line) !important;
  animation: mkInkBloom 0.55s cubic-bezier(0.25,0.1,0.25,1) !important;
  position: relative; overflow: hidden;
}
body.dark-mode #textbook-modal .modal-box {
  background:
    radial-gradient(ellipse 80% 55% at 25% 8%, rgba(212,160,48,0.08), transparent 70%),
    radial-gradient(ellipse 60% 50% at 85% 95%, rgba(216,96,78,0.05), transparent 70%),
    var(--mk-paper) !important;
}
#textbook-modal .modal-box::before {
  content: ""; position: absolute; inset: 8px;
  border: 1px solid var(--mk-line); border-radius: 2px;
  opacity: 0.5; pointer-events: none; z-index: 0;
}
.tb-title-bar { border-bottom: 1px solid var(--mk-line) !important; position: relative; z-index: 1; }
.tb-title {
  color: var(--mk-ink-deep) !important;
  letter-spacing: 0.14em !important;
  position: relative; padding-left: 18px;
}
.tb-title::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 4px; height: 72%;
  background: linear-gradient(to bottom, var(--mk-cinnabar), var(--mk-cinnabar-soft));
  transform: translateY(-50%); border-radius: 1px;
}
.tb-close {
  background: transparent !important;
  border: 1.5px solid var(--mk-cinnabar) !important;
  color: var(--mk-cinnabar) !important;
  transition: all 0.35s ease !important;
}
.tb-close:hover {
  background: var(--mk-cinnabar) !important;
  color: var(--mk-paper) !important;
  transform: rotate(90deg);
}
.tb-body {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif !important;
  color: var(--mk-ink) !important;
  letter-spacing: 0.06em;
  position: relative; z-index: 1;
}
.tb-body > p {
  color: var(--mk-ink-deep) !important;
  letter-spacing: 0.1em; line-height: 1.95 !important;
}
.tb-body .tb-note {
  font-family: "Noto Sans TC", sans-serif !important;
  color: var(--mk-ink-soft) !important;
  border-left: 1px solid var(--mk-gold-soft);
  background: linear-gradient(90deg, rgba(176,137,43,0.04), transparent 75%);
  padding: 4px 14px !important; margin: 2px 0 14px 18px !important;
  line-height: 1.75 !important;
}
.tb-body .tb-prompt {
  position: relative;
  background: var(--mk-paper-warm) !important;
  border: none !important; border-radius: 2px !important;
  box-shadow: 0 2px 8px var(--mk-shadow), inset 0 0 0 1px var(--mk-line), inset 0 0 26px rgba(176,137,43,0.06) !important;
  margin: 32px 6px 18px !important; padding: 26px 28px 24px !important;
  font-family: "Noto Serif TC", "Zen Old Mincho", serif !important;
  color: var(--mk-ink-deep) !important; letter-spacing: 0.08em;
}
.tb-body .tb-prompt::before {
  content: ""; position: absolute; top: 0; right: 0;
  width: 24px; height: 24px;
  background: linear-gradient(-135deg, transparent 0 49%, var(--mk-line) 50%, var(--mk-paper-edge) 51%, var(--mk-paper) 100%);
}
.tb-close-bot {
  background: transparent !important;
  border: 1px solid var(--mk-cinnabar) !important;
  border-radius: 2px !important;
  color: var(--mk-cinnabar) !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.3em !important; text-indent: 0.3em;
  transition: all 0.35s ease !important;
}
.tb-close-bot:hover {
  background: var(--mk-cinnabar) !important; color: var(--mk-paper) !important;
  letter-spacing: 0.5em !important; text-indent: 0.5em;
}
.textbook-btn {
  background: transparent !important;
  border: 1px solid var(--blue) !important;
  border-radius: 2px !important;
  font-family: "Noto Serif TC", serif !important;
  letter-spacing: 0.1em;
  transition: all 0.35s ease !important;
}
.textbook-btn:hover { background: var(--blue) !important; color: #fff !important; letter-spacing: 0.16em; }

/* ─── 優雅捲軸（限投影系統與彈窗） ─── */
.wenxue-sidebar::-webkit-scrollbar, .tb-body::-webkit-scrollbar, #tb-drawer::-webkit-scrollbar { width: 5px; }
.wenxue-sidebar::-webkit-scrollbar-thumb, #tb-drawer::-webkit-scrollbar-thumb { background: var(--mk-line); border-radius: 3px; }
.tb-body::-webkit-scrollbar-thumb { background: var(--mk-gold-soft); border-radius: 3px; }
.tb-body::-webkit-scrollbar-track, .wenxue-sidebar::-webkit-scrollbar-track, #tb-drawer::-webkit-scrollbar-track { background: transparent; }

/* ════════════════════════════════════════════════════════════════
   ██  古文逐句精講 · 細分頁樣式（墨韻今生）
   作用範圍：.wks-focus / .wks-words / .wks-srhet / .wks-meaning
            / .wks-segsum / .wks-structure
   讓學生「先專注眼前句子，最後看清結構」
   ════════════════════════════════════════════════════════════════ */

/* ── 共用：句子小標（出現在字詞/修辭/句意頁頂部，提醒當前在講哪句） ── */
.wks-mini-orig {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif;
  
  font-weight: 700;
  color: var(--mk-ink-deep, #211710);
  letter-spacing: 0.1em;
  
  
  
  border-bottom: 1px solid var(--mk-line, #cabb96);
  position: relative;
}
.wks-mini-orig::before {
  content: "";
  position: absolute;
  left: 0; top: 4px; bottom: 18px;
  width: 4px;
  background: linear-gradient(to bottom, var(--mk-cinnabar, #b22222), var(--mk-cinnabar-soft, #cf5a48));
  border-radius: 1px;
}

/* ════════════════════════════════════════════════════════════════
   ① 句子聚焦頁（最大字，極簡，專注）
   ════════════════════════════════════════════════════════════════ */
.wks-focus {
  background: var(--mk-paper, #f4f0ea) !important;
  align-items: flex-start; justify-content: center;
  text-align: left; gap: 26px; padding: 52px 56px;
  position: relative;
}
.wks-focus .wks-focus-tag { align-self: flex-start; }
.wks-focus .wks-focus-orig { text-align: left; max-width: 100%; }
.wks-focus .wks-focus-hint { align-self: flex-start; }
body.dark-mode .wks-focus {
  background:
    radial-gradient(ellipse 80% 50% at 50% 20%, rgba(212,160,48,0.07), transparent 70%),
    var(--mk-paper, #1c1917) !important;
}
.wks-focus-tag {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 0.82);
  color: var(--mk-cinnabar, #b22222);
  letter-spacing: 0.3em; text-indent: 0.3em;
  border: 1px solid var(--mk-cinnabar, #b22222);
  padding: 3px 16px; border-radius: 1px;
}
.wks-focus-orig {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif;
  
  font-weight: 700;
  color: var(--mk-ink-deep, #211710);
  letter-spacing: 0.16em;
  line-height: 2.1;
  max-width: 760px;
}
.wks-focus-hint {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.78);
  color: var(--mk-ink-soft, #6b5a42);
  letter-spacing: 0.2em;
}
#wk-fullscreen .wks-focus-orig {  }

/* ════════════════════════════════════════════════════════════════
   ② 字詞頁（字音 / 字形 / 字義）
   ════════════════════════════════════════════════════════════════ */
.wks-words, .wks-srhet, .wks-meaning {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 38px 48px; justify-content: flex-start; gap: 0;
}
body.dark-mode .wks-words,
body.dark-mode .wks-srhet,
body.dark-mode .wks-meaning {
  background:
    radial-gradient(ellipse 70% 40% at 80% 5%, rgba(212,160,48,0.05), transparent 70%),
    var(--mk-paper, #1c1917) !important;
}
.wks-word-list { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.wks-word-row {
  display: flex; align-items: baseline; gap: 16px;
  
  background: var(--mk-paper-warm, #f7f2e6);
  border-left: 3px solid var(--mk-gold, #b0892b);
  border-radius: 2px;
}
body.dark-mode .wks-word-row { background: var(--mk-paper-warm, #221d18); }
.wks-word-key {
  flex-shrink: 0;
  font-family: "Noto Serif TC", "Zen Old Mincho", serif;
  
  font-weight: 700;
  color: var(--mk-cinnabar, #b22222);
  letter-spacing: 0.08em;
  
}
.wks-word-def {
  flex: 1;
  font-family: "Noto Sans TC", sans-serif;
  
  color: var(--mk-ink, #33271a);
  
}
#wk-fullscreen .wks-word-key {  }
#wk-fullscreen .wks-word-def {  }

/* ════════════════════════════════════════════════════════════════
   ③ 單句修辭頁
   ════════════════════════════════════════════════════════════════ */
.wks-srhet-list { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.wks-srhet-item {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding: 13px 18px;
  
  border: 1px solid var(--mk-line, #cabb96);
  border-radius: 2px;
  box-shadow: inset 0 0 20px rgba(176,137,43,0.05);
}
body.dark-mode .wks-srhet-item {  }
.wks-srhet-note {
  font-family: "Noto Sans TC", sans-serif;
  
  color: var(--mk-ink, #33271a);
  
}
#wk-fullscreen .wks-srhet-note {  }

/* ════════════════════════════════════════════════════════════════
   ④ 句意頁（語譯＋補注）
   ════════════════════════════════════════════════════════════════ */
.wks-meaning-trans {
  font-family: "Noto Sans TC", sans-serif;
  
  color: var(--mk-ink, #33271a);
  
  letter-spacing: 0.03em;
  padding: 4px 0 0 18px;
  border-left: 1px solid var(--mk-gold-soft, #d4b577);
  background: linear-gradient(90deg, rgba(176,137,43,0.05), transparent 78%);
}
.wks-meaning-note {
  margin-top: 20px;
  padding: 14px 18px;
  background: var(--mk-paper-warm, #f7f2e6);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.84);
  color: var(--mk-ink-soft, #6b5a42);
  line-height: 1.75;
}
body.dark-mode .wks-meaning-note { background: var(--mk-paper-warm, #221d18); }
.wks-note-label {
  display: inline-block;
  background: var(--mk-blue, #1e4d8c);
  color: #fff;
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size)*0.8);
  letter-spacing: 0.2em; text-indent: 0.2em;
  padding: 1px 10px; border-radius: 1px;
  margin-right: 10px;
  vertical-align: middle;
}
#wk-fullscreen .wks-meaning-trans {  }

/* ════════════════════════════════════════════════════════════════
   段旨頁
   ════════════════════════════════════════════════════════════════ */
.wks-segsum {
  background:
    radial-gradient(ellipse 70% 55% at 50% 20%, rgba(176,137,43,0.10), transparent 62%),
    linear-gradient(155deg, #2a2012 0%, #3a2c18 48%, #2a2012 100%) !important;
  align-items: center; justify-content: center;
  text-align: center; gap: 22px; padding: 52px 52px;
}
.wks-segsum-tag {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 0.85);
  color: rgba(212,180,119,0.85);
  letter-spacing: 0.4em; text-indent: 0.4em;
}
.wks-segsum-title {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.5);
  font-weight: 900;
  color: #d6ad3e;
  letter-spacing: 0.14em;
}
.wks-segsum-body {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 1.0);
  color: rgba(244,240,234,0.9);
  line-height: 2.0;
  letter-spacing: 0.04em;
  max-width: 680px;
  text-align: left;
}
#wk-fullscreen .wks-segsum-title { font-size: calc(var(--base-size) * 1.9); }
#wk-fullscreen .wks-segsum-body { font-size: calc(var(--base-size) * 1.15); }

/* ════════════════════════════════════════════════════════════════
   結構表頁（看清文章結構與邏輯）
   ════════════════════════════════════════════════════════════════ */
.wks-structure {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 34px 44px; justify-content: flex-start; gap: 0;
  overflow-y: auto;
}
body.dark-mode .wks-structure { background: var(--mk-paper, #1c1917) !important; }
.wks-st-title {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.4);
  font-weight: 900;
  color: var(--mk-ink-deep, #211710);
  letter-spacing: 0.16em;
  text-align: center;
  margin-bottom: 22px;
  position: relative;
  padding-bottom: 14px;
}
.wks-st-title::after {
  content: "";
  position: absolute;
  left: 50%; bottom: 0;
  width: 60px; height: 2px;
  background: var(--mk-cinnabar, #b22222);
  transform: translateX(-50%);
}
.wks-st-groups { display: flex; flex-direction: column; gap: 16px; }
.wks-st-group {
  border-radius: 2px; overflow: hidden;
  border: 1px solid var(--mk-line, #cabb96);
}
.wks-st-head {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.0);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.14em; text-indent: 0.14em;
  padding: 9px 18px;
}
.wks-st-gold .wks-st-head { background: linear-gradient(135deg, #b0892b, #d4b577); }
.wks-st-cinnabar .wks-st-head { background: linear-gradient(135deg, #b22222, #cf5a48); }
.wks-st-green .wks-st-head { background: linear-gradient(135deg, #2d6a4a, #4a9070); }
.wks-st-blue .wks-st-head { background: linear-gradient(135deg, #1e4d8c, #4878b8); }
.wks-st-table { width: 100%; border-collapse: collapse; }
.wks-st-table th {
  width: 30%;
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 0.9);
  font-weight: 700;
  color: var(--mk-ink-deep, #211710);
  background: var(--mk-paper-warm, #f7f2e6);
  text-align: left;
  vertical-align: top;
  padding: 10px 16px;
  border-top: 1px solid var(--mk-line, #cabb96);
  letter-spacing: 0.06em;
}
.wks-st-table td {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif;
  font-size: calc(var(--base-size) * 0.92);
  color: var(--mk-ink, #33271a);
  line-height: 1.75;
  padding: 10px 16px;
  border-top: 1px solid var(--mk-line, #cabb96);
  letter-spacing: 0.05em;
}
body.dark-mode .wks-st-table th { background: var(--mk-paper-warm, #221d18); }
.wks-st-theme {
  margin-top: 22px;
  padding: 16px 20px;
  background: var(--mk-paper-warm, #f7f2e6);
  border-left: 3px solid var(--mk-cinnabar, #b22222);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.92);
  color: var(--mk-ink, #33271a);
  line-height: 1.85;
}
body.dark-mode .wks-st-theme { background: var(--mk-paper-warm, #221d18); }
#wk-fullscreen .wks-structure { padding: 40px 80px; }
#wk-fullscreen .wks-st-table th { font-size: calc(var(--base-size) * 1.0); }
#wk-fullscreen .wks-st-table td { font-size: calc(var(--base-size) * 1.02); }

/* 行動裝置 */
@media (max-width: 700px) {
  .wks-focus-orig { font-size: calc(var(--base-size) * 1.4) !important; letter-spacing: 0.08em; }
  .wks-words, .wks-srhet, .wks-meaning, .wks-structure { padding: 24px 20px; }
  .wks-word-row { flex-direction: column; gap: 4px; }
  .wks-st-table th { width: 38%; }
}

/* ════════════════════════════════════════════════════════════════
   ██  延伸頁（題解/作者/賞析/跨閱 + 課堂提問 + 歷屆考題 + 概念圖）
   ════════════════════════════════════════════════════════════════ */

/* ── 資訊頁（題解/作者/賞析/跨閱） ── */
.wks-info {
  background: var(--mk-paper-warm, #f7f2e6) !important;
  padding: 38px 48px; justify-content: flex-start; gap: 0;
  overflow-y: auto;
}
body.dark-mode .wks-info {
  background:
    radial-gradient(ellipse 80% 35% at 20% 0%, rgba(212,160,48,0.05), transparent 70%),
    var(--mk-paper-warm, #221d18) !important;
}
.wks-info-head {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.32);
  font-weight: 900;
  color: var(--mk-ink-deep, #211710);
  letter-spacing: 0.12em;
  margin: 16px 0 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--mk-line, #cabb96);
}
.wks-info-body {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.98);
  color: var(--mk-ink, #33271a);
  line-height: 2.0;
  letter-spacing: 0.03em;
}
.wks-info-body b { color: var(--mk-cinnabar, #b22222); font-weight: 700; }
/* 不同 kind 用不同左邊強調色 */
.wks-info-intro .wks-info-head { border-bottom-color: var(--mk-gold, #b0892b); }
.wks-info-author .wks-info-head { border-bottom-color: var(--mk-cinnabar, #b22222); }
.wks-info-appreciation { background: var(--mk-paper, #f4f0ea) !important; }
.wks-info-appreciation .wks-info-head { border-bottom-color: var(--mk-blue, #1e4d8c); }
.wks-info-thinking {
  background:
    radial-gradient(ellipse 70% 50% at 50% 15%, rgba(90,144,208,0.16), transparent 62%),
    linear-gradient(155deg, #0d1f3c 0%, #16335e 48%, #0d1f3c 100%) !important;
}
.wks-info-thinking .wks-info-head { color: #d6e4f5; border-bottom-color: rgba(143,182,224,0.4); }
.wks-info-thinking .wks-info-body { color: rgba(244,240,234,0.92); }
.wks-info-thinking .wks-info-body b { color: #8fb6e0; }
.wks-info-thinking .wks-section-badge { color: #8fb6e0 !important; border-color: #8fb6e0 !important; }
#wk-fullscreen .wks-info-head { font-size: calc(var(--base-size) * 1.55); }
#wk-fullscreen .wks-info-body { font-size: calc(var(--base-size) * 1.12); }

/* ── 課堂提問頁 ── */
.wks-question {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 44px 52px; justify-content: center; gap: 24px;
}
body.dark-mode .wks-question { background: var(--mk-paper, #1c1917) !important; }
.wks-q-tag {
  align-self: flex-start;
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 0.82);
  color: var(--mk-cinnabar, #b22222);
  letter-spacing: 0.2em;
  border: 1px solid var(--mk-cinnabar, #b22222);
  padding: 3px 14px; border-radius: 1px;
}
.wks-q-text {
  font-family: "Noto Serif TC", "Zen Old Mincho", serif;
  font-size: calc(var(--base-size) * 1.25);
  font-weight: 700;
  color: var(--mk-ink-deep, #211710);
  letter-spacing: 0.06em;
  line-height: 1.9;
}
.wks-q-ansbox {
  position: relative; cursor: pointer;
  border-radius: 2px;
  min-height: 80px;
}
.wks-q-cover {
  display: flex; align-items: center; justify-content: center;
  padding: 22px;
  background: var(--mk-paper-warm, #f7f2e6);
  border: 1px dashed var(--mk-gold, #b0892b);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.9);
  color: var(--mk-ink-soft, #6b5a42);
  letter-spacing: 0.1em;
  transition: opacity 0.3s;
}
body.dark-mode .wks-q-cover { background: var(--mk-paper-warm, #221d18); }
.wks-q-ans {
  display: none;
  padding: 20px 22px;
  background: var(--mk-paper-warm, #f7f2e6);
  border-left: 3px solid var(--mk-green, #2d6a4a);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.96);
  color: var(--mk-ink, #33271a);
  line-height: 1.95;
}
body.dark-mode .wks-q-ans { background: var(--mk-paper-warm, #221d18); }
.wks-q-ansbox.show .wks-q-cover { display: none; }
.wks-q-ansbox.show .wks-q-ans { display: block; }
#wk-fullscreen .wks-q-text { font-size: calc(var(--base-size) * 1.5); }
#wk-fullscreen .wks-q-ans { font-size: calc(var(--base-size) * 1.1); }

/* ── 歷屆考題頁 ── */
.wks-exam {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 34px 48px; justify-content: flex-start; gap: 18px;
  overflow-y: auto;
}
body.dark-mode .wks-exam { background: var(--mk-paper, #1c1917) !important; }
.wks-exam-tag {
  align-self: flex-start;
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 0.82);
  color: #fff; background: var(--mk-blue, #1e4d8c);
  letter-spacing: 0.18em;
  padding: 3px 14px; border-radius: 1px;
}
.wks-exam-stem {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.98);
  color: var(--mk-ink-deep, #211710);
  line-height: 1.95;
  letter-spacing: 0.02em;
}
.wks-exam-ansbox { position: relative; cursor: pointer; }
.wks-exam-reveal { display: none; }
.wks-exam-ansbox.show .wks-q-cover { display: none; }
.wks-exam-ansbox.show .wks-exam-reveal { display: block; }
.wks-exam-ans {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.05);
  color: var(--mk-cinnabar, #b22222);
  font-weight: 700;
  margin-bottom: 12px;
}
.wks-exam-exp {
  padding: 16px 18px;
  background: var(--mk-paper-warm, #f7f2e6);
  border-left: 3px solid var(--mk-blue, #1e4d8c);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.9);
  color: var(--mk-ink, #33271a);
  line-height: 1.85;
}
body.dark-mode .wks-exam-exp { background: var(--mk-paper-warm, #221d18); }
#wk-fullscreen .wks-exam-stem { font-size: calc(var(--base-size) * 1.08); }
#wk-fullscreen .wks-exam-exp { font-size: calc(var(--base-size) * 1.0); }

/* ── 概念圖 ── */
.wks-concept {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 34px 48px; justify-content: flex-start;
}
body.dark-mode .wks-concept { background: var(--mk-paper, #1c1917) !important; }
.wks-concept-list { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.wks-concept-item {
  padding: 16px 20px;
  background: var(--mk-paper-warm, #f7f2e6);
  border-left: 3px solid var(--mk-gold, #b0892b);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.96);
  color: var(--mk-ink, #33271a);
  line-height: 1.85;
}
body.dark-mode .wks-concept-item { background: var(--mk-paper-warm, #221d18); }
#wk-fullscreen .wks-concept-item { font-size: calc(var(--base-size) * 1.08); }

/* 行動裝置 */
@media (max-width: 700px) {
  .wks-info, .wks-exam, .wks-concept, .wks-question { padding: 24px 20px; }
  .wks-q-text { font-size: calc(var(--base-size) * 1.05) !important; }
}

/* 課前引導：松墨綠書房光 */
.wks-info-lead {
  background:
    radial-gradient(ellipse 70% 50% at 50% 15%, rgba(61,144,104,0.16), transparent 62%),
    linear-gradient(155deg, #08160d 0%, #173a23 48%, #08160d 100%) !important;
}
.wks-info-lead .wks-info-head { color:#9ed8b4; border-bottom-color:rgba(108,186,136,0.4); }
.wks-info-lead .wks-info-body { color:rgba(244,240,234,0.92); }
.wks-info-lead .wks-section-badge { color:#9ed8b4 !important; border-color:#9ed8b4 !important; }
/* 延伸閱讀：絹布頁 */
.wks-info-reading { background: var(--mk-paper-warm,#f7f2e6) !important; }
.wks-info-reading .wks-info-head { border-bottom-color: var(--mk-green,#2d6a4a); }
/* 影音資源 */
.wks-info-media .wks-info-head { border-bottom-color: var(--mk-cinnabar,#b22222); }

/* ════════════════════════════════════════════════════════════════
   ██  古文逐句五層分色（依老師指示）
   字義→藍   注釋→豬肝紅   修辭→綠   句意→紫   翻譯→棕墨
   並統一放大字級、縮小頁間落差
   ════════════════════════════════════════════════════════════════ */

/* 局部色票 */
#tab-wenxue, #wk-fullscreen {
  --L-gloss:    #1f6fb2;   /* 補充字義 藍 */
  --L-gloss-bg: rgba(31,111,178,0.08);
  --L-book:     #7a2e2e;   /* 注釋 豬肝紅 */
  --L-book-bg:  rgba(122,46,46,0.07);
  --L-rhet:     #c0392b;   /* 修辭 紅 */
  --L-rhet-bg:  rgba(192,57,43,0.09);
  --L-mean:     #2d7a4f;   /* 句意 綠 */
  --L-mean-bg:  rgba(45,122,79,0.09);
  --L-supp:     #7c4da0;   /* 補充說明 紫 */
  --L-zhi:      #d2691e;   /* 段旨段析 橘 */
  --L-zhi-bg:   rgba(210,105,30,0.10);
  --L-supp-bg:  rgba(124,77,160,0.09);
  --L-trans:    #6b5a42;   /* 翻譯 棕墨 */
}
body.dark-mode #tab-wenxue, body.dark-mode #wk-fullscreen {
  --L-gloss:    #6cb0e8;
  --L-gloss-bg: rgba(108,176,232,0.12);
  --L-book:     #d98a8a;
  --L-book-bg:  rgba(217,138,138,0.10);
  --L-rhet:     #e8776a;
  --L-rhet-bg:  rgba(232,119,106,0.12);
  --L-mean:     #6cc28d;
  --L-mean-bg:  rgba(108,194,141,0.12);
  --L-supp:     #c3a0e0;
  --L-zhi:      #f0a868;
  --L-zhi-bg:   rgba(240,168,104,0.13);
  --L-supp-bg:  rgba(195,160,224,0.12);
  --L-trans:    #c9b89a;
}

/* ── 統一原句小標字級（各分層頁頂部）字大一點、各頁一致 ── */
.wks-mini-orig {
  font-size: calc(var(--base-size) * 1.42) !important;
  line-height: 1.85 !important;
  padding: 0 0 16px 20px !important;
  margin-bottom: 22px !important;
}
#wk-fullscreen .wks-mini-orig { font-size: calc(var(--base-size) * 1.72) !important; }

/* ── 字級統一放大（字義/注釋的詞條） ── */
.wks-word-key { font-size: calc(var(--base-size) * 1.24) !important; min-width: 5em !important; }
.wks-word-def { font-size: calc(var(--base-size) * 1.08) !important; line-height: 1.85 !important; }
#wk-fullscreen .wks-word-key { font-size: calc(var(--base-size) * 1.42) !important; }
#wk-fullscreen .wks-word-def { font-size: calc(var(--base-size) * 1.2) !important; }
.wks-word-row { padding: 13px 18px !important; }

/* ════════ 字義（藍）════════ */
.wks-badge-gloss { color: var(--L-gloss) !important; border-color: var(--L-gloss) !important; }
.wks-gloss-row { border-left-color: var(--L-gloss) !important; background: var(--L-gloss-bg) !important; }
.wks-gloss-row .wks-word-key { color: var(--L-gloss) !important; }
.wks-layer-gloss .wks-mini-orig::before { background: var(--L-gloss) !important; }

/* ════════ 注釋（豬肝紅，學生不用抄）════════ */
.wks-layer-booknote { background: var(--L-book-bg) !important; padding: 30px 46px !important; }
body.dark-mode .wks-layer-booknote { background: var(--L-book-bg) !important; }
.wks-booknote-hint {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.92);
  color: var(--L-book);
  background: var(--L-book-bg);
  border: 1px dashed var(--L-book);
  border-radius: 2px;
  padding: 9px 16px; margin-bottom: 18px;
  letter-spacing: 0.06em; text-align: center;
}
.wks-booknote-row { border-left-color: var(--L-book) !important; background: var(--L-book-bg) !important; }
.wks-booknote-row .wks-word-key { color: var(--L-book) !important; }
.wks-booknote-row .wks-word-def { color: var(--mk-ink-soft, #6b5a42) !important; }
#wk-fullscreen .wks-booknote-hint { font-size: calc(var(--base-size) * 1.0); }

/* ════════ 修辭（綠）════════ */
.wks-badge-rhet {   }
.wks-srhet-item { border-left: 3px solid var(--L-rhet) !important; border-top: none !important; border-right: none !important; border-bottom: none !important;  }
body.dark-mode .wks-srhet-item { background: var(--L-rhet-bg) !important; }
.wks-rt-tag { background: var(--L-rhet) !important; color: #fff !important; }
.wks-srhet-note { font-size: calc(var(--base-size) * 1.04) !important; line-height: 1.85 !important; }
#wk-fullscreen .wks-srhet-note { font-size: calc(var(--base-size) * 1.18) !important; }
.wks-layer-rhet .wks-mini-orig::before {  }

/* ════════ 句意（紫）════════ */
.wks-badge-mean {   }
.wks-meaning-body {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 1.1);
  color: var(--mk-ink, #33271a);
  line-height: 2.0;
  letter-spacing: 0.03em;
  padding: 6px 0 0 20px;
  border-left: 3px solid var(--L-mean);
  
}
body.dark-mode .wks-meaning-body { color: var(--mk-ink, #e6d7b9); }
#wk-fullscreen .wks-meaning-body { font-size: calc(var(--base-size) * 1.28); }
.wks-layer-mean .wks-mini-orig::before {  }

/* ════════ 翻譯（棕墨）════════ */
.wks-badge-trans { color: var(--L-trans) !important; border-color: var(--L-trans) !important; }
.wks-meaning-trans {
  font-size: calc(var(--base-size) * 1.16) !important;
  line-height: 2.0 !important;
  border-left-color: var(--mk-gold-soft, #d4b577) !important;
}
#wk-fullscreen .wks-meaning-trans { font-size: calc(var(--base-size) * 1.32) !important; }
.wks-layer-trans .wks-mini-orig::before { background: var(--L-trans) !important; }

/* ── 句子聚焦頁字級（與其他頁落差不要太大）── */
.wks-focus-orig { font-size: calc(var(--base-size) * 1.95) !important; }
#wk-fullscreen .wks-focus-orig { font-size: calc(var(--base-size) * 2.4) !important; }

/* ── 段落 badge 統一字級 ── */
.wks-section-badge { font-size: calc(var(--base-size) * 0.92) !important; padding: 4px 16px !important; }

/* ── 朗讀頁螢光筆 ── */
.wks-info-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wks-book-page { margin-left:auto; font-family:"Noto Serif TC",serif; font-size:calc(var(--base-size)*0.78); color:var(--mk-ink-soft,#6b5a42); font-weight:700; white-space:nowrap; letter-spacing:.05em; }
.wks-hl-toggle {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--mk-gold, #b0892b);
  color: var(--mk-gold, #b0892b);
  border-radius: 2px;
  font-family: "Noto Sans TC", sans-serif;
  font-size: 12px; letter-spacing: 0.1em;
  padding: 4px 12px; cursor: pointer;
  transition: all 0.3s;
}
.wks-hl-toggle:hover, .wks-hl-toggle.active { background: var(--mk-gold, #b0892b); color: #fff; }
/* 螢光筆：預設就顯示（淡黃塗抹），開啟「螢光筆」鈕則更鮮明 */
.wks-hl {
  background: linear-gradient(transparent 55%, rgba(255,221,87,0.55) 55%);
  padding: 0 2px; border-radius: 1px;
  transition: background 0.3s;
}
body.dark-mode .wks-hl {
  background: linear-gradient(transparent 55%, rgba(212,160,48,0.4) 55%);
  color: #fff;
}
.wks-hl-on .wks-hl {
  background: linear-gradient(transparent 30%, rgba(255,210,60,0.85) 30%);
  font-weight: 700;
}
body.dark-mode .wks-hl-on .wks-hl {
  background: linear-gradient(transparent 30%, rgba(212,160,48,0.7) 30%);
}
.wks-info-thinking .wks-hl, .wks-info-lead .wks-hl {
  background: linear-gradient(transparent 55%, rgba(143,182,224,0.45) 55%);
  color: #fff;
}

/* ── 重要修辭專頁 ── */
.wks-keyrhet {
  background: var(--mk-paper, #f4f0ea) !important;
  padding: 36px 50px; justify-content: flex-start; gap: 0; overflow-y: auto;
}
body.dark-mode .wks-keyrhet { background: var(--mk-paper, #1c1917) !important; }
.wks-kr-head {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 22px; padding-bottom: 14px;
  border-bottom: 2px solid var(--L-rhet, #2d7a4f);
}
.wks-kr-name {
  font-family: "Noto Serif TC", serif;
  font-size: calc(var(--base-size) * 1.5);
  font-weight: 900; color: var(--L-rhet, #2d7a4f);
  letter-spacing: 0.14em;
}
.wks-kr-name::before { content: "◆ "; font-size: 0.7em; }
.wks-kr-sub {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 0.92);
  color: #fff; background: var(--L-rhet, #2d7a4f);
  padding: 3px 14px; border-radius: 2px; letter-spacing: 0.1em;
}
.wks-kr-body {
  font-family: "Noto Sans TC", sans-serif;
  font-size: calc(var(--base-size) * 1.12);
  color: var(--mk-ink, #33271a); line-height: 2.05; letter-spacing: 0.03em;
}
.wks-kr-body b { color: var(--L-rhet, #2d7a4f); font-weight: 700; }
body.dark-mode .wks-kr-body { color: var(--mk-ink, #e6d7b9); }
#wk-fullscreen .wks-kr-name { font-size: calc(var(--base-size) * 1.8); }
#wk-fullscreen .wks-kr-body { font-size: calc(var(--base-size) * 1.3); }

/* ── 修辭自我評量答案遮蔽 ── */
.wks-selfq-box { position: relative; cursor: pointer; margin-top: 18px; }
.wks-selfq-reveal { display: none; padding: 16px 18px; background: var(--mk-paper-warm, #f7f2e6); border-left: 3px solid var(--L-rhet, #2d7a4f); border-radius: 2px; line-height: 1.9; }
body.dark-mode .wks-selfq-reveal { background: var(--mk-paper-warm, #221d18); }
.wks-selfq-box.show .wks-q-cover { display: none; }
.wks-selfq-box.show .wks-selfq-reveal { display: block; }
.wks-selfq-reveal b { color: var(--L-rhet, #2d7a4f); }

/* ════════ 瑞媛的國文教學 · 獨立站頂部 ════════ */
* { box-sizing: border-box; }
.site-header {
  background: linear-gradient(135deg, #1a1209 0%, #2a1d0c 50%, #1a1209 100%);
  color: var(--gold); padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; position: relative; overflow: hidden;
}
.site-header::after {
  content: "文"; position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
  font-family: "Noto Serif TC", serif; font-size: 120px; font-weight: 900;
  color: rgba(200,147,26,0.06); pointer-events: none;
}
.site-title {
  font-family: "Noto Serif TC", serif; font-size: clamp(20px,3.4vw,30px);
  font-weight: 900; letter-spacing: 0.14em; color: #d6ad3e;
  text-shadow: 0 2px 20px rgba(200,147,26,0.3);
}

/* 韻腳 */

/* 句意（綠）與修辭（紅） */

  font-size:0.85em; padding:1px 10px; border-radius:2px; margin-right:9px; }

   transition:background 0.3s; }

}

/* ════════ 整合課文頁 v2：右側注釋欄、字級、提問 ════════ */

.aq-subwrap, .aq-sub { margin:9px 0; padding:9px 13px; border-radius:3px;

/* ════════ 平板投影優化（無滑鼠、無鍵盤）════════ */
/* 1. 所有可點元素加大觸控區、明顯回饋 */
.tp-n, .tp-g, .tp-lb, .tp-b, .jy-blank, .iq-opt, .aq-opt, .wq-opt,
.hd-box, .hd-sup, .tp-abox, .wk-abox, .as-cell, .as-a, .ah-a, .wk-tans,
.aq-trbox, .jy-toggle-all, .as-all, .aq-jump, .pian-slot {
  -webkit-tap-highlight-color: rgba(176,137,43,0.25);
  touch-action: manipulation;
}
.tp-lb, .tp-b, .as-all, .jy-toggle-all { min-height: 38px; padding-top:7px; padding-bottom:7px; }
.iq-opt, .aq-opt, .wq-opt { min-height: 46px; }
.tp-n { padding: 2px 3px; }          /* 注釋編號加大可點範圍 */
.tp-g { padding: 2px 2px; }
/* 2. hover 效果同步套用到 :active（觸控按下） */
.tp-lb:active, .tp-b:active, .as-all:active, .jy-toggle-all:active,
.iq-opt:active, .aq-opt:active, .wq-opt:active, .as-cell:active {
  filter: brightness(0.92);
}
/* 3. 觸控裝置移除 hover 專屬效果，避免「點一下卡住」 */
@media (hover: none) {
  .tp-lb:hover, .tp-b:hover, .as-all:hover, .jy-toggle-all:hover,
  .iq-opt:hover, .aq-opt:hover, .wq-opt:hover, .as-cell:hover,

    transform: none; opacity: inherit;

  #cls-tab { opacity: 0.85; }
  #cls-tab:hover { padding-right: 5px; }
  .sec-mark { opacity: 0.55; }
}
/* 4. 全螢幕翻頁鈕加大（平板好按） */

.wk-nav-btn { min-width: 46px; min-height: 40px; }

.wks-charbian .rt-def { border-left-color: var(--L-gloss,#1f6fb2); }

/* 紫色補充（點開顯示） */
.tp-p { color: var(--L-supp,#7c4da0); cursor:pointer; border-bottom:1px dashed var(--L-supp,#7c4da0); }

<style id="v50-apple-pencil-priority">
/* v50：Apple Pencil 優先繪圖；畫記開啟時，手指不觸發文字選取 */
#wk-ink-layer.active,
#wk-ink-layer.active #wk-ink-canvas{
  -webkit-user-select:none!important;
  user-select:none!important;
  -webkit-touch-callout:none!important;
  touch-action:none!important;
  -webkit-touch-action:none!important;
}

/* 畫記開啟時，整個課文內容不接受瀏覽器的長按選取；
   仍保留按鈕、浮框等既有互動。 */
#wk-fullscreen.ink-mode,
#wk-fullscreen.ink-mode *{
  -webkit-user-select:none!important;
  user-select:none!important;
  -webkit-touch-callout:none!important;
}
</style>

<script id="v50-apple-pencil-priority">
(function(){
  function setup(){
    var fs=document.getElementById('wk-fullscreen');
    var layer=document.getElementById('wk-ink-layer');
    var canvas=document.getElementById('wk-ink-canvas');
    if(!fs||!layer||!canvas||canvas.dataset.v50)return;
    canvas.dataset.v50='1';

    function active(){
      return layer.classList.contains('active');
    }

    function sync(){
      fs.classList.toggle('ink-mode',active());
      canvas.style.touchAction=active()?'none':'auto';
      canvas.style.webkitTouchAction=active()?'none':'auto';
    }

    /* 先攔截瀏覽器手勢，再讓原本的畫筆程式處理 pointer。 */
    ['pointerdown','pointermove','pointerup','pointercancel',
     'touchstart','touchmove','touchend','touchcancel',
     'contextmenu','dragstart','selectstart'].forEach(function(type){
      canvas.addEventListener(type,function(e){
        if(!active())return;
        if(type==='pointerdown' || type==='pointermove' ||
           type==='pointerup' || type==='pointercancel' ||
           type.indexOf('touch')===0 || type==='contextmenu' ||
           type==='dragstart' || type==='selectstart'){
          if(e.cancelable)e.preventDefault();
        }
        if(type!=='pointerup' && type!=='pointercancel')e.stopPropagation();
      },{passive:false});
    });

    /* 畫記開啟期間，阻止課文長按選取/拖曳；點擊事件不攔截，
       所以原本的句意、字義、補充等按鈕仍可使用。 */
    fs.addEventListener('selectstart',function(e){
      if(active() && e.target!==canvas)e.preventDefault();
    },true);
    fs.addEventListener('contextmenu',function(e){
      if(active() && e.target!==canvas)e.preventDefault();
    },true);
    fs.addEventListener('dragstart',function(e){
      if(active())e.preventDefault();
    },true);

    /* 監看既有 wkInkToggle() 對 active class 的切換。 */
    new MutationObserver(sync).observe(layer,{attributes:true,attributeFilter:['class']});
    sync();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',setup);
  }else{
    setup();
  }
})();
</script>
