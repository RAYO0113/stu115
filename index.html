    rhetTable: {"mine": ["引用", "轉品", "映襯", "類疊", "錯綜", "回文", "意謂動詞"], "pages": [{"name": "引用", "own": true, "body": "<div class=\"rt-def\">1.釋義：語文中援用別人的話或詩詞、典故、成語、俗語等，稱為引用。<br>2.說明：可用來印證、補充、對照作者的本意，藉以增強文章或說話的說服力和感染力。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">明引</th><td>明白指出所引用的話出自何處，稱為「明引」。</td><td><span class=\"rt-hit\">孔子曰：「三人行，則必有我師。」（韓愈〈師說〉）</span></td></tr><tr><th class=\"jy-th\">暗用</th><td>引用時不曾指明出處，稱為「暗用」。</td><td>接連便是難懂的話，什麼「君子固窮」，什麼「者乎」之類，引得眾人都哄笑起來。──「君子固窮」出自《論語‧魏靈公》。（魯迅〈孔乙己〉）</td></tr></table>"}, {"name": "轉品", "own": true, "body": "<div class=\"rt-def\">釋義：語句中的詞彙改變其原來的詞性，使含意更新穎豐富，表達更靈活生動的修辭法，稱為轉品。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td><span class=\"rt-hit\">1.「師」道之不傳也久矣。──「師」字名詞作形容詞用。（韓愈〈師說〉）<br>2.夜大「雪」。──「雪」字名詞作動詞用。（劉義慶〈雪夜訪戴〉）<br>3.「落」英繽紛。──「落」字動詞作形容詞用。（陶淵明〈桃花源記〉）<br>4.而方才幻燈片上的山水忽然之間都「遙遠」了。──「遙遠」二字形容詞作動詞用。（張曉風〈詠物篇〉）</span></td></tr></table>"}, {"name": "映襯", "own": true, "body": "<div class=\"rt-def\">1.釋義：在語文中，把兩種不同的，特別是相反的觀念或事實，貫串或對列起來，兩相比較，互為襯托的修辭法，稱為映襯。<br>2.說明：映襯可使語氣增強，使意義更加明顯。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">對襯</th><td>把兩種或兩組不同的人、事、物放在一起，加以對比、烘托、形容、描寫。</td><td><span class=\"rt-hit\">古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師。是故聖益聖，愚益愚。（韓愈〈師說〉）</span></td></tr><tr><th class=\"jy-th\">雙襯</th><td>把同一個人、事、物的雙重性質、相對現象，放在一起，使之凸顯。</td><td>孔乙己沒有法，便免不了偶然做些偷竊的事。但他在我們店裡，品行卻比別人都好，就是從不拖欠。（魯迅〈孔乙己〉）</td></tr><tr><th class=\"jy-th\">反襯</th><td>對於一種事物，用恰恰與這種事物的現象或本質相反的語詞加以描寫。</td><td>孔乙己是這樣的使人快活，可是沒有他，別人也便這麼過。（魯迅〈孔乙己〉）</td></tr></table>"}, {"name": "類疊", "own": true, "body": "<div class=\"rt-def\">1.釋義：同一個字、詞、語、句，或接連、或間隔，重複使用的修辭法，稱為類疊。<br>2.說明：用來加強語氣，使講話行文更具有節奏感。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">疊字</th><td>同一字詞連續使用。</td><td>青青河畔草，綿綿思遠道。（〈飲馬長城窟行〉）</td></tr><tr><th class=\"jy-th\">類字</th><td>同一字詞間隔使用。</td><td>1.不違農時，穀不可勝食也；數罟不入洿池，魚鱉不可勝食也；斧斤以時入山林，材木不可勝用也。（〈王道之始〉）<br>2.只有我們自己知道，現在不等於過去，如同過去不等於現在，無論如何我們都回不去了。（周芬伶〈牛仔褲〉）</td></tr><tr><th class=\"jy-th\">類句</th><td>同一語句間隔使用。</td><td><span class=\"rt-hit\">生乎吾前，「其聞道也」，固先乎吾，「吾從而師之」；生乎吾後，「其聞道也」，亦先乎吾，「吾從而師之」。（韓愈〈師說〉）</span></td></tr></table>"}, {"name": "錯綜", "own": true, "body": "<div class=\"rt-def\">1.釋義：凡把形式整齊的句式，故意使其形式參差的修辭法，稱為錯綜。<br>2.說明：排比與對偶表現整齊之美，錯綜則側重變化之美。錯綜可分為五類：交蹉語次、抽換詞面、調整語法、伸縮文句、變化句式。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td><span class=\"rt-hit\">句讀之不知，惑之不解，或師焉，或不焉。——交蹉語次。（韓愈〈師說〉）</span></td></tr></table>"}, {"name": "回文", "own": true, "body": "<div class=\"rt-def\">釋義：上下兩句或句組，詞彙部分相同，而詞序大致相反的辭格。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td><span class=\"rt-hit\">是故弟子不必不如師，師不必賢於弟子。（韓愈〈師說〉）</span></td></tr></table>"}, {"name": "意謂動詞", "own": true, "body": "<div class=\"rt-def\">意動用法中，主要由名詞和形容詞作意謂性動詞，用以表達內心想法或感受，但作為意謂動詞時可視為轉品修辭，為方便理解，通常可語譯為「以……為……」。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td><span class=\"rt-hit\">「恥」學於師。（韓愈〈師說〉）</span></td></tr></table>"}, {"name": "設問", "own": false, "body": "<div class=\"rt-def\">1.釋義：講話行文，不採直述方式，而刻意用設計問題的方式或詰問語氣的修辭法，稱為設問。<br>2.說明：藉以凸顯論點，引起注意，甚或啟發思考，而使話語、文章激起波瀾。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">疑問\n（懸問）</th><td>內心確有疑問的設問，不知答案。</td><td>1.很多人不免擔憂，那人類能做什麼呢？（李開復〈AI時代，有思想的人生更出色〉）<br>2.如有博施於民，而能濟眾，何如？可謂仁乎？（〈博施濟眾〉）</td></tr><tr><th class=\"jy-th\">激問\n（反問）</th><td>為激發本意而問，其答案在問題的反面。</td><td>既有凌霄之姿，何肯為人作耳目近玩？（劉義慶〈支公好鶴〉）</td></tr><tr><th class=\"jy-th\">提問</th><td>為提起下文而發問，答案在提問之後。</td><td>不多不多！多乎哉？不多也。（魯迅〈孔乙己〉）</td></tr></table>"}, {"name": "摹寫", "own": false, "body": "<div class=\"rt-def\">1.釋義：對自己感受到的各種境況和情況，特別是其中的色彩、形狀、聲音、氣味、觸感等，恰如其實地加以形容描述，稱為摹寫。<br>2.說明：用形象化的語言，將感官的知覺相互挪用的修辭法稱為「移覺」，又稱「通感」。如以聽覺去摹寫視覺等。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>1.臺北街頭，處處綠意盎然。車子載著我在路面上輕快駛過，窗外樹影斑駁，美得像夢一樣不真實。──視覺。（李開復〈AI時代，有思想的人生更出色〉）<br>2.那花極纖細，連香氣也是纖細的。──以視覺寫嗅覺。（張曉風〈詠物篇〉）</td></tr></table>"}, {"name": "析字", "own": false, "body": "<div class=\"rt-def\">1.釋義：說話或行文時，刻意就文字的形、音、義加以分析的修辭法，稱為析字。<br>2.說明：在字形上，或刻意離合、減損文字的形體；在聲音方面，可借同音之字，或將兩字合音；於意義上，可藉由聯想而牽附，也可利用引伸或假借而演化。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>黃絹，色絲也，於字為「絕」。幼婦，少女也，於字為「妙」。外孫，女子也，於字為「好」。臼，受辛也，於字為「辤」。（劉義慶〈絕妙好辭〉）</td></tr></table>"}, {"name": "婉曲", "own": false, "body": "<div class=\"rt-def\">釋義：說話或行文時，不直接講出本意，只用委婉曲折的言詞，含蓄地烘托或暗示出本意來，稱為婉曲。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>不足為外人道也。──委婉表達不願被外界打擾。（陶淵明〈桃花源記〉）</td></tr></table>"}, {"name": "誇飾", "own": false, "body": "<div class=\"rt-def\">1.釋義：語文中誇張鋪飾，超過了客觀事實的修辭法，稱為誇飾。<br>2.說明：誇飾能使所表達的形象益發凸顯，情意更為鮮明，藉以加深讀者的印象。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>1.若有幸遭遇一碗美味的麵，真想為它唱一夜的頌歌；如果不慎吃到難以下嚥的麵，則會沮喪好幾天。（焦桐〈論牛肉麵〉）<br>2.相迎不道遠，直至長風沙。（李白〈長干行〉）</td></tr></table>"}, {"name": "示現", "own": false, "body": "<div class=\"rt-def\">1.釋義：在語文中，利用人類的想像力，把看不到、聽不到的事物或景象，描寫得如見、如聞的修辭法，稱為示現。<br>2.說明：藉由示現，使讀者感官如見、如聞，因而產生情緒上的共鳴。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">追述示現</th><td>把過去的事情說得彷彿還在眼前一樣。</td><td>妾髮初覆額，折花門前劇。郎騎竹馬來，遶牀弄青梅。同居長干里，兩小無嫌猜。十四為君婦，羞顏未嘗開。低頭向暗壁，千喚不一回。十五始展眉，願同塵與灰。（李白〈長干行〉）</td></tr><tr><th class=\"jy-th\">懸想示現</th><td>把想像的事情說得彷彿真的在眼前一般。</td><td></td></tr><tr><th class=\"jy-th\">預言示現</th><td>將未來的事情描述得彷彿已經發生在眼前一樣。</td><td>早晚下三巴，預將書報家。相迎不道遠，直至長風沙。（李白〈長干行〉）</td></tr></table>"}, {"name": "譬喻", "own": false, "body": "<div class=\"rt-def\">1.釋義：譬喻是一種「借彼喻此」的修辭法。通常以易知說明難知，以具體形容抽象，化平淡為生動，化繁複為簡易。<br>2.說明：譬喻的構成要素有三：<br>(1)本體：所要說明的事物主體。<br>(2)喻詞：連接本體和喻體的詞語。<br>(3)喻體：用來比方的事物。（不可省略，是譬喻中最重要的成分）</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">明喻</th><td>凡本體、喻詞、喻體三者具備的譬喻。常用喻詞有「猶」、「若」、「如」、「似」、「像」、「好像」、「如同」、「彷彿」等。</td><td>1.那窘狀彷彿走在臺北的紅磚道上，冷不防會有汙水從磚縫中濺上褲管。（焦桐〈論牛肉麵〉）<br>2.木棉花幾乎就像是從乾裂的傷口裡吐出來的火焰。（張曉風〈詠物篇〉）</td></tr><tr><th class=\"jy-th\">隱喻\n（暗喻）</th><td>凡具備本體、喻體，而喻詞由繫詞或準繫詞如「是」、「為」、「成」、「作」、「乃」、「皆」等代替者。</td><td>每團木棉都是晴空上折翼的雲。（張曉風〈詠物篇〉）</td></tr><tr><th class=\"jy-th\">略喻</th><td>凡省略喻詞，只有本體、喻體的譬喻。</td><td>自罹患癌症以來，走過死亡陰影的幽谷。（李開復〈AI時代，有思想的人生更出色〉）</td></tr><tr><th class=\"jy-th\">借喻</th><td>凡將本體、喻詞省略，只剩下喻體的譬喻。</td><td>它有一樹美麗的四言。（張曉風〈詠物篇〉）</td></tr><tr><th class=\"jy-th\">博喻\n（連比）</th><td>本體只有一個，卻用許多喻體來形容說明的譬喻。</td><td></td></tr></table>"}, {"name": "借代", "own": false, "body": "<div class=\"rt-def\">1.釋義：談話或行文中，放棄通常使用的本名或語句，而另外找其他與本名密切相關的名稱或語句來代替，稱為借代。<br>2.說明：借代除了使文辭新奇有趣之外，還可以凸顯事物的特徵，使要表達的命意更為適切、細膩、深刻。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>1.黃髮垂髫。——借指「老人、幼童」。（陶淵明〈桃花源記〉）<br>2.短衣幫。——借指「勞動者」。（魯迅〈孔乙己〉）</td></tr></table>"}, {"name": "轉化", "own": false, "body": "<div class=\"rt-def\">1.釋義：描述一件事物時，轉變其原來性質，化成另一種與本質截然不同的事物，而加以形容描述的修辭法，稱為轉化。<br>2.說明：轉化是就兩件不同事物的可變處著筆；譬喻則是就兩件不同事物的相似點著筆。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">擬人化</th><td>擬物為人，人性化。</td><td>一碗高尚的牛肉麵常有著欲言又止的表情。——「欲言又止的表情」使「牛肉麵」人性化。（焦桐〈論牛肉麵〉）</td></tr><tr><th class=\"jy-th\">擬物化</th><td>擬人為物，物性化。</td><td></td></tr><tr><th class=\"jy-th\">形象化</th><td>擬虛為實。利用「擬人為人」或「擬物為物」的手段，使原本抽象的事物或觀念，投入具體的形象，亦即使人或物具有他人或他物的特質。</td><td>我才不及卿，乃覺三十里。——「三十里」將「才智的差距」形象化。（劉義慶〈絕妙好辭〉）</td></tr></table>"}, {"name": "雙關", "own": false, "body": "<div class=\"rt-def\">釋義：一語同時關涉、照顧到兩種不同事物或兼具兩種意涵的修辭法。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">諧音雙關</th><td>一個字除了本字所含的意義外，又兼含另一個與本字音同或音近字的意義。</td><td></td></tr><tr><th class=\"jy-th\">詞義雙關</th><td>一個字除了本字所含的意義外，又兼含另一個與本字音同或音近字的意義。</td><td>青青河畔草，綿綿思遠道。（〈飲馬長城窟行〉）</td></tr><tr><th class=\"jy-th\">句義雙關</th><td>一個字除了本字所含的意義外，又兼含另一個與本字音同或音近字的意義。</td><td></td></tr></table>"}, {"name": "對偶", "own": false, "body": "<div class=\"rt-def\">釋義：語文中，兩兩相對，字數相等、句法相似、詞性相同，有時還講究平仄相對的修辭法，稱為對偶。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>1.芳草鮮美，落英繽紛。——單句對。（陶淵明〈桃花源記〉）<br>2.養生喪死。──句中對。（〈王道之始〉）</td></tr></table>"}, {"name": "排比", "own": false, "body": "<div class=\"rt-def\">1.釋義：用三個或三個以上結構相似、語氣一致、字數大致相等的語句，表達相同範圍、性質的事物或意象，稱為排比。<br>2.說明：排比可增強語勢、深化感情，並可使所訴說的理由更為明確，造成極好的表達效果。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>1.人之所以為人，正是因為我們有感情、會思考、懂生死。<br>（李開復〈AI時代，有思想的人生更出色〉）<br>2.老者安之，朋友信之，少者懷之。（〈盍各言爾志〉）</td></tr></table>"}, {"name": "層遞", "own": false, "body": "<div class=\"rt-def\">釋義：凡要說的有三件或三件以上的事物，而這些事物有大小、輕重、深淺、強弱、長短、遠近等比例，在說話行文時，依序層層遞進，稱為層遞。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>管理之本就是管人，管人就是要管心，管心就是管己，管己之<br>根就是待人。（李昌鈺〈化不可能為可能〉）</td></tr></table>"}, {"name": "頂針", "own": false, "body": "<div class=\"rt-def\">1.釋義：用上一句結尾的詞彙，作下一句的起頭，稱為頂針。<br>2.說明：頂針讓鄰接的句子頭尾藉同一詞彙的蟬聯，使文句結構緊密、語意連貫，而有上遞下接的趣味。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>復前行，欲窮其林。林盡水源，便得一「山」。「山」有小口，彷彿若有光。（陶淵明〈桃花源記〉）</td></tr></table>"}, {"name": "鑲嵌", "own": false, "body": "<div class=\"rt-def\">1.釋義：凡是在語句的頭尾或中間，故意插入虛字、數目字、特定字、同義或異義字來拉長文句的修辭法，稱為鑲嵌。<br>2.說明：鑲嵌能使語氣舒緩，或委婉含蓄，或使語義更鮮明、語趣更豐富。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>上言加餐食，下言長相憶。（〈飲馬長城窟行〉）</td></tr></table>"}, {"name": "倒裝", "own": false, "body": "<div class=\"rt-def\">釋義：語文中特意顛倒複詞詞素、句子成分或複句的通常次序，而語法型態或關係卻未改變的，稱為倒裝。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>未之有也。——「未有之也」的倒裝。（〈王道之始〉）</td></tr></table>"}, {"name": "致使動詞", "own": false, "body": "<div class=\"rt-def\">句中省略「使」、「令」等動詞，直接把兼語（主詞兼受詞）後面的動詞挪至兼語之前，使它具有「致使」的意思。凡是具有這種功能的動詞，便稱「致使動詞」，也稱「役動詞」或「使令動詞」、「使役動詞」。通常可語譯為「使……○○」。</div><table class=\"jy-table\"><tr><th class=\"jy-th-full\" colspan=\"3\">類別 ｜ 定義 ｜ 例句</th></tr><tr><th class=\"jy-th\">—</th><td>—</td><td>老者「安」之，朋友「信」之，少者「懷」之。（〈盍各言爾志〉）</td></tr></table>"}]},
    
    title: '中唐 韓愈〈師說〉',
    keyRhetoric: [{"name": "錯綜", "pages": [{"sub": "定義與四種類型", "body": "<div class=\"rt-def\">將文句中形式整齊的行句故意變化，使文句的形式參差，產生<b>錯落有致</b>之美，稱為「錯綜」。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"3\">類型 ｜ 定義 ｜ 例句</th></tr>\n<tr><th class=\"jy-th\">(一)<br>抽換詞面</th><td>以同義的詞語取代形式整齊句子中的某些詞語。</td>\n<td>惠王用張儀之計，<b>拔</b>三川之地，西<b>并</b>巴、蜀，北<b>收</b>上郡，南<b>取</b>漢中，<b>包</b>九夷，<b>制</b>鄢、郢，東<b>據</b>成皋之險，<b>割</b>膏腴之壤。（李斯〈諫逐客書〉）<br><span class='bk-note'>拔、并、收、取、包、制、據、割皆為「取得」之同義詞。</span></td></tr>\n<tr><th class=\"jy-th\">(二)<br>交錯語次</th><td>上下兩句語詞的次序，故意弄得參差不齊。</td>\n<td><span class=\"rt-hit\">【本課】句讀之不知，惑之不解，或師焉，或不焉。（韓愈〈師說〉）</span><br><span class='bk-note'>詳見下頁動畫演示。</span></td></tr>\n<tr><th class=\"jy-th\">(三)<br>伸縮文身</th><td>把字數相等的句子，故意布置成字數不等，使長句短句交相錯雜。</td>\n<td>野芳發而幽香，佳木秀而繁陰，<b>風霜高潔</b>，水落而石出者，山間之四時也。（歐陽脩〈醉翁亭記〉）<br>春天像一篇巨製的駢儷文，<b>而夏天像一首絕句</b>。（簡媜〈夏之絕句〉）</td></tr>\n<tr><th class=\"jy-th\">(四)<br>變化句式</th><td>將肯定句與否定句、直述句與疑問句，穿插寫入。</td>\n<td>婚後生活<b>不是</b>磚，<b>不是</b>石，<b>不是</b>泥，<b>不是</b>沙，<b>而是</b>容忍，<b>是</b>體貼，<b>是</b>寬恕，<b>是</b>犧牲。<br>那榆蔭下的一潭，<b>不是</b>清泉，<b>是</b>天上虹。（徐志摩〈再別康橋〉）</td></tr>\n</table>"}, {"sub": "交蹉語次動畫①〈師說〉", "body": "<div class=\"rt-def\">〈師說〉：「句讀之不知，惑之不解，或師焉，或不焉。」<br>\n作者刻意把 <b>1‧2</b> / <b>3‧4</b> 的整齊配對，交錯成 <b class=\"cuo-hl\">1‧3‧2‧4</b>。<br>\n點下方按鈕，看它<b>一步一步還原</b>成 1‧2‧3‧4。</div>\n<div class=\"cuo2\" data-set=\"A\">\n  <div class=\"cuo2-stage\">\n    <div class=\"cuo2-lbl\">課文原句</div>\n    <div class=\"cuo2-row\">\n      <span class=\"cuo2-c\" data-n=\"1\">句讀之不知<i>1</i></span>\n      <span class=\"cuo2-c\" data-n=\"3\">惑之不解<i>3</i></span>\n      <span class=\"cuo2-c\" data-n=\"2\">或師焉<i>2</i></span>\n      <span class=\"cuo2-c\" data-n=\"4\">或不焉<i>4</i></span>\n    </div>\n  </div>\n  <div class=\"cuo2-ctrl\">\n    <button class=\"cuo2-btn\" onclick=\"cuoStep(this)\">▶ 下一步</button>\n    <button class=\"cuo2-btn cuo2-rst\" onclick=\"cuoReset(this)\">↻ 重來</button>\n    <span class=\"cuo2-tip\"></span>\n  </div>\n  <div class=\"cuo2-res\">\n    <div class=\"cuo2-lbl cuo2-lbl2\">還原後（整齊配對）</div>\n    <div class=\"cuo2-row cuo2-final\">\n      <span class=\"cuo2-c cuo2-g1\" data-n=\"1\">句讀之不知<i>1</i></span>\n      <span class=\"cuo2-c cuo2-g1\" data-n=\"2\">或師焉<i>2</i></span>\n      <span class=\"cuo2-sep\">／</span>\n      <span class=\"cuo2-c cuo2-g2\" data-n=\"3\">惑之不解<i>3</i></span>\n      <span class=\"cuo2-c cuo2-g2\" data-n=\"4\">或不焉<i>4</i></span>\n    </div>\n    <div class=\"cuo2-exp\">「句讀之不知」配「或師焉」（<b>1‧2</b>）；「惑之不解」配「或不焉」（<b>3‧4</b>）。<br>\n    作者刻意交錯成 <b>1‧3‧2‧4</b>，使語勢參差、避免呆板，這就是<b>交蹉語次</b>。</div>\n  </div>\n</div>"}, {"sub": "交蹉語次動畫②〈赤壁賦〉", "body": "<div class=\"rt-def\">蘇軾〈赤壁賦〉：「惟江上之清風，與山間之明月，耳得之而為聲，目遇之而成色。」<br>\n同樣是 <b class=\"cuo-hl\">1‧3‧2‧4</b> 的交蹉語次。</div>\n<div class=\"cuo2\" data-set=\"B\">\n  <div class=\"cuo2-stage\">\n    <div class=\"cuo2-lbl\">課文原句</div>\n    <div class=\"cuo2-row\">\n      <span class=\"cuo2-c\" data-n=\"1\">惟江上之清風<i>1</i></span>\n      <span class=\"cuo2-c\" data-n=\"3\">與山間之明月<i>3</i></span>\n      <span class=\"cuo2-c\" data-n=\"2\">耳得之而為聲<i>2</i></span>\n      <span class=\"cuo2-c\" data-n=\"4\">目遇之而成色<i>4</i></span>\n    </div>\n  </div>\n  <div class=\"cuo2-ctrl\">\n    <button class=\"cuo2-btn\" onclick=\"cuoStep(this)\">▶ 下一步</button>\n    <button class=\"cuo2-btn cuo2-rst\" onclick=\"cuoReset(this)\">↻ 重來</button>\n    <span class=\"cuo2-tip\"></span>\n  </div>\n  <div class=\"cuo2-res\">\n    <div class=\"cuo2-lbl cuo2-lbl2\">還原後（整齊配對）</div>\n    <div class=\"cuo2-row cuo2-final\">\n      <span class=\"cuo2-c cuo2-g1\" data-n=\"1\">惟江上之清風<i>1</i></span>\n      <span class=\"cuo2-c cuo2-g1\" data-n=\"2\">耳得之而為聲<i>2</i></span>\n      <span class=\"cuo2-sep\">／</span>\n      <span class=\"cuo2-c cuo2-g2\" data-n=\"3\">與山間之明月<i>3</i></span>\n      <span class=\"cuo2-c cuo2-g2\" data-n=\"4\">目遇之而成色<i>4</i></span>\n    </div>\n    <div class=\"cuo2-exp\">「江上之清風」配「耳得之而為聲」（<b>1‧2</b>，<b>聽覺</b>）；<br>\n    「山間之明月」配「目遇之而成色」（<b>3‧4</b>，<b>視覺</b>）。<br>\n    交錯成 <b>1‧3‧2‧4</b>，使句式錯落有致。</div>\n  </div>\n</div>"}]}, {"name": "回文", "pages": [{"sub": "定義", "body": "上下兩句，詞彙大多相同，而詞序恰好相反（或循環往復），這種修辭叫「回文」（又作「迴文」）。<br><br><b>作用：</b>形成往復迴環的趣味，加強語意的辯證與對照。"}, {"sub": "〈師說〉的例子", "body": "「<b>弟子不必不如師，師不必賢於弟子</b>」——「弟子」與「師」前後位置互換，循環相對。<br><br><b>同類名句：</b><br>· 開車不喝酒，喝酒不開車<br>· 讀書不忘救國，救國不忘讀書<br>· 文章是案頭之山水，山水是地上之文章"}]}, {"name": "意動用法", "pages": [{"sub": "定義", "body": "意動用法是文言「詞類活用」的一種。指謂語在主觀意念上「<b>認為賓語怎麼樣</b>」或「<b>把賓語當作什麼</b>」，客觀上不一定真的如此。<br><br>常見翻譯公式：<br>· 認為（覺得）＋賓語＋……<br>· 以＋賓語＋為＋……<br><br>※ 只限<b>形容詞</b>和<b>名詞</b>活用。"}, {"sub": "〈師說〉的例子", "body": "<b>形容詞意動「恥」：</b><br>· 「於其身也，則<b>恥</b>師焉」——以從師問學為恥。<br>· 「不<b>恥</b>相師」——不以互相學習為恥。<br><br><b>名詞意動「師」：</b><br>· 「吾從而<b>師</b>之」——把他當作老師。<br><br><b>辨析：</b>「不恥」是「不以……為恥」（意動）；「不齒」（轉品，名→動）是「不屑與之同列」。兩者意思不同。"}]}, {"name": "映襯", "pages": [{"sub": "三種類型", "body": "<div class=\"rt-def\">把兩種不同的、特別是<b>相反</b>的觀念或事實對列起來兩相比較，使語氣增強、意義更為明顯，稱為「映襯」。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"3\">類型 ｜ 定義 ｜ 本課例句</th></tr>\n<tr><th class=\"jy-th\">對襯</th><td>對<b>兩種不同</b>的人事物，從相反觀點加以描述。</td>\n<td><span class=\"rt-hit\">【本課】古之聖人，其出人也遠矣，猶且從師而問焉；今之眾人，其下聖人也亦遠矣，而恥學於師。</span><br>\n<span class=\"rt-hit\">【本課】巫、醫、樂師、百工之人，不恥相師；士大夫之族……則群聚而笑之。</span><br>\n<span class=\"rt-hit\">【本課】愛其子，擇師而教之；於其身也，則恥師焉。</span></td></tr>\n<tr><th class=\"jy-th\">反襯</th><td>對<b>同一</b>人事物，用與其現象或本質<b>相反</b>的詞語描寫。</td>\n<td><span class=\"rt-hit\">【本課】君子不齒，今其智乃反不能及。</span>──君子本應見識高，卻反不如百工。<br>· 蟬噪林逾靜，鳥鳴山更幽。（王籍〈入若耶溪〉）</td></tr>\n<tr><th class=\"jy-th\">雙襯</th><td>針對<b>同一</b>人事物，從兩種不同觀點形容，結果適成其反。</td>\n<td>· 他是一個活著沉默，但卻死得勇敢的人。（逯耀東〈揮手〉）<br>· 只因為這是生命中最沉重也是最甜蜜的負荷。（吳晟〈負荷〉）</td></tr>\n</table>"}]}, {"name": "設問", "pages": [{"sub": "三種類型", "body": "<div class=\"rt-def\">講話行文時，忽然變平敘的語氣為<b>詢問的語氣</b>，藉以引起注意、強調本意，稱為「設問」。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"4\">類型 ｜ 定義 ｜ 判斷關鍵 ｜ 本課例句</th></tr>\n<tr><th class=\"jy-th\">提問</th><td>提起下文而<b>自問自答</b>。</td><td>有問有答</td>\n<td>· 你知道中國最有名的人是誰？提起此人，人人皆曉……（胡適〈差不多先生傳〉）</td></tr>\n<tr><th class=\"jy-th\">激問<br>（反問）</th><td>激發本意，<b>問而不答</b>，答案在問題的<b>反面</b>。</td><td>有問無答，反過來就是答案</td>\n<td><span class=\"rt-hit\">【本課】孰能無惑？</span>──人人皆有惑。<br>\n<span class=\"rt-hit\">【本課】夫庸知其年之先後生於吾乎？</span>──不必計較年齡。<br>\n<span class=\"rt-hit\">【本課】其皆出於此乎？</span>──語帶推測，實為肯定。</td></tr>\n<tr><th class=\"jy-th\">懸問<br>（疑問）</th><td>作者<b>內心確有疑惑</b>，不知答案。</td><td>有問無答，真的不知道</td>\n<td>· 聰明的，你告訴我，我們的日子為什麼一去不復返呢？（朱自清〈匆匆〉）</td></tr>\n</table>"}]}, {"name": "轉品", "pages": [{"sub": "本課大量運用", "body": "<div class=\"rt-def\">一個詞彙在語文中，<b>改變了原來的詞性</b>，稱為「轉品」。<br>〈師說〉全文以「師」字為文眼，轉品運用極為密集。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th-full\" colspan=\"3\">轉變 ｜ 說明 ｜ 本課例句</th></tr>\n<tr><th class=\"jy-th\">名→動</th><td>「師」由名詞（老師）轉為動詞（學習／以…為師）</td>\n<td><span class=\"rt-hit\">吾從而<b>師</b>之</span>（以…為師）<br><span class=\"rt-hit\">吾<b>師</b>道也</span>（學習）<br>\n<span class=\"rt-hit\">不恥相<b>師</b></span>（學習）<br><span class=\"rt-hit\">孔子<b>師</b>郯子</span>（以…為師）</td></tr>\n<tr><th class=\"jy-th\">名→形</th><td>「師」轉為形容詞</td>\n<td><span class=\"rt-hit\"><b>師</b>道之不傳也久矣</span>（從師問學的）</td></tr>\n<tr><th class=\"jy-th\">名→動</th><td>「齒」本為名詞（牙齒），轉為動詞（並列）</td>\n<td><span class=\"rt-hit\">君子不<b>齒</b></span>（不屑與之並列）</td></tr>\n<tr><th class=\"jy-th\">形→意動</th><td>「恥」轉為意動用法「以……為恥」</td>\n<td><span class=\"rt-hit\"><b>恥</b>學於師</span>／<span class=\"rt-hit\">則<b>恥</b>師焉</span>／<span class=\"rt-hit\">不<b>恥</b>相師</span></td></tr>\n</table>"}]}, {"name": "頂針", "pages": [{"sub": "定義與本課例", "body": "<div class=\"rt-def\">前一句的<b>末字（詞）</b>，作為後一句的<b>首字（詞）</b>，上遞下接、蟬聯而下，稱為「頂針」（又稱頂真、聯珠）。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th\">本課例</th>\n<td><span class=\"rt-hit\">弟子不必不如<b>師</b>，<b>師</b>不必賢於弟子。</span><br>\n<span class=\"rt-hit\">請學於<b>余</b>，<b>余</b>嘉其能行古道。</span></td></tr>\n<tr><th class=\"jy-th\">他篇例</th><td>· 歸來見天子，天子坐明堂。（〈木蘭詩〉）<br>\n· 林盡水源，便得一山；山有小口。（陶淵明〈桃花源記〉）<br>\n· 名不正則言不順，言不順則事不成。（《論語‧子路》）</td></tr>\n</table>"}]}, {"name": "類疊", "pages": [{"sub": "定義與本課例", "body": "<div class=\"rt-def\">同一個字、詞、語、句，接二連三反覆使用，稱為「類疊」。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th\">本課例</th>\n<td><span class=\"rt-hit\">無貴無賤、無長無少</span>──「無……無……」反覆<br>\n<span class=\"rt-hit\">聖益聖，愚益愚</span>──句式相疊<br>\n<span class=\"rt-hit\">生乎吾前……生乎吾後……</span>──句型反覆</td></tr>\n<tr><th class=\"jy-th\">作用</th><td>加強語勢、凸顯對比、使文氣充沛。</td></tr>\n</table>"}]}, {"name": "引用", "pages": [{"sub": "明引與暗引", "body": "<div class=\"rt-def\">援用他人的話或典故，以加強說服力，稱為「引用」。<br><b>明引</b>：指明出處或說話者。<b>暗引</b>：不指明出處，融入行文。</div>\n<table class=\"jy-table\">\n<tr><th class=\"jy-th\">明引（本課）</th>\n<td><span class=\"rt-hit\">孔子曰：「三人行，則必有我師。」</span><br>\n<span class='bk-note'>語出《論語‧述而》：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」</span></td></tr>\n<tr><th class=\"jy-th\">暗引（本課）</th>\n<td><span class=\"rt-hit\">人非生而知之者</span><br>\n<span class='bk-note'>語本《論語‧述而》：「我非生而知之者，好古敏以求之者也。」未指明出處。</span><br>\n<span class=\"rt-hit\">聖人無常師</span><br>\n<span class='bk-note'>語本《論語‧子張》：「夫子焉不學？而亦何常師之有？」</span></td></tr>\n</table>"}]}],
        notesPages: [{"seg": "第一段", "rows": [{"w": "學者", "d": "此指學習的人。"}, {"w": "師者，所以傳道、受業、解惑也", "d": "老師是傳授道理、講授學業、解除疑惑的人。所以，用以。業，古代書寫文字的木板，此指下文的「六藝經傳」。解惑，解決「道」和「業」兩方面的疑難。"}, {"w": "之", "d": "代詞，指上文的「道」與「業」。"}, {"w": "其為惑也", "d": "指那些疑惑的問題。"}]}, {"seg": "第二段", "rows": [{"w": "乎", "d": "介詞，於、在。"}, {"w": "聞道", "d": "明瞭道理。聞，聽聞，引申為理解、明瞭。"}, {"w": "師道", "d": "學習道理。"}]}, {"seg": "第三段", "rows": [{"w": "師道", "d": "指從師問學的傳統。"}, {"w": "出人", "d": "超出一般人。"}, {"w": "問焉", "d": "向老師請教。焉，猶「之」，代詞，指老師。"}, {"w": "下", "d": "不如、不及。"}, {"w": "恥學於師", "d": "以從師問學為恥。恥，意動用法，以……為恥。"}, {"w": "所以", "d": "何以、為什麼。"}, {"w": "其", "d": "推測語氣，大概、或許。"}]}, {"seg": "第四段", "rows": [{"w": "恥師", "d": "以從師問學為恥。"}, {"w": "惑", "d": "糊塗、不懂事理。"}]}, {"seg": "第五段", "rows": [{"w": "巫醫", "d": "指巫師和醫生。巫，音ㄨ，指接神除邪的人。"}, {"w": "樂師", "d": "以歌唱、奏樂為業的人。樂，音ㄩㄝˋ。師，指有專門技藝的人。"}, {"w": "百工", "d": "從事各種技藝的人。"}, {"w": "不恥相師", "d": "不以互相學習為恥。"}, {"w": "云者", "d": "語助詞，表語氣的停頓。"}, {"w": "君子", "d": "在上位者，即前文的「士大夫之族」。"}, {"w": "不齒", "d": "不屑與之同列。齒，本義為牙齒，在此有並列之意。"}, {"w": "不恥", "d": "不認為可恥。如：不恥下問。"}]}, {"seg": "第六段", "rows": [{"w": "常師", "d": "固定的老師。"}, {"w": "萇弘", "d": "東周敬王時大夫。《孔子家語》記載孔子曾向萇弘請教古樂。萇，音ㄔㄤˊ。"}, {"w": "師襄", "d": "春秋時魯國樂官。師，樂師。襄，樂師之名。《史記‧孔子世家》記載孔子曾跟師襄學琴。"}, {"w": "老聃", "d": "即老子，姓李，名耳，字聃，春秋時楚國人，曾任周朝的守藏史，掌管圖書典籍。《史記‧老子韓非列傳》記載孔子曾向老子請教禮儀。聃，音ㄉㄢ。"}, {"w": "徒", "d": "類、輩。"}]}, {"seg": "第七段", "rows": [{"w": "李氏子蟠", "d": "李蟠，唐德宗貞元十九年（西元八○三年）進士。蟠，音ㄆㄢˊ。"}, {"w": "古文", "d": "指先秦、兩漢時代的散文。唐代稱魏、晉以後盛行的駢體文為「時文」，因此稱魏、晉以前的散體文為「古文」。"}, {"w": "六藝經傳", "d": "指六經的經文和傳文。六藝，即《易》《詩》《書》《禮》《樂》《春秋》。經，先聖所著之書。傳，音ㄓㄨㄢˋ，解經之書。"}, {"w": "通習", "d": "通曉熟習。"}, {"w": "不拘於時", "d": "指不被當時士大夫恥於從師的風氣所拘束。於，置於動詞之後，表示被動。"}, {"w": "古道", "d": "此指古人從師問學之道。"}, {"w": "貽", "d": "音ㄧˊ，贈送。"}]}],
        extras: {"intro": [{"label": "題解·課本", "head": "題解", "body": "本文選自昌黎先生集，目的在闡述從師問學的重要。「說」是解釋義理、闡述己見的一種文體。<br><br>中唐時期，士大夫之族多仗恃門第高貴，不願從師問學，甚至引以為恥。當時，韓愈為維護儒家道統，推行古文運動，曾公開招收學生，飽受批評亦不畏懼。飽受批評亦不畏懼。適逢李蟠前來求教，於是，韓愈寫下此文，藉機端正風氣，強調不論貴賤長少，學必有師；並點出「道之所存，師之所存」的擇師標準。", "supList": [["「說」是解釋義理、闡述己見的一種文體", "中國古代<b>論辨類</b>的一種文體，內容大都偏重<b>說明、解釋事理</b>。<br>著名文章如韓愈〈雜說〉、柳宗元〈捕蛇者說〉。<br>屬於生活雜感、讀書心得的雜文性文字也包括在內，如周敦頤〈愛蓮說〉。<br><br>與「<b>論</b>」相比：論多正面立論、體制較嚴；說可夾敘夾議、較為自由。"], ["中唐時期", "安史之亂後，藩鎮割據、宦官專權，社會動盪。士族雖已衰落，門第觀念仍深，故有「位卑則足羞，官盛則近諛」之風。"], ["士大夫之族多仗恃門第高貴", "魏晉以來九品中正制造成「<b>上品無寒門，下品無勢族</b>」。唐代雖行科舉，士大夫仍重門第，恥於從師，怕被人看作地位低下。"], ["推行古文運動", "韓愈主張以先秦兩漢的散體文取代六朝駢文，強調「文以載道」。〈師說〉正是這場運動中的重要文獻。"], ["飽受批評亦不畏懼", "柳宗元〈答韋中立論師道書〉：<br><div class='sp-anc'>今之世不聞有師，有，<ruby>輒<rt>ㄓㄜˊ，往往</rt></ruby>嘩笑之，以為狂人。獨韓愈奮不顧流俗，犯笑<ruby>侮<rt>侮辱</rt></ruby>，收召後學，作師說，因<ruby>抗顏<rt>面色嚴正不屈</rt></ruby>而為師。世果群怪聚罵，<ruby>指目<rt>用手指、用眼看</rt></ruby><ruby>牽引<rt>拉扯、糾纏</rt></ruby>，而<ruby>增與為言辭<rt>加油添醋，增添話柄</rt></ruby>。愈以是得狂名。</div><b>語譯：</b>現在的世上沒聽過有做老師的，有的話，人們往往譏笑他，以為是瘋子。只有韓愈不顧世俗眼光，冒著別人的譏笑侮辱，招收後進學者，寫作〈師說〉，板起面孔做起老師。社會上果然群起訝異責罵，指指點點、拉拉扯扯，加油添醋地增添話柄。韓愈因此得了狂人的名聲。<br><br>可知韓愈在當時收召後學，被指為狂人，仍不畏他人眼光，<b>抗顏</b>（面色嚴正不屈）為師。"], ["適逢李蟠前來求教", "<b>適</b>：正、剛好。"], ["李蟠", "唐德宗貞元十九年（八〇三）進士。時年十七，好古文、通六藝經傳，<b>不拘於時</b>而向韓愈請學，故韓愈作此文贈之。"], ["「道之所存，師之所存」", "全文核心。不論貴賤長少，凡「聞道」在先者即可為師——這是對當時「以門第擇師」風氣的正面回擊。"]]}, {"label": "題解·文體", "head": "「說」是什麼文體", "body": "1.說：中國古代論辨類的一種文體，內容大都偏重說明、解釋事理。著名文章如韓愈 雜說、柳宗元 捕蛇者說。屬於生活雜感、讀書心得的雜文性文字也包括在內，如周敦頤 愛蓮說。"}, {"label": "題解·背景", "head": "寫作背景", "body": "本文大約寫於唐德宗 貞元十八年（西元八○二年），當時韓愈三十五歲，在長安任國子監四門博士。自魏 晉以來，社會上形成一種以「士大夫之族」為代表的門閥制度。其子弟不管品德好壞、才能高低，不需要經過科舉考試，就可以憑著高人一等的門第享受特權，輕易走上仕途之路。因此他們不但不肯從師學習，也瞧不起從師學習的人。到了唐代中期，這種不良的社會風氣仍舊存在。當時韓愈為了推展古文運動，曾經公開招收後學傳授古文，這種行為竟受到「士大夫之族」的譏諷，「群聚而笑之」，說他是好為人師的狂人。韓愈為糾正當時這種不良的社會風氣，於是寫了師說一文以正視聽。因此，表面上師說是為李蟠而作，但實際是為了抨擊那些恥於從師的「士大夫之族」，進而藉機倡導從師學習的重要性。"}, {"label": "題解·爭議", "head": "〈師說〉是否為贈序類文章", "body": "本文題為「師說」，過去常因為寫作的目的—以文贈人、勉勵後學，而將本文歸類為「贈序」。按常規，贈序多為讚美或忠告勗勉；然而作者在這裡卻是借題發揮，因此本文也是一篇說理的雜文，屬於議論文。所謂「師說」，亦即「說師」，就「師道」的理念發表感想，並議論時弊。<br><br>師說是否為「贈序類」的文章，常引起廣泛的爭議。但以本文為贈序類者，主要是根據師說末段，韓愈說：「李氏子蟠，年十七，好古文，六藝經傳，皆通習之。不拘於時，請學於余，余嘉其能行古道，作師說以貽之。」而且民國八十年夜間部大學聯招出了兩道與「序」有關聯的題目，一題說「贈序」，稱「引」或「說」，始於蘇洵。一題是蘇軾 稼說送張琥與師說，性質上同屬贈序。當時有老師曾向聯招會行文，對答案表示疑義。聯招會沒有接受，答覆的理由是在性質上師說可以列為贈序。<br><br>認為師說不是贈序類文章者，其所持理由是贈序文章的標題，為區別於「序跋」的「序」，標題常寫作「送○○○序」或「贈○○○序」，如唐代 韓愈 送孟東野序、送李愿歸盤谷序、送董邵南序；柳宗元 送薛存義序、送寧國范明府詩序；宋代 歐陽脩 送楊寘序、送曾鞏秀才序、送徐無黨南歸序；曾鞏 送江任序；王安石 送孫正之序；明代 宋濂 送東陽馬生序等，都是傳世的名篇。但師說一文並無「送」或「贈」之字眼，而且，清代 桐城派古文家姚鼐的古文辭類纂，將文章分成十三類，師說列為「論辨類」，並非列入「贈序類」，所以不算贈序類。<br><br>而贊同師說為贈序者的理由是：贈序的內容一般都會寫到作者和被贈者的友誼，和對於受者的期望、勸勉和關心等。但韓愈、柳宗元的許多贈序，除了道別、敘情以外，還常常藉以抒發理想、抱負，議論朝政、抨擊時弊，內容廣泛、形式多樣。因此，師說一文雖無「贈」、「送」與「序」之字眼，但據全文的內容與末段為文的緣由，是出於對後學李蟠的嘉許與餽贈，符合「贈序」意涵，應可列為贈序類文章。<br><br><span class='bk-note'>按　由於此文是否屬於「贈序」類頗具爭議，建議避免出題。</span>"}, {"label": "題解·背景", "head": "飽受批評亦不畏懼", "body": "2.飽受批評亦不畏懼：柳宗元 答韋中立論師道書：「今之世不聞有師，有，輒嘩笑之，以為狂人。獨韓愈奮不顧流俗，犯笑侮，收召後學，作師說，因抗顏而為師。世果群怪聚罵，指目牽引，而增與為言辭。愈以是得狂名。」可知韓愈在當時收召後學，被指為狂人，仍不畏他人眼光，抗顏（面色嚴正不屈）為師。"}], "authorPages": [{"label": "作者·課本", "head": "作者", "body": "韓愈，字退之，唐 河南 河陽（今河南省 孟州市）人。生於代宗 大曆三年（西元七六八年），卒於穆宗 長慶四年（西元八二四年），年五十七，諡號文，世稱韓文公。又因昌黎（今河北省境內）為其家族郡望，撰文常自稱昌黎 韓愈，世稱韓昌黎。<br><br>韓愈幼年刻苦向學，精通六經百家之學，二十五歲中進士，最高官至吏部侍郎。個性耿直敢言，曾因反對憲宗迎佛骨上表勸諫，被貶為潮州（今廣東省 潮州市）刺史。<br><br>韓愈一生致力發揚儒家學說，排斥佛、老思想。與柳宗元提倡古文運動，主張以先秦、兩漢樸實無華的散文，取代六朝以來綺靡浮豔的駢文，奠定唐 宋散文發展。蘇軾以「文起八代之衰，道濟天下之溺」、「匹夫而為百世師，一言而為天下法」盛讚其貢獻。<br><br>明 茅坤選錄韓愈、柳宗元、歐陽脩、曾鞏、王安石、蘇洵、蘇軾、蘇轍之文為唐宋八大家文鈔，而以韓愈為首。韓愈的散文氣勢雄健，風格多樣；詩作奇崛險怪，為「奇險派」代表。有昌黎先生集傳世。", "supList": [["韓愈，字退之", "「<b>愈</b>」為勝過、超越之意，「<b>退之</b>」則有謙退之意——名與字<b>相反相成</b>，取謙沖自牧之意。<br>一說「退之」取自《論語‧先進》：「求也退，故進之。」<br><br><b>【名與字的關係】</b>古人「名」與「字」的關係，有「同訓」與「對文」兩種：<br><b>(1) 同訓</b>：「名」與「字」意義<b>相同</b>。如：曾鞏字子固、蘇軾字子瞻。<br><b>(2) 對文</b>：「名」與「字」意義<b>相反</b>。如：韓愈字退之（「愈」為勝過、更加之意，故取相反義的「退」）、端木賜字子貢（賜，賞賜；貢，進獻）。"], ["諡號文", "諡法上以「<b>敏而好學，德美才秀</b>」為「文」。<br>「文」是諡法中極高的評價：經緯天地曰文、道德博聞曰文。後世因此尊稱<b>韓文公</b>。"], ["郡望", "隋 唐時期通常又稱作「<b>姓望</b>」。原指一個郡裡的望族，通常這些宗族世代人才輩出且家世顯赫，為當地郡人所敬重。後來演變為另一種涵義，通指一個家族的<b>根源和發源地</b>。<br><br>●臺灣早期各地也有名門望族，如<b>板橋 林家</b>是大家所熟悉的。像鹿港有<b>施、黃、許</b>三大家族，所以鹿港有句諺語：「<b>娶到施 黃 許，敬如天公祖。</b>」（用閩南語念才有押韻）意思就是說娶到三大家族的大家閨秀，是一件幸運的事。套一句現代的話說，就是少奮鬥三十年，如此「金龜太太」當然要如菩薩般供奉了。"], ["精通六經百家之學", "指<b>先秦諸子各家之書</b>。<br>六經：詩、書、禮、樂、易、春秋。百家：先秦諸子百家之學說。"], ["二十五歲中進士", "韓愈<b>三次落榜</b>，第四次才考上進士（貞元八年）。其後又應吏部博學宏詞科三次不中，直到三十五歲才任國子監四門博士。"], ["吏部侍郎", "吏部首長為<b>尚書</b>，次長為<b>侍郎</b>，掌管官員的<b>任免、考核、升遷、調動</b>。<br>韓愈晚年任吏部侍郎，故世稱<b>韓吏部</b>。"], ["反對憲宗迎佛骨上表勸諫", "元和十四年，憲宗迎佛骨入宮供養，韓愈上〈論佛骨表〉極諫，憲宗大怒欲處死，經裴度等人求情，貶為潮州刺史。<br>途中作〈左遷至藍關示姪孫湘〉：「<b>一封朝奏九重天，夕貶潮陽路八千。</b>」"], ["潮州（今廣東省 潮州市）刺史", "在潮州僅八個月，卻<b>驅鱷、興學、釋放奴婢、勸農桑</b>。潮人感念，稱當地江為<b>韓江</b>、山為<b>韓山</b>，並建韓文公祠。"], ["排斥佛、老思想", "韓愈作〈原道〉，主張恢復堯、舜、禹、湯、文、武、周公、孔、孟相承的<b>儒家道統</b>，力斥佛老之空虛。"], ["與柳宗元提倡古文運動", "主張「<b>文以載道</b>」「<b>惟陳言之務去</b>」「<b>文從字順</b>」，以先秦兩漢散文取代六朝駢文。韓、柳並稱「<b>韓柳</b>」。"], ["駢文", "是中國特有的一種<b>以字句兩兩相對</b>而成篇章的文體，漢末、魏、晉盛極一時。<br><br>駢文有下列幾個特點：<br><b>(1)</b> 句式整齊　<b>(2)</b> 辭藻華美　<b>(3)</b> 聲律和諧　<b>(4)</b> 用典繁多"], ["「文起八代之衰，道濟天下之溺」", "語出蘇軾〈潮州韓文公廟碑〉。<b>八代</b>指東漢、魏、晉、宋、齊、梁、陳、隋。意謂以古文振起八代以來華靡的文風，以儒道濟助沉溺於佛老的天下。"], ["「匹夫而為百世師，一言而為天下法」", "亦出蘇軾〈潮州韓文公廟碑〉。韓愈只是一介文人卻成為歷代師法的對象，所說的言論成為天下的法則。"], ["唐宋八大家文鈔", "明 茅坤選錄韓愈、柳宗元、歐陽脩、曾鞏、王安石、蘇洵、蘇軾、蘇轍之文為《唐宋八大家文鈔》，以<b>韓愈為首</b>。"], ["詩作奇崛險怪，為「奇險派」代表", "韓愈與孟郊並稱「<b>韓孟</b>」，以<b>以文為詩</b>、押險韻、造奇語著稱，開創<b>奇險詩派</b>。"]]}, {"label": "作者·生平", "head": "(一)三歲喪父，兄嫂為依", "body": "韓愈出生兩個月，母親過世。三歲時父親過世，由長兄韓會與大嫂鄭夫人撫養。韓愈上有三兄，韓會為韓愈大哥，長韓愈三十一歲，韓愈跟著在京師做官的韓會一起生活。韓愈十歲時，韓會被貶為韶州（今廣東省）刺史，韓愈便隨兄嫂到了南方。但禍不單行，韓會沒過幾年就病死。建中元年（西元七八○年），十三歲的韓愈隨嫂嫂鄭夫人護喪回到河陽老家。建中二年，中原發生兵亂，幸虧韓家還有祖業田產在江南的宣城（今安徽省），於是其嫂鄭夫人帶著兒子老成和韓愈避亂宣城。"}, {"label": "作者·生平", "head": "(二)三次落榜，始中進士", "body": "韓愈十九歲離開宣城，到京師長安準備應進士試。他既沒有門第的資蔭，又沒有權貴的引薦，因此到處碰壁，三試不中。到二十五歲，韓愈才得中進士。但唐代科舉制度，禮部考試後，還要經吏部考試合格才能授官，而韓愈卻又再三試不中。長安十年，困厄悲愁，「無所取資，日求於人」、「飢不得食，寒不得衣」。"}, {"label": "作者·生平", "head": "(三)任國子監，接觸學子", "body": "貞元十七年（西元八○一年），三十四歲的韓愈被任命為國子監四門博士，正式進入京師官場。博士官是閒職，地位不高，常為人輕視。但國子監是當時的最高學府，能在這裡教書，對韓愈倡導古文運動是頗為有利的。"}, {"label": "作者·生平", "head": "(四)彈劾皇族，貶官陽山", "body": "貞元十九年（西元八○三年）冬，韓愈任監察御史，向皇帝告了京兆尹李實一狀。李實是皇親國戚，又是唐德宗晚年所信任的佞臣，權傾朝野。這年關中大旱，秋又早霜，百姓困苦不堪；而京兆尹李實卻為了諂媚皇帝，照樣橫徵暴斂。滿朝文武為保富貴，對此視而不見，裝聾作啞；生性鯁直的韓愈憤恨難忍，因而有控告之舉，要求皇帝減免百姓租稅，留條生路。這下得罪了權貴李實，立刻被貶到千里之外的陽山（今廣東省 陽山縣）當縣令。"}, {"label": "作者·生平", "head": "(五)諫迎佛骨，被貶潮州", "body": "元和十四年（西元八一九年），韓愈五十二歲，唐憲宗派遣專使前往鳳翔迎奉一節釋迦的指骨。先在宮內供奉三天，之後送往長安各寺傳遞供拜。長安老少奔波，拋下工作，頂禮膜拜，耗費諸多金錢與人力。韓愈擔心如不及時禁止，一定會有人斷臂割肉，捨身事佛，就上論佛骨表給唐憲宗，反對把佛骨迎入宮中。<br><br>他認為：1.佛法本是夷狄的一種宗教，本來就不當信奉。2.佛骨是「枯朽之骨，凶穢之餘」不祥之物，絕不能迎入宮中，應把佛骨燒掉。3.歷來信佛的皇帝儘管非常虔誠，但都短命。唐憲宗得表，大為震怒，下令將韓愈處以極刑。當時朝廷士大夫很震驚惋惜，宰相裴度、崔群勸解，皇親國戚也認為處刑太重，紛紛替韓愈求情。憲宗終於怒氣稍平，免他死罪，貶為潮州（今廣東省 潮州市）刺史。"}, {"label": "作者·生平", "head": "(六)治理潮州，政績卓著", "body": "韓愈自四月二十五日到潮州，至年底離任，治理潮州雖不到八個月，但政績卓著，為人稱道。其中有三項最值得稱述：1.為民除鱷魚之害；2.釋放奴婢；3.興辦學校。潮州的百姓對韓愈的政績感激萬分，為了紀念他的功勞，便把他當日祭鱷魚的那一條河，改名為韓江；後來又在附近建了韓文公廟，供奉他的塑像。<br><br>潮州人人說：「潮州西邊谿潭有鱷魚出沒，吃光了百姓的家畜，因此百姓窮困。」韓愈前往視察，命官員攜豬、羊各一隻投進谿潭，並作祭鱷魚文警告說：「鱷魚不可以和刺史雜居此地。刺史受天子詔命看守這塊土地，治理百姓，而鱷魚不安分守己待在谿潭，上岸吞食百姓飼養的畜牲，和刺史抗衡，爭當統領地方的長官，刺史豈肯屈服順從。現在與鱷魚約─限三日率領同類遷徙南海，三天不遷，寬限到五天；五天不遷，寬限到七天；七天不遷，那表示絕不肯遷了。不把刺史放在眼裡，不聽刺史的話，刺史就選材伎（有才能與技藝的人）吏民，操強弓毒箭，與鱷魚對抗，直到殺完為止，可不要後悔啊！」據舊唐書 韓愈傳記載，自從韓愈對鱷魚下了這個「最後通牒」，當天晚上就暴風突發，連河中的水也颳乾了；鱷魚因為沒有棲息之所，只得逃入大海，從此潮州不再有鱷魚為患。潮州人後來無鱷魚之患，當是事實，但無鱷魚之患必定是由於韓愈「選材伎吏民，操強弓毒矢，以與鱷魚從事」的結果，而不是文章警告的效力。"}, {"label": "作者·生平", "head": "(七)任職吏部，力斥佛老", "body": "長慶二年（西元八二二年）九月，韓愈轉吏部侍郎。長慶三年正月，任京兆尹兼御史大夫，十月，復任兵部侍郎，晚年任吏部侍郎，故世稱韓吏部。據說韓愈臨終前把家人及友朋召集病榻之前，叫他們仔細看看自己的身體，然後說：「佛、老之人造謠，說我排斥佛、老會遭報應，必得癩病（痲瘋病）而死。現在你們看清楚，我的身體完整無損；『報應』顯靈之說，純屬欺人之談。」可見他至死不忘排斥佛、老，維護儒道。"}, {"label": "作者·文學", "head": "(一)散文成就：眾體兼長", "body": "韓愈眾體兼長，所作包含賦、論、說、傳、記、頌、贊、書、序、哀辭、祭文、碑誌、狀、表、雜文等各種體裁皆有，都有卓越的成就。而其文風氣勢充沛，縱橫開闔，奇偶交錯，巧譬善喻，或詭譎，或嚴正，具有多樣的藝術特色。"}, {"label": "作者·文學", "head": "(二)語言特色：務求創新", "body": "韓愈是語言大師，善於推陳出新。如「蠅營狗苟」（送窮文）；「貪多務得」、「同工異曲」、「俱收並蓄」（進學解）；「不塞不流，不止不行」（原道）等新穎詞語，他主張「文從字順各識職」（南陽樊紹述墓誌銘），創造一種從口語提煉的書面語言，擴大文言文的表達功能。但另一方面，他還有一種詰屈聱牙的文句，自謂「不可時施，只以自嬉」（送窮文），對後來一些文人也有相當的影響。"}, {"label": "作者·文學", "head": "(三)詩的成就：奇險詩派", "body": "韓愈倡導古文運動，也致力於詩歌的革新。他繼承李白的自由豪放和杜甫的體格變化、「語不驚人死不休」的藝術傳統，開拓詩歌新路。他與孟郊是「奇險詩派」的代表人物，這一詩派除韓、孟外，還有賈島、盧仝等。韓、孟二人是摯友，且詩歌風格相近，都有「奇崛險怪」的特點。<br><br>這種詩風的具體表現有下列三點：1.用奇字、造拗句、押險韻、避熟求生、困難見巧；2.善於捕捉和表現形態萬千的形象，氣勢雄偉，想像豐富；3.以文為詩。"}, {"label": "作者·補充", "head": "駢文", "body": "3.駢文：是中國特有的一種以字句兩兩相對而成篇章的文體，漢末、魏、晉盛極一時。駢文有下列幾個特點：(1)句式整齊；(2)辭藻華美；(3)聲律和諧；(4)用典繁多。"}, {"label": "作者·補充", "head": "名句與評價", "body": "<b>文起八代之衰，道濟天下之溺：</b>以古文振起八代以來華靡的文風，以儒道濟助沉溺於佛、老思想的天下。語出蘇軾〈潮州韓文公廟碑〉。<br><br><b>匹夫而為百世師，一言而為天下法：</b>韓愈只是一介文人卻成為歷代師法的對象，所說的言論成為天下的法則。語出蘇軾〈潮州韓文公廟碑〉。"}], "appreciation": [{"label": "賞析·課本", "head": "賞析（一）全文結構", "body": "本篇以「師」字貫串全文，旨在闡述從師問學的重要。首段強調學必有師，自古即是，並揭示老師「傳道、受業、解惑」的作用。接著，提出「道之所存，師之所存」做為擇師標準，企圖矯正當時恥學於師的風氣。"}, {"label": "賞析·課本", "head": "賞析（二）三組對比", "body": "第三～五段運用三組對比，論述從師與否的差別：<br><br><b>第一組　古今縱比</b>：以「古之聖人從師而問」與「今之眾人恥學於師」比較，結果是「<b>聖益聖，愚益愚</b>」。<br><br><b>第二組　自身對比</b>：以「士大夫為子擇師」與「士大夫本身恥師」比較，結果是「<b>小學而大遺</b>」。<br><br><b>第三組　當代橫比</b>：以「巫、醫、樂師、百工之人不恥相師」與「士大夫之族恥於從師」比較，結果是「<b>其智乃反不能及</b>」。"}, {"label": "賞析·課本", "head": "賞析（三）孔子為例與寫作緣由", "body": "除此之外，作者還以孔子為例，指出「聖人無常師」，進一步帶出「聞道有先後，術業有專攻」的真諦。文末揭示寫作緣由，嘉許李蟠未受時俗影響，向自己請學，反襯時人恥學於師的不智。"}, {"label": "賞析·課本", "head": "賞析（四）寫作技巧", "body": "全文議論中肯，有正例，有反例，充滿說服力；推測、肯定、感嘆等語氣交錯使用，<b>錯綜、頂真、映襯</b>手法使文句豐富有變化，讓人讀來氣勢充沛，是論說文經典名篇。"}], "thinking": [{"label": "跨閱思考", "head": "現代人為什麼要學習？", "body": "在瞬息萬變的時局中，今天的熱門領域可能是明日的夕陽產業。臺灣大學葉丙成教授：「世界變化劇烈，英國牛津大學研究，有47％工作未來會消失。英國勞動部研究，孩子們長大後的工作，有65％的還未出現。」"}, {"label": "跨閱思考", "head": "黃仁勳的善學", "body": "韓愈的時代問題：自恃為官的士大夫之族失去學習動機，然其施政牽動天下蒼生——這些人不學習，國家怎麼辦？今日時代快速遷移，我們不學習，人生怎麼辦？<br><br>輝達執行長黃仁勳曾與 SEGA 合作開發遊戲機，一年後發現產品架構出錯無法完成合約。他坦然承認錯誤、檢視不足，立刻尋求技術突破，度過倒閉危機後打造出 RIVA128 顯卡，震撼3D市場。投身業界多年仍勇於「面對挑戰，接受失敗，並從中學習」。<br><br>所謂學習，是內心保有謙卑與彈性，願意承認自己的錯誤與不足，讓自己變得更好。在這個「十倍速」變遷的時代，學無常師，更能應對人生的崎嶇與風險。"}]},
        detailSlides: [{"seg": "第一段", "page": "課本 P.22", "orig": "古之學者必有師。", "words": [{"w": "學者", "d": "此指學習的人。"}], "rhetoric": [], "trans": "古代學習的人必定有老師。", "note": "開門見山點出主旨，以「必」字強調從師問學的必要性，也概括全文論述的內容與範圍；「必」字意味唐代當時無此風氣。"}, {"seg": "第一段", "page": "課本 P.22", "orig": "師者，所以傳道、受業、解惑也。", "words": [{"w": "者", "d": "助詞，無義，表停頓。"}, {"w": "所以", "d": "用以、用來。"}, {"w": "受", "d": "「授」的古字，給予，引申為講授。"}, {"w": "業", "d": "古代書寫文字的木板，此指下文的「六藝經傳」。"}, {"w": "解惑", "d": "解決「道」和「業」兩方面的疑難。"}, {"w": "也", "d": "助詞，表停頓。"}], "rhetoric": [], "trans": "老師，是傳授道理、講授學業、解除疑惑的人。", "note": "曾國藩《求闕齋讀書錄》：「傳道謂修己治人之道，受業謂古文六藝之業，解惑謂解此二者之惑。」"}, {"seg": "第一段", "page": "課本 P.22", "orig": "人非生而知之者，孰能無惑？", "words": [{"w": "之", "d": "代詞，指上文的「道」與「業」。"}], "rhetoric": [{"name": "設問（激問）", "note": "謂人皆不免有惑，故須從師以解惑。"}], "trans": "人不是生下來就懂得道理的，誰能沒有疑惑呢？", "note": "語出《論語‧述而》：「我非生而知之者，好古，敏以求之者也。」孔子承認有「生而知之」者，韓愈則明言世上並無「生而知之」者，強調從師問學的重要。"}, {"seg": "第一段", "page": "課本 P.22", "orig": "惑而不從師，其為惑也終不解矣！", "words": [{"w": "而", "d": "卻。"}, {"w": "其為惑也", "d": "指那些疑惑的問題。"}], "rhetoric": [], "trans": "有了疑惑卻不向老師請教，那些疑惑就永遠得不到解決了。", "note": "「矣」表示語氣極為肯定。"}, {"seg": "第一段", "page": "段旨", "type": "summary", "title": "第一段段旨", "body": "強調學必有師的道理，點出從師的重要性。開門見山點出主旨，不但以「必」字強調從師問學的必要性，也概括了全文論述的內容與範圍。"}, {"seg": "第二段", "page": "課本 P.23", "orig": "生乎吾前，其聞道也，固先乎吾，吾從而師之；", "words": [{"w": "乎", "d": "介詞，於、在。"}, {"w": "其", "d": "他。"}, {"w": "聞道", "d": "明瞭道理。聞，聽聞，引申為理解、明瞭。"}, {"w": "固", "d": "本來。"}, {"w": "吾從而師之", "d": "我跟從他學習。師，作動詞，學習。"}], "rhetoric": [{"name": "頂真", "note": "句末與句首字詞相承接。"}], "trans": "出生在我之前的人，明瞭道理本來就比我早，我跟隨他，向他學習；", "note": "就年紀長少正反對照，提出以「聞道」作為擇師原則。"}, {"seg": "第二段", "page": "課本 P.23", "orig": "生乎吾後，其聞道也，亦先乎吾，吾從而師之。", "words": [], "rhetoric": [{"name": "頂真", "note": "句末與句首字詞相承接。"}], "trans": "出生在我之後的人，明瞭道理也可能比我早，我跟隨他，向他學習。", "note": ""}, {"seg": "第二段", "page": "課本 P.23", "orig": "吾師道也，夫庸知其年之先後生於吾乎？", "words": [{"w": "師", "d": "動詞，學習。"}, {"w": "夫", "d": "發語詞，無義。"}, {"w": "庸", "d": "表反問語氣，豈。"}, {"w": "之", "d": "助詞，無義。"}], "rhetoric": [{"name": "設問（激問）", "note": "指何必過問他們年齡比我大或小呢？"}], "trans": "我要學習的是道理啊，何必知道他們出生比我早還是晚呢？", "note": "語出《論語‧里仁》：「朝聞道，夕死可矣。」「庸」字另有「需要、酬謝、平庸、愚笨」等義，此處作「豈」解。"}, {"seg": "第二段", "page": "課本 P.23", "orig": "是故無貴無賤、無長無少，道之所存，師之所存也。", "words": [{"w": "無貴無賤無長無少", "d": "無論地位高低，不管年紀大小。賤，本義價格低，在此引申為地位低。"}], "rhetoric": [{"name": "類疊", "note": "「無……無……」反覆出現，強化語氣。"}], "trans": "所以，無論地位高低、不管年紀大小，「道」所在的地方，就是老師所在的地方。", "note": "反對當代對從師的錯誤觀念，以開闊人們的視野。"}, {"seg": "第二段", "page": "段旨", "type": "summary", "title": "第二段段旨", "body": "提出擇師的原則──道之所存，師之所存。針對「聞道」論述擇師的原則，分析世俗以年齡、地位判定是否從師的現象，為下文奠定立論基礎。"}, {"seg": "第三段", "page": "課本 P.24", "orig": "嗟乎！師道之不傳也久矣！欲人之無惑也難矣！", "words": [{"w": "師道", "d": "指從師問學的傳統。"}], "rhetoric": [{"name": "感嘆", "note": "感慨當代人恥學於師。"}], "trans": "唉！從師問學的傳統失傳已經很久了！要人們沒有疑惑，很難啊！", "note": "韓愈〈進士策問〉：「由漢氏以來，師道日微，然猶時有授經傳業者，及於今則無聞矣。」"}, {"seg": "第三段", "page": "課本 P.24", "orig": "古之聖人，其出人也遠矣，猶且從師而問焉；", "words": [{"w": "出人", "d": "超出一般人。"}, {"w": "問焉", "d": "向老師請教。焉，猶「之」，代詞，指老師。"}], "rhetoric": [{"name": "映襯（古今縱比）", "note": "以古之聖人與今之眾人比較，作一正一反說理；以從師態度迥異來審視聖人與眾人。"}], "trans": "古代的聖人，他們（的才智學養）超出一般人很多，尚且跟隨老師向他們請教；", "note": ""}, {"seg": "第三段", "page": "課本 P.24", "orig": "今之眾人，其下聖人也亦遠矣，而恥學於師。", "words": [{"w": "下", "d": "不如、不及（形容詞）。「其下聖人」的「下」字下省略比較關係詞「於」。"}, {"w": "恥學於師", "d": "以從師問學為恥。恥，意動用法，以……為恥。"}], "rhetoric": [{"name": "意動用法", "note": "「恥」字：以……為恥。"}], "trans": "現在眾人遠不如古代的聖人，卻以從師問學為恥。", "note": ""}, {"seg": "第三段", "page": "課本 P.24", "orig": "是故聖益聖，愚益愚，聖人之所以為聖，愚人之所以為愚，其皆出於此乎？", "words": [{"w": "所以", "d": "何以、為什麼。"}, {"w": "其", "d": "推測語氣，大概、或許。"}], "rhetoric": [], "trans": "所以聖人更加聖明，愚人更加愚笨，聖人為什麼會成為聖人，愚人為什麼會成為愚人，大概都出自於（從師與不從師）這個原因吧？", "note": "指聖人從師問焉，愚人恥學於師，點出聖人、愚人不同的原因。「聖」「愚」二字兼具名詞、形容詞用法。"}, {"seg": "第三段", "page": "段旨", "type": "summary", "title": "第三段段旨", "body": "聖愚的關鍵在於是否從師問學。以古之聖人和今之眾人的天資、是否從師問學的結果對比，凸顯時人恥學於師的愚昧。"}, {"seg": "第四段", "page": "課本 P.25", "orig": "愛其子，擇師而教之，於其身也則恥師焉，惑矣！", "words": [{"w": "其身", "d": "他自己，指士大夫本人。身，自身。"}, {"w": "則", "d": "卻。"}, {"w": "惑", "d": "糊塗、不懂事理。"}], "rhetoric": [{"name": "映襯（自身對比）", "note": "士大夫為自己的子弟擇師，而自身卻以從師為恥，兩相對比，凸顯其矛盾。"}, {"name": "意動用法", "note": "「恥」字：以……為恥。"}], "trans": "人們愛自己的孩子，會選擇老師來教導他們，對於自身而言，卻以從師問學為可恥，真是糊塗啊！", "note": ""}, {"seg": "第四段", "page": "課本 P.25", "orig": "彼童子之師，授之書而習其句讀者也，非吾所謂傳其道、解其惑者也。", "words": [{"w": "之", "d": "指「童子」。"}, {"w": "習其句讀", "d": "誦讀書本。句讀，文中語意完足叫做句；語意未完足，誦讀時須略作停頓叫做讀。讀，音ㄉㄡˋ，通「逗」。"}], "rhetoric": [], "trans": "那些小孩子的老師，只教孩子們誦讀書本、學習斷句，不是我所說的傳授道理、解除疑惑的人啊！", "note": "呼應首段對老師的定義。古人使用「句讀」，基本上只具斷句作用，和今日所使用的標點符號不同。"}, {"seg": "第四段", "page": "課本 P.25", "orig": "句讀之不知，惑之不解，或師焉，或不焉，小學而大遺，吾未見其明也。", "words": [{"w": "或不焉", "d": "不，音ㄈㄡˇ，同「否」。"}, {"w": "小學而大遺", "d": "學習小的，卻遺漏大的。小，指句讀之學；大，指道與業的疑惑。"}, {"w": "明", "d": "明智、高明之處。"}], "rhetoric": [{"name": "錯綜（交蹉語次）", "note": "即「句讀之不知，或師焉；惑之不解，或不焉。」交叉銜接，文句跌宕多姿。"}, {"name": "類疊", "note": "「或……或……」反覆。"}, {"name": "映襯", "note": "「小學」與「大遺」對照。"}], "trans": "不懂斷句的還肯向老師學習，有疑惑不能解決卻不向老師請教。學習小的卻遺漏大的，我看不出這有什麼高明之處。", "note": "義近：本末倒置、捨本逐末、買櫝還珠。「句讀之不知」「惑之不解」皆為強調賓語而倒裝（原為「不知句讀」「不解惑」）。"}, {"seg": "第四段", "page": "段旨", "type": "summary", "title": "第四段段旨", "body": "士大夫為子擇師，自身卻恥學於師；孩童學習句讀而非學習「道」與「業」。透過士大夫自身的矛盾，與老師只教句讀而非傳道解惑的對比，對士大夫不明事理的表現給予直接的否定。"}, {"seg": "第五段", "page": "課本 P.26", "orig": "巫、醫、樂師、百工之人，不恥相師。", "words": [{"w": "巫醫", "d": "指巫師和醫生。巫，音ㄨ，指接神除邪的人。"}, {"w": "樂師", "d": "以歌唱、奏樂為業的人。樂，音ㄩㄝˋ。師，指有專門技藝的人。"}, {"w": "百工", "d": "從事各種技藝的人。百為虛數，泛指多數。"}, {"w": "不恥相師", "d": "不以互相學習為恥。"}], "rhetoric": [{"name": "意動用法", "note": "「恥」字：以……為恥。「不恥」即不認為可恥。"}], "trans": "巫師、醫生、樂師和從事各種技藝的人，不以互相學習為可恥。", "note": "當代橫比：對比士大夫與其他行業在從師問學上的態度，批判士大夫不智。呼應第二段「無貴無賤、無長無少，道之所存，師之所存也」。"}, {"seg": "第五段", "page": "課本 P.26", "orig": "士大夫之族，曰師、曰弟子云者，則群聚而笑之。問之，則曰：「彼與彼年相若也，道相似也。」", "words": [{"w": "士大夫之族", "d": "指在職居官的人們。大，音ㄉㄚˋ。族，有共同屬性的群類。"}, {"w": "云者", "d": "語助詞，表語氣的停頓。"}], "rhetoric": [], "trans": "士大夫一類的人，一說到誰是誰的老師或學生，大家就會聚在一起譏笑他們。問他們為什麼這樣，他們就說：「他和他年齡相近，學問也差不多啊。」", "note": ""}, {"seg": "第五段", "page": "課本 P.26", "orig": "位卑則足羞，官盛則近諛。嗚呼！師道之不復可知矣！", "words": [{"w": "位卑則足羞官盛則近諛", "d": "向地位低的人學習，就感到十分羞恥；向官位高的人學習，就覺得近於諂媚。足，十分、非常。諛，音ㄩˊ，奉承諂媚。"}, {"w": "復", "d": "返、歸，在此有恢復之意。"}, {"w": "足", "d": "作「十分、非常」解時讀ㄗㄨˊ（閩南語至今保留此義）；作「過分」解時讀ㄐㄩˋ，如《論語》「足恭」。"}], "rhetoric": [{"name": "映襯", "note": "「位卑」與「官盛」對照。"}, {"name": "感嘆", "note": "「嗚呼」感慨師道之不復。"}], "trans": "向地位低的人學習，就感到十分羞恥；向官位高的人學習，就覺得近於諂媚。唉！從師問學的傳統不能恢復由此可知了！", "note": "「位」可包括社經地位。"}, {"seg": "第五段", "page": "課本 P.26", "orig": "巫、醫、樂師、百工之人，君子不齒，今其智乃反不能及，其可怪也歟！", "words": [{"w": "君子", "d": "在上位者，即前文的「士大夫之族」。"}, {"w": "不齒", "d": "不屑與之同列。齒，本義為牙齒，在此有並列之意。"}, {"w": "乃", "d": "竟、居然。"}, {"w": "其", "d": "代詞，代指士大夫之族不屑與巫醫樂師百工同列，而其智乃反不能及這種現象。一說為助詞，加強語氣。"}], "rhetoric": [{"name": "轉品（名→動）", "note": "「齒」由名詞（牙齒）轉為動詞（並列）。"}, {"name": "感嘆", "note": "「其可怪也歟」感嘆士大夫之愚。"}], "trans": "巫師、醫生、樂師和從事各種技藝的人，士大夫們不屑與這些人同列，現在他們的智慧竟然比不上這些人，這現象真是奇怪啊！", "note": "辨析：「不恥」是不認為可恥（意動）；「不齒」是不屑與之同列。「不恥下問」若寫成「不齒下問」則意思完全相反。"}, {"seg": "第五段", "page": "段旨", "type": "summary", "title": "第五段段旨", "body": "舉巫、醫、樂師、百工之人不恥相師，對比士大夫恥學於師的荒謬。透過士大夫與其他行業者對比，對不從師的言行加以描述，語帶諷刺與感慨，對比出士大夫見解的淺陋。"}, {"seg": "第六段", "page": "課本 P.27", "orig": "聖人無常師：孔子師郯子、萇弘、師襄、老聃。郯子之徒，其賢不及孔子。", "words": [{"w": "常師", "d": "固定的老師。"}, {"w": "師", "d": "從師、學習（動詞）。"}, {"w": "孔子師郯子", "d": "孔子以郯子為師。郯子，春秋郯國國君，孔子曾向他請教「以鳥名官」事。郯，音ㄊㄢˊ。"}, {"w": "萇弘", "d": "東周敬王時大夫，孔子曾向他請教古樂。萇，音ㄔㄤˊ。"}, {"w": "師襄", "d": "春秋魯國樂官，孔子曾跟他學琴。"}, {"w": "老聃", "d": "即老子，姓李名耳字聃，孔子曾向他請教禮儀。聃，音ㄉㄢ。"}, {"w": "徒", "d": "類、輩。"}], "rhetoric": [], "trans": "聖人沒有固定的老師：孔子曾拜郯子、萇弘、師襄、老聃等人為師。郯子這些人，聰明才智都比不上孔子。", "note": "語出《論語‧子張》：「夫子焉不學？而亦何常師之有？」"}, {"seg": "第六段", "page": "課本 P.28", "orig": "孔子曰：「三人行，則必有我師。」是故弟子不必不如師，師不必賢於弟子。", "words": [{"w": "三人行則必有我師", "d": "三人同行，一定有我可以效法學習的人。語出《論語‧述而》。一說三為虛數，三人指多人。"}, {"w": "師不必賢於弟子", "d": "老師不一定比弟子高明。賢於，比……高明。於，在此有比較之意。一說：賢，勝過。"}], "rhetoric": [{"name": "回文", "note": "「弟子不必不如師，師不必賢於弟子」前後迴環。"}, {"name": "頂真", "note": "句末字詞與下句相承。"}], "trans": "孔子說：「三人同行，一定有我可以效法學習的人。」所以弟子不一定不如老師，老師不一定比弟子高明。", "note": "以孔子之好學，對比當時士大夫恥學於師的不智。"}, {"seg": "第六段", "page": "課本 P.28", "orig": "聞道有先後，術業有專攻，如是而已。", "words": [{"w": "術業有專攻", "d": "技能和學問上各有專精的研究。攻，學習、研究。"}], "rhetoric": [], "trans": "那是因為懂得道理有先後的差別，技能和學問上各有專精的研究，如此罷了。", "note": "呼應上文「道之所存，師之所存」。"}, {"seg": "第六段", "page": "段旨", "type": "summary", "title": "第六段段旨", "body": "舉聖人無常師為例，揭示從師問學的態度。以至聖孔子拜師的言行為例，提示正確的學習態度；並從「聞道有先後，術業有專攻」說明「弟子不必不如師，師不必賢於弟子」，呼應上文「道之所存，師之所存」。"}, {"seg": "第七段", "page": "課本 P.28", "orig": "李氏子蟠，年十七，好古文，六藝經傳，皆通習之。", "words": [{"w": "李氏子蟠", "d": "李蟠，唐德宗貞元十九年（西元八○三年）進士。子，古時對男子的美稱。蟠，音ㄆㄢˊ。"}, {"w": "古文", "d": "指先秦、兩漢時代的散文。唐代稱魏晉以後盛行的駢體文為「時文」，故稱魏晉以前的散體文為「古文」。"}, {"w": "六藝經傳", "d": "指六經的經文和傳文。六藝即《易》《詩》《書》《禮》《樂》《春秋》。傳，音ㄓㄨㄢˋ，解經之書。"}, {"w": "通習", "d": "通曉熟習。一說，普遍地研習。"}], "rhetoric": [], "trans": "李蟠先生，十七歲，喜歡古文，六經的經文和傳文都已通曉熟習。", "note": ""}, {"seg": "第七段", "page": "課本 P.28", "orig": "不拘於時，請學於余，余嘉其能行古道，作〈師說〉以貽之。", "words": [{"w": "不拘於時", "d": "指不被當時士大夫恥於從師的風氣所拘束。於，置於動詞之後，表示被動。"}, {"w": "於", "d": "向。"}, {"w": "嘉", "d": "讚美。"}, {"w": "古道", "d": "此指古人從師問學之道。"}, {"w": "貽", "d": "音ㄧˊ，贈送。"}], "rhetoric": [{"name": "頂真", "note": "句末字詞與下句相承。"}], "trans": "他不被當時士大夫恥於從師的風氣所拘束，向我請教學習，我嘉許他能遵行古人從師問學的傳統，（因此）寫這篇〈師說〉送給他。", "note": "以李蟠之好學從師，對比唐人恥學於師的風氣。「以」表目的：作〈師說〉（作為）以貽之（目的）。"}, {"seg": "第七段", "page": "段旨", "type": "summary", "title": "第七段段旨", "body": "說明撰寫本文的緣起──李蟠不恥相師，故作〈師說〉以貽之。藉李蟠「不拘於時」拜師請學，針砭當時士大夫「拘於時」（因而恥學於師）。"}],
    structure: {"title": "〈師說〉結構表", "groups": [{"head": "託古立論（一、二段）", "color": "gold", "rows": [["從師的重要性", "古之學者必有師"], ["老師的作用", "傳道、受業、解惑"], ["從師的原則", "道之所存，師之所存"]]}, {"head": "對比論證（三～五段）", "color": "cinnabar", "rows": [["古今縱比（三段）", "古之聖人：從師而問　↔　今之眾人：恥學於師　→　聖益聖，愚益愚"], ["自身對比（四段）", "愛其子，擇師而教　↔　於其身，則恥師焉　→　小學而大遺"], ["當代橫比（五段）", "巫醫樂師百工：不恥相師　↔　士大夫之族：群聚而笑之　→　其智反不能及"]]}, {"head": "正面論證（六段）", "color": "green", "rows": [["聖人無常師", "孔子師郯子、萇弘、師襄、老聃"], ["師生關係", "弟子不必不如師，師不必賢於弟子"], ["道理依據", "聞道有先後，術業有專攻"]]}, {"head": "寫作緣由（七段）", "color": "blue", "rows": [["讚許李蟠", "好古文，六藝經傳皆通習之"], ["不拘於時", "請學於余，余嘉其能行古道，作〈師說〉以貽之"]]}], "theme": "本文展現「學習」的動機、對象、方法、目的之間的關聯，強調「從師問學」的重要性。"},
        author: {
      dynasty: '中唐（約 768–824 年）',
      name: '韓愈，字退之，諡號「文」，世稱韓文公',
      intro: '唐代文學家、思想家，「唐宋八大家」之首。發起古文運動，力主文章應服務於「明道」，反對六朝駢文空洞浮靡之風，詩有「詩囚」之喻。',
      context: '本文作於唐德宗貞元十八年（802），贈弟子李蟠。借「為學必有師」之論，批判士大夫「恥學於師」的社會風氣，宣揚「道之所存，師之所存」的從師之道。'
    },
    rhetoric: [
      { name: '排比', example: '傳道、受業、解惑', explanation: '三個動詞短語並列，說明老師三大職責，語氣整齊有力，結構鮮明。' },
      { name: '頂真（接龍）', example: '道之所存，師之所存', explanation: '前句末字「存」引出後句開頭，環環相扣，強調師道與道的緊密關聯。' },
      { name: '對比', example: '古之聖人……猶且從師；今之眾人……恥學於師', explanation: '以「古聖」vs「今眾」對比，突顯師道不存的時代荒謬。' },
      { name: '反問', example: '吾師道也，夫庸知其年之先後生於吾乎？', explanation: '反問強調選師只看「道」而不論年齡，語氣較直述更強烈有力。' },
      { name: '類比', example: '巫、醫、樂師百工之人，不恥相師', explanation: '以工匠互師為類比，諷刺士大夫反而不如百工，製造強烈反差。' }
    ],
    content: `<p>古之學者必有師。師者，所以傳道、受業、解惑也。人非生而知之者，孰能無惑？惑而不從師，其為惑也終不解矣！</p>
    <p class="tb-note">▸ 古代求學的人，一定會有老師指導。老師，是用來傳授道理，講授學業，解答困惑的人。人並不是生下來就知道一切道理的，誰能沒有困惑呢？有了困惑卻不去請教老師，那麼他的困惑就永遠不能解決了。</p>
<p>生乎吾前，其聞道也，固先乎吾，吾從而師之；生乎吾後，其聞道也，亦先乎吾，吾從而師之。吾師道也，夫庸知其年之先後生於吾乎？</p>
<p class="tb-note">▸ 出生在我之前（年紀比我大）的人，他領會道理，本來就比我早，我跟從他，向他學習；出生在我之後（年紀比我小）的人，他領會道理，也比我早的話，我也跟從他，向他學習。我所要學習的是「道理」啊，哪裡需要知道對方是生在我之前或生在我之後呢？</p>
<p>是故無貴無賤，無長無少，道之所存，師之所存也。</p>
<p class="tb-note">▸ 所以，不管對方地位是顯貴還是低下，無論對方年齡較長或較少，只要是「道」所在的地方，就是老師所在的地方。</p>
<p>嗟乎，師道之不存也久矣，欲人之無惑也難矣。古之聖人，其出人也遠矣，猶且從師而問焉。今之眾人，其下聖人也亦遠矣，而恥學於師。</p>
<p class="tb-note">▸ 唉！從師問道的風氣不流傳已經很久了啊！想要人沒有困惑很困難啊！古代的聖人，他們超越一般人很多，還是會跟從老師請益求教；現在大多數的人，他們遠遠比不上聖人，卻認為向老師學習是可恥的</p>
<p>是故聖益聖，愚益愚。聖人之所以為聖，愚人之所以為愚，其皆出於此乎？</p>
<p class="tb-note">▸ 因此聖人變得更加聖明，而愚人變得更加愚笨。聖人之所以成為聖人，愚人之所以成為愚人，大概都是因為這個原因吧？</p>
<p>愛其子，擇師而教之，於其身則恥師焉，惑矣！彼童子之師，授之書而習其句讀者也，非吾所謂傳其道、解其惑者也。</p>
<p class="tb-note">▸ 人們疼愛自己的孩子，就會選聘好的老師來教他們；但是他們自己本身，卻恥於向老師學習，真是令人困惑啊。那些孩子們的老師，只是敎他們誦讀書籍，學習熟悉其中的句逗的人，並不是我說的傳授道理、解決疑難問題的老師啊！</p>
<p>句讀之不知，惑之不解，或師焉，或不焉，小學而大遺，吾未見其明也。</p>
<p class="tb-note">▸ 文章的句讀不清楚的時候，會去請教老師；可是有困惑不能解決的時候，卻不會去請教老師。最後只學習到小的句讀之學，卻遺漏掉重要的傳道、受業和解惑，我真的看不出他的聰明在那裡啊！</p>
<p>巫、醫、樂師、百工之人，不恥相師。士大夫之族，曰師曰弟子云者，則群聚而笑之。</p>
<p class="tb-note">▸ 巫醫、樂師及各種工匠，不以互相學習爲羞恥。可是，如今的士大夫們，只要一提到老師、學生這樣的稱呼，大家就會群聚在一塊兒去嘲笑他。</p>
<p>問之，則曰：「彼與彼年相若也，道相似也。」位卑則足羞，官盛則近諛。嗚乎！師道之不復可知矣。</p>
<p class="tb-note">▸ 問說為什麼要嘲笑呢？嘲笑的人就會說：「他們之間年紀相差不多，領會的道理也應該差不多吧！」（於是）向地位低的人學習，就會覺得十分可恥，向地位高的人學習，又會覺得好像在諂媚。唉！從師問道的風氣無法恢復，由此可知。</p>
<p>巫、醫、樂師百工之人，君子不齒，今其智乃反不能及，其可怪也歟！</p>
<p class="tb-note">▸ 巫醫、樂師以及各種工匠，士大夫原本不屑與他們並列，如今士大夫們的智慧卻反而比不上他們，這真是件很奇怪的事情啊！</p>
<p>聖人無常師。孔子師郯子、萇弘、師襄、老聃。郯子之徒，其賢不如孔子。</p>
<p class="tb-note">▸ 聖人沒有固定的老師，孔子曾經向郯子、萇弘、師襄、老聃等人請教學習。郯子這些人，他們的聰明才智當然比不上孔子。</p>
<p>孔子曰「三人行則必有我師」，是故弟子不必不如師，師不必賢於弟子，聞道有先後，術業有專攻，如是而已。</p>
<p class="tb-note">▸ 但孔子說：「多人同行，其中一定有可以讓我學習的對象。」所以學生不一定不如老師，老師也不一定比學生高明，只是領會道理的時間有先有後，學術技藝的研究各有專長，如此罷了。</p>
<p>李氏子蟠，年十七，好古文，六藝、經傳，皆通習之。不拘於時，請學於余，余嘉其能行古道，作師說以貽之。</p>
<p class="tb-note">▸ 李家之子李蟠，年紀十七，喜歡古文，六經的經文以及傳注（儒家的經典），他都能夠通曉熟習。又不被恥學於師的習俗所約束，來向我學習，我讚許他能實行古人從師學習的道理，所以寫了這篇＜師說＞來贈送給他。</p>

}

/* 小節結束記號（教師專用暗記：右下角小圓點串） */
function wkSecMark() {
  const area = document.getElementById('wk-slide-area');
  const fsb = document.getElementById('wkfs-body');
  [area, fsb].forEach(function(el) {
    if (!el) return;
    const old = el.querySelector('.sec-mark'); if (old) old.remove();
    if (!wkSectionMap || !wkSectionMap.length) return;
    // 找出目前頁所屬小節，及該小節最後一頁
    let cur = -1;
    for (let i = 0; i < wkSectionMap.length; i++) {
      if (wkIdx >= wkSectionMap[i].idx) cur = i; else break;
    }
    if (cur < 0) return;
    const nextIdx = (cur + 1 < wkSectionMap.length) ? wkSectionMap[cur+1].idx : wkSlides.length;
    const isLast = (wkIdx === nextIdx - 1);
    if (!isLast) return;
    const sl = el.querySelector('.wk-slide'); if (!sl) return;
    if (getComputedStyle(sl).position === 'static') sl.style.position = 'relative';
    const m = document.createElement('div');
    m.className = 'sec-mark';
    m.textContent = '◈ ◈ ◈';
    m.title = '本小節最後一頁，下一頁進入：' + (cur+1 < wkSectionMap.length ? wkSectionMap[cur+1].label : '結束');
    sl.appendChild(m);
  });
}

  body.classList.toggle('show');
  btn.classList.toggle('on');
  btn.textContent = btn.classList.contains('on') ? '▾ 收起語譯' : '▸ 顯示語譯';
}
function spFormatAnc(html){
  if (!html) return '';
  /* 將已有 ruby 改成藍色可點注釋；不再把注音塞到字的正上方 */
  html = html.replace(/<ruby>([\s\S]*?)<rt>([\s\S]*?)<\/rt><\/ruby>/g, function(_, word, note){
    return '<span class="sp-anno-toggle" onclick="spAnnoTog(this)">' + word + '<span class="sp-anno-mark">註</span><span class="sp-anno">' + note + '</span></span>';
  });
  return html;
}
function spFormatBody(html){
  if (!html) return '';
  /* 所有補充內容共用：明確 sp-anc + 保守辨識完整古文引文。 */
  html = html.replace(/<div class=(?:"|')sp-anc(?:"|')>([\s\S]*?)<\/div>/g, function(_, inner){
    return '<div class="sp-anc">' + spFormatAnc(inner) + '</div>';
  });
  const parts = html.split('<br><br>');
  const out = [];
  parts.forEach(function(part){
    if (!part.trim()) return;
    if (part.indexOf('class="sp-anc"') >= 0 || part.indexOf("class='sp-anc'") >= 0) {
      out.push(part); return;
    }
    const m = part.match(/「([^」]{18,})」/);
    if (m) {
      const quote = m[1];
      const punct = (quote.match(/[，。；：！？]/g) || []).length;
      if (punct >= 2) {
        const before = part.slice(0, m.index).trim();
        const after = part.slice(m.index + m[0].length).trim();
        if (before) out.push(before);
        out.push('<div class="sp-anc">' + spFormatAnc('「' + quote + '」') + '</div>');
        if (after) out.push(after);
        return;
      }
    }
    out.push(part);
  });
  return out.join('<br><br>');
}

/* 所有補充講義共用同一套古文呈現格式。 */
function hdFormatShiShuoExample(html){
  if (!html) return '';
  /* 先處理既有 ruby，避免古文上方再出現小字。 */
  html = spFormatAnc(html);

  /* 將語譯改成教師可控制揭示的按鈕。 */
  html = html.replace(/(?:<b>語譯：<\/b>|語譯：)\s*([\s\S]*?)(?=<br><br>|$)/g, function(_, trans){
    return '<button type="button" class="hd-trans-toggle" onclick="hdTransTog(this)">▸ 顯示語譯</button>' +
           '<div class="hd-trans-body">' + trans + '</div>';
  });

  /* 只把「明顯是例句／引文」的 quoted passage 做成內框。 */
  html = html.replace(/「([^」]{8,})」/g, function(_, quote){
    const punct = (quote.match(/[，。；：！？、]/g) || []).length;
    if (quote.length < 10 && punct < 1) return '「' + quote + '」';
    return '<div class="hd-anc">' + spFormatAnc(quote) + '</div>';
  });
  return html;
}

/* 講義表格：相同內容自動合併儲存格 */
function hdMergeTables(root){
  var tabs = (root||document).querySelectorAll('.hd-table, .ls-tbl, .jy-table');
  for (var t = 0; t < tabs.length; t++) {
    var tb = tabs[t];
    if (tb.getAttribute('data-merged')) continue;
    tb.setAttribute('data-merged','1');
    var rows = tb.rows;
    if (rows.length < 3) continue;
    var grid = [];
    for (var r = 0; r < rows.length; r++) {
      var line = [];
      for (var c = 0; c < rows[r].cells.length; c++) line.push(rows[r].cells[c]);
      grid.push(line);
    }
    var maxCol = 0;
    for (var r2 = 0; r2 < grid.length; r2++) if (grid[r2].length > maxCol) maxCol = grid[r2].length;
    if (maxCol < 3) continue;
    var prevG = [];
    for (var z = 0; z < rows.length; z++) prevG.push(0);
    var lim = maxCol - 1;
    if (lim > 6) lim = 6;
    for (var c2 = 0; c2 < lim; c2++) {
      var grp = [];
      for (var z2 = 0; z2 < rows.length; z2++) grp.push(z2);
      var i2 = 0;
      while (i2 < grid.length) {
        var cell = grid[i2][c2];
        if (!cell || cell.getAttribute('colspan')) { i2++; continue; }
        var val = cell.innerHTML.replace(/\s+/g,'');
        if (!val || val === '&nbsp;') { i2++; continue; }
        var j2 = i2 + 1;
        while (j2 < grid.length) {
          var nx = grid[j2][c2];
          if (!nx || nx.getAttribute('colspan')) break;
          if (nx.innerHTML.replace(/\s+/g,'') !== val) break;
          if (prevG[j2] !== prevG[i2]) break;
          j2++;
        }
        if (j2 - i2 > 1) {
          cell.rowSpan = j2 - i2;
          cell.className += ' cell-merged';
          for (var k2 = i2 + 1; k2 < j2; k2++) if (grid[k2][c2]) grid[k2][c2].parentNode.removeChild(grid[k2][c2]);
        }
        for (var k3 = i2; k3 < j2; k3++) grp[k3] = i2;
        i2 = j2;
      }
      prevG = grp;
    }
  }
}

/* ════════ 內容自適應表格欄寬 ════════
   先用固定「基準字級」16px 測量每欄實際內容寬度，寫入 colgroup。
   之後表格採 fixed layout：放大／縮小字體只改文字換行，不重新分配欄寬。
   螢幕方向改變時，百分比欄寬仍會隨表格 100% 寬度一起伸縮。 */
const TABLE_LAYOUT_BASE_FONT = 16;
function resetAdaptiveTableWidths(root){
  const host = root || document;
  host.querySelectorAll('table[data-width-frozen="1"]').forEach(function(table){
    const cg = table.querySelector(':scope > colgroup[data-generated-widths]');
    if (cg) cg.remove();
    table.removeAttribute('data-width-frozen');
    table.style.tableLayout = 'auto';
  });
}

/*
 * 所有教學表格共用：先用固定基準字級 16px 做真正的 auto layout，
 * 取得瀏覽器實際分配的欄寬，再凍結成百分比。之後只調字體不重算欄寬；
 * 只有螢幕尺寸／方向改變時才重新計算。
 */
function freezeAdaptiveTableWidths(root){
  const host = root || document;
  const tables = host.querySelectorAll('.wk-slide-area table, #wk-fullscreen table, .q-body table, .tb-body table, .cross-year-table, .jy-table, .wk-table, .hd-table, .ls-tbl');
  tables.forEach(function(table){
    if (table.getAttribute('data-width-frozen') === '1') return;
    if (!table.rows.length) return;

    const rect = table.getBoundingClientRect();
    const parentWidth = table.parentElement ? table.parentElement.getBoundingClientRect().width : rect.width;
    const width = Math.max(280, parentWidth || rect.width || 0);
    if (!width) return;

    const cloneHost = document.createElement('div');
    cloneHost.style.cssText = 'position:absolute;left:-100000px;top:0;visibility:hidden;pointer-events:none;width:'+width+'px;max-width:'+width+'px;overflow:hidden;';
    const clone = table.cloneNode(true);
    clone.removeAttribute('data-width-frozen');
    const oldCg = clone.querySelector(':scope > colgroup[data-generated-widths]');
    if (oldCg) oldCg.remove();
    clone.style.cssText += ';width:'+width+'px;max-width:'+width+'px;table-layout:auto!important;';
    clone.style.fontSize = TABLE_LAYOUT_BASE_FONT + 'px';
    clone.querySelectorAll('*').forEach(function(el){
      el.style.removeProperty('width');
      el.style.removeProperty('min-width');
      el.style.removeProperty('max-width');
      el.style.removeProperty('table-layout');
    });
    clone.querySelectorAll('th,td').forEach(function(cell){
      cell.style.fontSize = TABLE_LAYOUT_BASE_FONT + 'px';
      cell.style.whiteSpace = 'normal';
      cell.style.wordBreak = 'normal';
      cell.style.overflowWrap = 'break-word';
    });
    cloneHost.appendChild(clone);
    document.body.appendChild(cloneHost);

    /* 優先找一列真正涵蓋全部欄位、且沒有 colspan 的資料列。 */
    let fullRow = null, maxCount = 0;
    Array.from(clone.rows).forEach(function(row){
      const cells = Array.from(row.cells);
      const count = cells.length;
      if (count > maxCount && cells.length > 1 && cells.every(function(c){ return !c.getAttribute('colspan') || c.getAttribute('colspan') === '1'; })) {
        maxCount = count; fullRow = row;
      }
    });
    if (!fullRow) { cloneHost.remove(); return; }

    const widthsPx = Array.from(fullRow.cells).map(function(cell){ return Math.max(1, cell.getBoundingClientRect().width); });
    const totalPx = widthsPx.reduce(function(a,b){ return a+b; },0);
    if (!totalPx || widthsPx.length < 2) { cloneHost.remove(); return; }
    const widths = widthsPx.map(function(v){ return v / totalPx * 100; });
    cloneHost.remove();

    const old = table.querySelector(':scope > colgroup[data-generated-widths]');
    if (old) old.remove();
    const cg = document.createElement('colgroup');
    cg.setAttribute('data-generated-widths','1');
    widths.forEach(function(w){
      const col = document.createElement('col');
      col.style.width = w.toFixed(3) + '%';
      cg.appendChild(col);
    });
    table.insertBefore(cg, table.firstChild);
    table.setAttribute('data-width-frozen','1');
    table.style.tableLayout = 'fixed';
  });
}

/* 螢幕尺寸／平板轉向才重新計算；調字級不觸發重算。 */
(function(){
  let timer = null;
  function onResize(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      resetAdaptiveTableWidths(document);
      freezeAdaptiveTableWidths(document);
    }, 180);
  }
  window.addEventListener('resize', onResize, {passive:true});
  window.addEventListener('orientationchange', onResize, {passive:true});
})();

/* 錯綜·交蹉語次：分步動畫（1324 → 1234） */
function cuoStep(btn){
  const box=btn.closest('.cuo2');
  let step=parseInt(box.dataset.step||'0')+1;
  box.dataset.step=step;
  const cs=[...box.querySelectorAll('.cuo2-stage .cuo2-c')];
  const tip=box.querySelector('.cuo2-tip');
  const res=box.querySelector('.cuo2-res');
  function byN(n){ return cs.find(function(c){ return c.dataset.n===String(n); }); }
  if(step===1){
    byN(1).classList.add('lit','g1');
    byN(2).classList.add('lit','g1');
    tip.textContent='① 先找出第 1 句配對的下句 → 是「2」，不是緊鄰的「3」';
  } else if(step===2){
    byN(3).classList.add('lit','g2');
    byN(4).classList.add('lit','g2');
    tip.textContent='② 剩下的「3」配「4」，也被中間隔開了';
  } else if(step===3){
    cs.forEach(function(c){ c.classList.add('shift'); });
    tip.textContent='③ 把它們拉回原位……';
  } else if(step===4){
    res.classList.add('show');
    tip.textContent='④ 還原完成：1‧2 ／ 3‧4';
    btn.disabled=true; btn.textContent='✓ 完成';
  }
}
function cuoReset(btn){
  const box=btn.closest('.cuo2');
  box.dataset.step='0';
  box.querySelectorAll('.cuo2-c').forEach(function(c){ c.classList.remove('lit','g1','g2','shift'); });
  box.querySelector('.cuo2-res').classList.remove('show');
  box.querySelector('.cuo2-tip').textContent='';
  const nb=box.querySelector('.cuo2-btn');
  nb.disabled=false; nb.textContent='▶ 下一步';
}

/* 錯綜：交錯語次動畫 */
function cuoPlay(btn){
  const box=btn.closest('.cuo-box');
  box.querySelectorAll('.cuo-hide').forEach(function(el){ el.classList.remove('cuo-hide'); });
  const A=box.querySelector('#cuoA');
  if(A){
    const cs=[...A.querySelectorAll('.cuo-c')];
    cs.forEach(function(c,i){ setTimeout(function(){ c.classList.add('lit'); }, i*280); });
  }
  const B=box.querySelector('#cuoB');
  if(B){
    setTimeout(function(){
      [...B.querySelectorAll('.cuo-c')].forEach(function(c,i){
        setTimeout(function(){ c.classList.add('lit'); }, i*280);
      });
    }, 500);
  }
  btn.textContent='↻ 重新播放';
  btn.onclick=function(){
    box.querySelectorAll('.cuo-c').forEach(function(c){ c.classList.remove('lit'); });
    setTimeout(function(){ cuoPlay(btn); }, 200);
  };
}

const CLS_LIST = ['建一忠','建一孝','冷一忠','冷一孝'];
let clsCur = CLS_LIST[0];
function clsKey(){ return 'cls_records_v1'; }
function clsLoad(){ try { return JSON.parse(localStorage.getItem(clsKey()) || '{}'); } catch(e){ return {}; } }
function clsSave(d){ try { localStorage.setItem(clsKey(), JSON.stringify(d)); } catch(e){ alert('儲存失敗，可能是瀏覽器限制。'); } }
function clsToggle(){ document.getElementById('cls-panel').classList.toggle('open'); clsRender(); }
